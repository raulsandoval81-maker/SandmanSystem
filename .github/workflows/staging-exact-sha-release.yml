        if: always()
        env:
          BASELINE_OUTCOME: ${{ steps.historical-baseline.outcome }}
        run: |
          echo "Historical reconciliation suite: ${BASELINE_OUTCOME}. This is non-gating technical debt and does not certify unrelated regressions." >> "$GITHUB_STEP_SUMMARY"
      - name: Test trusted release policy
        working-directory: trusted-tooling
        run: node --test tests/functions/staging-exact-sha-release.test.mjs
      - name: Prepare artifacts with trusted tooling
        run: node trusted-tooling/scripts/staging/prepare-exact-sha-release.mjs "${{ inputs.release_id }}" application-source release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: exact-sha-staging-release-${{ steps.release.outputs.application_sha }}
          path: release-artifacts
          if-no-files-found: error

  preflight:
    needs: validate-source
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          path: trusted-tooling
          persist-credentials: false
      - id: marker-auth
        name: Authenticate as the established staging marker reader
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: sandman-staging-deployer@sandman-combat-staging.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
          token_format: access_token
      - name: Read only the synthetic marker
        env:
          ACCESS_TOKEN: ${{ steps.marker-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://firestore.googleapis.com/v1/projects/sandman-combat-staging/databases/(default)/documents/stagingMetadata/wrestling-auto" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s),f=d.fields||{}; console.log(JSON.stringify({projectId:f.projectId?.stringValue,environment:f.environment?.stringValue,syntheticDataOnly:f.syntheticDataOnly?.booleanValue}))})' \
            > marker.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://firebasehosting.googleapis.com/v1beta1/sites/sandman-combat-staging/releases?pageSize=1" \
            > hosting-release-before.json
          echo '{}' > runtimes.json
          if test "${{ needs.validate-source.outputs.deploy_functions }}" = "false"; then
            node trusted-tooling/scripts/staging/verify-exact-sha-remote-preflight.mjs "${{ inputs.release_id }}" marker.json runtimes.json
          fi
      - id: function-auth
        if: ${{ needs.validate-source.outputs.deploy_functions == 'true' }}
        name: Authenticate as the dedicated Practice deployer
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: ${{ inputs.release_id == 'cross-academy-pr253-e9980457' && 'sandman-attendance-deployer@sandman-combat-staging.iam.gserviceaccount.com' || 'sandman-practice-deployer@sandman-combat-staging.iam.gserviceaccount.com' }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Verify and preserve callable configuration and IAM
        if: ${{ needs.validate-source.outputs.deploy_functions == 'true' }}
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          functions="$(node -e 'const r=require("./trusted-tooling/scripts/staging/approved-exact-sha-releases.json")[process.env.RELEASE_ID];console.log(r.functions.join("\n"))')"
          while IFS= read -r fn; do
            if gcloud functions describe "${fn}" --gen2 --region us-central1 --project sandman-combat-staging --format=json > "${fn}-describe.json"; then
              mv "${fn}-describe.json" "${fn}-before.json"
              gcloud functions get-iam-policy "${fn}" --gen2 --region us-central1 --project sandman-combat-staging --format=json > "${fn}-function-iam-before.json"
              service="$(node -e 'const d=require(`./${process.argv[1]}-before.json`);process.stdout.write(d.serviceConfig.service.split("/").at(-1))' "${fn}")"
              gcloud run services get-iam-policy "${service}" --region us-central1 --project sandman-combat-staging --format=json > "${fn}-run-iam-before.json"
              gcloud run services describe "${service}" --region us-central1 --project sandman-combat-staging --format=json > "${fn}-run-service-before.json"
            else
              rm -f "${fn}-describe.json"
              node -e 'const r=require("./trusted-tooling/scripts/staging/approved-exact-sha-releases.json")[process.env.RELEASE_ID];if(!(r.newFunctions||[]).includes(process.argv[1]))process.exit(64)' "${fn}"
              printf '{"absent":true}\n' > "${fn}-before.json"
              printf '{"absent":true}\n' > "${fn}-function-iam-before.json"
              printf '{"absent":true}\n' > "${fn}-run-iam-before.json"
              printf '{"absent":true}\n' > "${fn}-run-service-before.json"
            fi
          done <<< "${functions}"
          node -e 'const fs=require("fs");const r=require("./trusted-tooling/scripts/staging/approved-exact-sha-releases.json")[process.env.RELEASE_ID];console.log(JSON.stringify(Object.fromEntries(r.functions.map(n=>{const d=JSON.parse(fs.readFileSync(`${n}-before.json`));return[n,d.absent?"__absent__":d.serviceConfig?.serviceAccountEmail]}))))' > runtimes.json
          node trusted-tooling/scripts/staging/verify-exact-sha-remote-preflight.mjs "${{ inputs.release_id }}" marker.json runtimes.json
          node --input-type=module -e 'import {readFile} from "node:fs/promises"; import {loadRelease,validateFunctionConfiguration,verifyInvokerPolicy} from "./trusted-tooling/scripts/staging/exact-sha-release-policy.mjs"; const r=await loadRelease(process.argv[1]); for(const n of r.functions){const d=JSON.parse(await readFile(`${n}-before.json`,"utf8"));if(!d.absent){validateFunctionConfiguration(r,n,d);verifyInvokerPolicy(r,n,JSON.parse(await readFile(`${n}-run-service-before.json`,"utf8")),JSON.parse(await readFile(`${n}-function-iam-before.json`,"utf8")),JSON.parse(await readFile(`${n}-run-iam-before.json`,"utf8")))}}' "${{ inputs.release_id }}"
          if test "${RELEASE_ID}" = "cross-academy-pr253-e9980457" && test "${{ inputs.action }}" = "deploy"; then
            node -e 'const fs=require("fs");const r=require("./trusted-tooling/scripts/staging/approved-exact-sha-releases.json")[process.env.RELEASE_ID];const missing=r.newFunctions.filter(n=>JSON.parse(fs.readFileSync(`${n}-before.json`)).absent);if(missing.length){console.error(`::error title=Separate callable bootstrap required::${missing.join(", ")} must be created by the separately approved bootstrap before the routine release can run.`);process.exit(1)}'
          fi
          node trusted-tooling/scripts/staging/gcloud-function-release.mjs rollback-evidence "${{ inputs.release_id }}" unused . > rollback-evidence.json
      - name: Verify all routine deployer and service-account permissions
        if: ${{ needs.validate-source.outputs.deploy_functions == 'true' }}
        working-directory: trusted-tooling
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          node --input-type=module -e 'import {loadRelease} from "./scripts/staging/exact-sha-release-policy.mjs";import {permissionPlan} from "./scripts/staging/gcloud-function-release.mjs";const r=await loadRelease(process.env.RELEASE_ID);console.log(JSON.stringify(permissionPlan(r)))' > ../permission-plan.json
          access_token="$(gcloud auth print-access-token)"
          project_permissions="$(node -e 'const p=require("../permission-plan.json");process.stdout.write(JSON.stringify({permissions:p.deployer}))')"
          if test "$(node -e 'process.stdout.write(String(require("../permission-plan.json").deployer.length))')" != "0"; then
            response="$(curl --fail --silent --show-error -H "Authorization: Bearer ${access_token}" -H "Content-Type: application/json" -X POST -d "${project_permissions}" "https://cloudresourcemanager.googleapis.com/v1/projects/sandman-combat-staging:testIamPermissions")"
            node -e 'const plan=require("../permission-plan.json"),actual=JSON.parse(process.argv[1]).permissions||[];const missing=plan.deployer.filter(p=>!actual.includes(p));console.log(JSON.stringify({principal:process.env.GOOGLE_SERVICE_ACCOUNT_EMAIL||"dedicated function deployer",required:plan.deployer,effective:actual,missing}));if(missing.length){console.error(`::error title=Missing aggregate deployer permissions::${missing.join(", ")}`);process.exit(1)}' "${response}"
          fi
          service_accounts="$(node -e 'const p=require("../permission-plan.json");console.log(p.serviceAccounts.map(x=>x.account).join("\n"))')"
          missing_accounts=""
          while IFS= read -r service_account; do
            response="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${access_token}" \
              -H "Content-Type: application/json" \
              -X POST \
              -d '{"permissions":["iam.serviceAccounts.actAs"]}' \
              "https://iam.googleapis.com/v1/projects/sandman-combat-staging/serviceAccounts/${service_account}:testIamPermissions")"
            permission="$(node -e 'const d=JSON.parse(process.argv[1]);process.stdout.write((d.permissions||[]).join(","))' "${response}")"
            if test "${permission}" != "iam.serviceAccounts.actAs"; then
              missing_accounts="${missing_accounts}${service_account}\n"
            else
              echo "Verified iam.serviceAccounts.actAs on ${service_account}."
            fi
          done <<< "${service_accounts}"
          if test -n "${missing_accounts}"; then
            echo "::error title=Missing aggregate service-account permissions::iam.serviceAccounts.actAs is missing on: $(printf '%b' "${missing_accounts}" | tr '\n' ' ')"
            exit 1
          fi
          if test "${RELEASE_ID}" = "cross-academy-pr253-e9980457"; then
            missing_build=""
            node -e 'const r=require("./scripts/staging/approved-exact-sha-releases.json")[process.env.RELEASE_ID];for(const [permission,resource] of Object.entries(r.buildPermissionResources))console.log(`${permission}\t${resource}`)' > ../build-permission-checks.tsv
            while IFS=$'\t' read -r permission resource; do
              payload="$(node -e 'console.log(JSON.stringify({accessTuple:{principal:`//iam.googleapis.com/projects/-/serviceAccounts/${process.argv[1]}`,fullResourceName:process.argv[2],permission:process.argv[3]}))' "sandman-attendance-build@sandman-combat-staging.iam.gserviceaccount.com" "${resource}" "${permission}")"
              status="$(curl --silent --show-error -o ../build-permission-response.json -w '%{http_code}' -H "Authorization: Bearer ${access_token}" -H "Content-Type: application/json" -X POST -d "${payload}" "https://policytroubleshooter.googleapis.com/v3/iam:troubleshoot")"
              granted="$(node -e 'const fs=require("fs");let d={};try{d=JSON.parse(fs.readFileSync(process.argv[1]))}catch{};process.stdout.write(d.access===1||d.access==="GRANTED"?"true":"false")' ../build-permission-response.json)"
              if test "${status}" != "200" || test "${granted}" != "true"; then missing_build="${missing_build}${permission} on ${resource}\n"; fi
            done < ../build-permission-checks.tsv
            if test -n "${missing_build}"; then
              echo "::error title=Build identity permission certification failed::$(printf '%b' "${missing_build}" | tr '\n' '; ')"
              echo "The preflight identity also requires policytroubleshooter.iam.troubleshoot to certify these grants without impersonating the build account."
              exit 1
            fi
          fi
      - name: Preserve read-only recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: staging-recovery-before-${{ needs.validate-source.outputs.application_sha }}
          path: |
            marker.json
            runtimes.json
            hosting-release-before.json
            permission-plan.json
            build-permission-checks.tsv
            rollback-evidence.json
            *-before.json
          if-no-files-found: error

  deploy-functions:
    if: ${{ inputs.action == 'deploy' }}
    needs: [validate-source, preflight]
    runs-on: ubuntu-24.04
    environment: staging
    strategy:
      max-parallel: 1
      matrix:
        function_name: ${{ fromJSON(needs.validate-source.outputs.function_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: trusted-tooling
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: ${{ needs.validate-source.outputs.deploy_functions == 'true' }}
        with:
          name: exact-sha-staging-release-${{ needs.validate-source.outputs.application_sha }}
          path: release-artifacts
      - uses: google-github-actions/auth@v3
        if: ${{ needs.validate-source.outputs.deploy_functions == 'true' }}
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: ${{ inputs.release_id == 'cross-academy-pr253-e9980457' && 'sandman-attendance-deployer@sandman-combat-staging.iam.gserviceaccount.com' || 'sandman-practice-deployer@sandman-combat-staging.iam.gserviceaccount.com' }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Verify targeted callable deployment inputs
        if: ${{ needs.validate-source.outputs.deploy_functions == 'true' }}
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("release-artifacts/firebase.functions.json"));const p=JSON.parse(fs.readFileSync("release-artifacts/functions/package.json")); if(a.functions.source!=="functions"||a.functions.codebase!=="default"||a.functions.runtime!=="nodejs22"||p.main!=="staging-release-entry.cjs") process.exit(64);'
          test ! -e release-artifacts/functions/.env.production
          test ! -e release-artifacts/functions/.env.sandmandashboard
          npm ci --omit=dev --prefix release-artifacts/functions
          node -e 'const f=require("./release-artifacts/functions")[process.argv[1]];if(!f?.__endpoint?.callableTrigger)process.exit(64)' "${{ matrix.function_name }}"
      - name: Deploy one allowlisted callable
        if: ${{ needs.validate-source.outputs.deploy_functions == 'true' }}
        run: |
          set -euo pipefail
          case "${{ matrix.function_name }}" in savePracticeSessionMemory|closePracticeSession|searchPracticeAttendanceAthletes|getPracticeAttendanceReview|updatePracticeCheckIn|finalizePracticeAttendance) ;; *) exit 64 ;; esac
          if test "${{ inputs.release_id }}" = "cross-academy-pr253-e9980457"; then
            export SANDMAN_BOOTSTRAP_VERIFIED=true
            node trusted-tooling/scripts/staging/gcloud-function-release.mjs deploy \
              "${{ inputs.release_id }}" "${{ matrix.function_name }}" release-artifacts/functions
          else
            cd release-artifacts
            npx --yes firebase-tools@15.11.0 deploy --config firebase.functions.json \
              --project sandman-combat-staging \
              --only "functions:default:${{ matrix.function_name }}" \
              --non-interactive
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.release_id == 'cross-academy-pr253-e9980457' }}
        with:
          name: function-deploy-receipt-${{ matrix.function_name }}-${{ needs.validate-source.outputs.application_sha }}
          path: function-deploy-receipt.json
          if-no-files-found: warn

  deploy-hosting:
    if: ${{ inputs.action == 'deploy' }}
    needs: [validate-source, preflight, deploy-functions]
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: exact-sha-staging-release-${{ needs.validate-source.outputs.application_sha }}
          path: release-artifacts
      - uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: sandman-staging-deployer@sandman-combat-staging.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Deploy only the isolated staging Hosting site
        run: npx --yes firebase-tools@15.11.0 deploy --config release-artifacts/firebase.hosting.json --project sandman-combat-staging --only hosting --non-interactive

  verify-deployment:
    if: ${{ inputs.action == 'deploy' }}
    needs: [validate-source, preflight, deploy-functions, deploy-hosting]
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          path: trusted-tooling
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: staging-recovery-before-${{ needs.validate-source.outputs.application_sha }}
          path: before
      - uses: google-github-actions/auth@v3
        if: ${{ needs.validate-source.outputs.deploy_functions == 'true' }}
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: ${{ inputs.release_id == 'cross-academy-pr253-e9980457' && 'sandman-attendance-deployer@sandman-combat-staging.iam.gserviceaccount.com' || 'sandman-practice-deployer@sandman-combat-staging.iam.gserviceaccount.com' }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Compare callable configuration and IAM after deployment
        if: ${{ needs.validate-source.outputs.deploy_functions == 'true' }}
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          functions="$(node -e 'const r=require("./trusted-tooling/scripts/staging/approved-exact-sha-releases.json")[process.env.RELEASE_ID];console.log(r.functions.join("\n"))')"
          while IFS= read -r fn; do
            gcloud functions describe "${fn}" --gen2 --region us-central1 --project sandman-combat-staging --format=json > "${fn}-after.json"
            gcloud functions get-iam-policy "${fn}" --gen2 --region us-central1 --project sandman-combat-staging --format=json > "${fn}-function-iam-after.json"
            service="$(node -e 'const d=require(`./${process.argv[1]}-after.json`);process.stdout.write(d.serviceConfig.service.split("/").at(-1))' "${fn}")"
            gcloud run services get-iam-policy "${service}" --region us-central1 --project sandman-combat-staging --format=json > "${fn}-run-iam-after.json"
            gcloud run services describe "${service}" --region us-central1 --project sandman-combat-staging --format=json > "${fn}-run-service-after.json"
          done <<< "${functions}"
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { loadRelease, validateFunctionConfiguration, verifyPreservedDeployment, verifyInvokerPolicy } from "./trusted-tooling/scripts/staging/exact-sha-release-policy.mjs";
          const release = await loadRelease("${{ inputs.release_id }}");
          for (const name of release.functions) {
            const read = path => readFile(path, "utf8").then(JSON.parse);
            const before = await read(`before/${name}-before.json`);
            const after = await read(`${name}-after.json`);
            verifyInvokerPolicy(release, name, await read(`${name}-run-service-after.json`), await read(`${name}-function-iam-after.json`), await read(`${name}-run-iam-after.json`));
            if (before.absent) {
              validateFunctionConfiguration(release, name, after);
            } else {
              verifyPreservedDeployment(release, name, before, after,
                await read(`before/${name}-function-iam-before.json`), await read(`${name}-function-iam-after.json`),
                await read(`before/${name}-run-iam-before.json`), await read(`${name}-run-iam-after.json`));
            }
          }
          NODE
      - id: hosting-auth
        name: Authenticate as the isolated Hosting deployer for verification
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: sandman-staging-deployer@sandman-combat-staging.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
          token_format: access_token
      - name: Record deployed staging Hosting release
        env:
          ACCESS_TOKEN: ${{ steps.hosting-auth.outputs.access_token }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://firebasehosting.googleapis.com/v1beta1/sites/sandman-combat-staging/releases?pageSize=1" \
            > hosting-release-after.json
      - uses: actions/upload-artifact@v4
        with:
          name: staging-release-after-${{ needs.validate-source.outputs.application_sha }}
          path: |
            *-after.json
            hosting-release-after.json
          if-no-files-found: error
