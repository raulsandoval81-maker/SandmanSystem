377" || test "${RELEASE_ID}" = "bulk-xp-fixed-pr229-3fbb3e0" || test "${RELEASE_ID}" = "xp-http-headers-pr231-fe378b4" || test "${RELEASE_ID}" = "xp-client-auth-pr240-ee96af6a" || test "${RELEASE_ID}" = "cross-academy-pr253-e9980457"; then
            grep -q 'NORMAL_TRAINING_GROUP_CAPACITY = 3' application-source/public/coaches/attendance/practice-group-policy.js
            grep -q 'MAX_TRAINING_GROUPS = 4' application-source/public/coaches/attendance/practice-group-policy.js
            grep -q 'fourGroupAcknowledgement' application-source/public/coaches/attendance/session.html
