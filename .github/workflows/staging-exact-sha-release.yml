        continue-on-error: true
        run: node --test application-source/tests/functions/session-builder-session-memory.test.mjs
      - name: Record Session Builder memory baseline status
        if: ${{ always() && (inputs.release_id == 'r2c-wrestling-waves-pr115-18d46b08' || inputs.release_id == 'hybrid-handoff-pr117-4a8402b9' || inputs.release_id == 'hybrid-stage4-pr120-8a122108' || inputs.release_id == 'hybrid-stage4-fixed-pr122-7c625858' || inputs.release_id == 'combat-setup-pr125-8a5ae0f2' || inputs.release_id == 'combat-setup-fixed-pr127-fcd6f016' || inputs.release_id == 'combat-setup-regexfix-pr129-b7545f30' || inputs.release_id == 'combat-setup-final-pr131-ea296f66' || inputs.release_id == 'hybrid-handoff-pr133-8af57906' || inputs.release_id == 'combat-setup-pr138-ca4e23be') }}
        env:
          BASELINE_OUTCOME: ${{ steps.session-memory-baseline.outcome }}
