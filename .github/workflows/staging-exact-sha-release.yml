name: Controlled exact-SHA staging release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Reviewed release manifest entry
        required: true
        default: hybrid-pr99-5ed90c5c
        type: choice
        options:
          - hybrid-pr99-5ed90c5c
          - practice-groups-pr113-27adc626
          - r2c-wrestling-waves-pr115-18d46b08
          - hybrid-handoff-pr117-4a8402b9
          - hybrid-stage4-pr120-8a122108
          - hybrid-stage4-fixed-pr122-7c625858
          - combat-setup-pr125-8a5ae0f2
          - combat-setup-fixed-pr127-fcd6f016
          - combat-setup-regexfix-pr129-b7545f30
          - combat-setup-final-pr131-ea296f66
          - hybrid-handoff-pr133-8af57906
          - session-hierarchy-pr135-a6b674e3
          - combat-setup-pr138-ca4e23be
          - checkin-hybrid-pr140-59632c80
          - hybrid-review-pr142-bd0e1f2e
          - checkin-step3-pr144-f87dc84b
          - tier-aware-groups-pr150-36374e8d
          - unified-hybrid-pr152-0c2dc9d8
          - unified-hybrid-pr155-34fa3550
      action:
        description: Validate, diagnose authorization, or execute the approved staging release
        required: true
        default: validate
        type: choice
        options:
          - validate
          - diagnose
          - deploy
      confirm_project:
        description: Type sandman-combat-staging
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: controlled-exact-sha-staging-release
  cancel-in-progress: false

jobs:
  diagnose-authorization:
    if: ${{ inputs.action == 'diagnose' }}
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - name: Check out trusted deployment tooling
        uses: actions/checkout@v4
        with:
          path: trusted-tooling
          persist-credentials: false
      - name: Confirm trusted staging diagnostic boundary
        working-directory: trusted-tooling
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "raulsandoval81-maker/SandmanSystem"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_WORKFLOW_REF}" = "raulsandoval81-maker/SandmanSystem/.github/workflows/staging-exact-sha-release.yml@refs/heads/main"
          test "${CONFIRM_PROJECT}" = "sandman-combat-staging"
          node -e '
            const release = require("./scripts/staging/approved-exact-sha-releases.json")[process.env.RELEASE_ID];
            if (!release || release.projectId !== "sandman-combat-staging" ||
                release.repository !== "raulsandoval81-maker/SandmanSystem" ||
                release.functionDeployer !== "sandman-practice-deployer@sandman-combat-staging.iam.gserviceaccount.com" ||
                !/^[0-9a-f]{40}$/.test(release.applicationSha)) process.exit(64);
          '
      - name: Authenticate as the dedicated Practice deployer
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: sandman-practice-deployer@sandman-combat-staging.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Inspect and verify sanitized identity and credential metadata
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, "utf8"));
            const url = value.service_account_impersonation_url ? new URL(value.service_account_impersonation_url) : null;
            const encodedTarget = url?.pathname.split("/serviceAccounts/")[1]?.split(":")[0] || "";
            const impersonationTarget = decodeURIComponent(encodedTarget);
            const expected = "sandman-practice-deployer@sandman-combat-staging.iam.gserviceaccount.com";
            if (value.type !== "external_account" || impersonationTarget !== expected) process.exit(64);
            console.log(JSON.stringify({
              authenticated_principal: impersonationTarget,
              credential_type: value.type,
              quota_project_id: value.quota_project_id || null,
              workforce_pool_user_project: value.workforce_pool_user_project || null,
              impersonation_target: impersonationTarget,
            }));
          '
      - name: Verify effective project permissions and OAuth scopes
        run: |
          set -euo pipefail
          access_token="$(gcloud auth print-access-token)"
          permissions="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${access_token}" \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{"permissions":["firebase.projects.get","serviceusage.services.use"]}' \
            "https://cloudresourcemanager.googleapis.com/v1/projects/sandman-combat-staging:testIamPermissions")"
          node -e '
            const value = JSON.parse(process.argv[1]);
            const required = ["firebase.projects.get", "serviceusage.services.use"];
            const allowed = value.permissions || [];
            console.log(JSON.stringify({required_permissions: required, effective_permissions: allowed,
              missing_permissions: required.filter((permission) => !allowed.includes(permission))}));
          ' "${permissions}"
          token_info="$(curl --fail --silent --show-error \
            --data-urlencode "access_token=${access_token}" \
            "https://oauth2.googleapis.com/tokeninfo")"
          node -e '
            const value = JSON.parse(process.argv[1]);
            const expected = "sandman-practice-deployer@sandman-combat-staging.iam.gserviceaccount.com";
            if (value.email !== expected) process.exit(64);
            console.log(JSON.stringify({token_email: value.email || null,
              token_audience: value.aud || value.audience || null,
              oauth_scopes: String(value.scope || "").split(" ").filter(Boolean),
              expires_in_seconds: value.expires_in || null}));
          ' "${token_info}"
      - name: Compare Firebase Admin SDK configuration authorization
        run: |
          set -euo pipefail
          access_token="$(gcloud auth print-access-token)"
          endpoint="https://firebase.googleapis.com/v1beta1/projects/sandman-combat-staging/adminSdkConfig"
          normal_status="$(curl --silent --show-error -H "Authorization: Bearer ${access_token}" \
            -o normal-response.json -w '%{http_code}' "${endpoint}")"
          quota_status="$(curl --silent --show-error -H "Authorization: Bearer ${access_token}" \
            -H "x-goog-user-project: sandman-combat-staging" \
            -o quota-response.json -w '%{http_code}' "${endpoint}")"
          node -e '
            const fs = require("fs");
            function sanitizedMessage(value) {
              if (!value) return null;
              const redacted = String(value)
                .replace(/\bBearer\s+[A-Za-z0-9._~+\/-]+=*/gi, "Bearer [REDACTED]")
                .replace(/\beyJ[A-Za-z0-9_-]*\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\b/g, "[REDACTED_JWT]")
                .replace(/\bAIza[A-Za-z0-9_-]{20,}\b/g, "[REDACTED_API_KEY]")
                .replace(/\b(authorization)\s*[:=]\s*[^\r\n,;]+/gi, "$1: [REDACTED]")
                .replace(/\b(access[_-]?token|id[_-]?token|refresh[_-]?token|client[_-]?secret|private[_-]?key|credential)\s*[:=]\s*[^\s,;]+/gi, "$1=[REDACTED]");
              return redacted.length > 512 ? `${redacted.slice(0, 512)}…[TRUNCATED]` : redacted;
            }
            function sanitized(path, status) {
              let body = {};
              try { body = JSON.parse(fs.readFileSync(path, "utf8")); } catch {}
              return {http_status: Number(status), error: body.error ? {
                code: body.error.code || null, status: body.error.status || null,
                message: sanitizedMessage(body.error.message),
                reasons: (body.error.details || []).map((detail) => detail.reason).filter(Boolean),
              } : null, success_fields: body.error ? [] : Object.keys(body).sort()};
            }
            console.log(JSON.stringify({normal_request: sanitized("normal-response.json", process.argv[1]),
              explicit_quota_project_request: sanitized("quota-response.json", process.argv[2])}));
          ' "${normal_status}" "${quota_status}"
          if test "${normal_status}" -ge 500 || test "${quota_status}" -ge 500; then exit 1; fi

  validate-source:
    if: ${{ inputs.action != 'diagnose' }}
    runs-on: ubuntu-24.04
    environment: staging
    outputs:
      application_sha: ${{ steps.release.outputs.application_sha }}
      deploy_functions: ${{ steps.release.outputs.deploy_functions }}
    steps:
      - name: Check out trusted deployment tooling
        uses: actions/checkout@v4
        with:
          path: trusted-tooling
          persist-credentials: false
      - id: release
        name: Resolve checked-in reviewed release
        working-directory: trusted-tooling
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "raulsandoval81-maker/SandmanSystem"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${CONFIRM_PROJECT}" = "sandman-combat-staging"
          sha="$(node -e 'const r=require("./scripts/staging/approved-exact-sha-releases.json")[process.env.RELEASE_ID]; if(!r)process.exit(64); process.stdout.write(r.applicationSha)')"
          test "${#sha}" = 40
          echo "application_sha=${sha}" >> "${GITHUB_OUTPUT}"
          deploy_functions="$(node -e 'const r=require("./scripts/staging/approved-exact-sha-releases.json")[process.env.RELEASE_ID];process.stdout.write(r.functions.length ? "true" : "false")')"
          echo "deploy_functions=${deploy_functions}" >> "${GITHUB_OUTPUT}"
      - name: Check out immutable application source separately
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.application_sha }}
          path: application-source
          persist-credentials: false
          fetch-depth: 0
      - name: Verify immutable source and repository identity
        env:
          APPLICATION_SHA: ${{ steps.release.outputs.application_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          STAGING_WIF_PROVIDER: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
        run: |
          set -euo pipefail
          test "$(git -C application-source rev-parse HEAD)" = "${APPLICATION_SHA}"
          test "$(git -C application-source status --porcelain=v1 --untracked-files=all)" = ""
          test "$(git -C application-source config --get remote.origin.url)" = "https://github.com/raulsandoval81-maker/SandmanSystem"
          ancestor="$(node -e 'const r=require("./trusted-tooling/scripts/staging/approved-exact-sha-releases.json")[process.env.RELEASE_ID];process.stdout.write(r.requiredAncestorSha||"")')"
          if test -n "${ancestor}"; then
            git -C application-source merge-base --is-ancestor "${ancestor}" HEAD
            git -C application-source diff --name-only "${ancestor}..HEAD" | sort > /tmp/actual-release-files
            node -e 'const r=require("./trusted-tooling/scripts/staging/approved-exact-sha-releases.json")[process.env.RELEASE_ID];console.log(r.allowedChangedFiles.slice().sort().join("\n"))' > /tmp/approved-release-files
            diff -u /tmp/approved-release-files /tmp/actual-release-files
          fi
          cd trusted-tooling
          node --input-type=module -e 'import {loadRelease,validateRelease} from "./scripts/staging/exact-sha-release-policy.mjs"; const r=await loadRelease(process.env.RELEASE_ID); validateRelease(r,{repository:process.env.GITHUB_REPOSITORY,workflowRef:process.env.GITHUB_WORKFLOW_REF,checkedOutSha:process.env.APPLICATION_SHA,projectId:"sandman-combat-staging",confirmProject:process.env.CONFIRM_PROJECT,wifProvider:process.env.STAGING_WIF_PROVIDER,hostingDeployer:r.hostingDeployer,functionDeployer:r.functionDeployer,functionRuntime:r.functionRuntime,authorizationAvailable:true});'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: application-source/functions/package-lock.json
      - name: Compile and run blocking HYBRID regression tests
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          npm ci --prefix application-source/functions
          npm --prefix application-source/functions run build
          node --test application-source/tests/functions/hybrid-session-planning-policy.test.mjs
          # Fail with actionable checkout evidence rather than Node's ambiguous
          # "Could not find" message. Do not skip any required regression test.
          echo "Pinned application revision: $(git -C application-source rev-parse HEAD)"
          git -C application-source ls-files --error-unmatch tests/functions/practice-group-policy.test.mjs
          test -f application-source/tests/functions/practice-group-policy.test.mjs || {
            echo "::error::Required practice-group-policy test is absent from immutable source checkout."
            git -C application-source ls-tree -r --name-only HEAD tests/functions | grep -E 'group|practice' || true
            exit 1
          }
          node --test application-source/tests/functions/practice-group-policy.test.mjs
          if test "${RELEASE_ID}" = "hybrid-stage4-pr120-8a122108" || test "${RELEASE_ID}" = "hybrid-stage4-fixed-pr122-7c625858" || test "${RELEASE_ID}" = "combat-setup-pr125-8a5ae0f2" || test "${RELEASE_ID}" = "combat-setup-fixed-pr127-fcd6f016" || test "${RELEASE_ID}" = "combat-setup-regexfix-pr129-b7545f30" || test "${RELEASE_ID}" = "combat-setup-final-pr131-ea296f66" || test "${RELEASE_ID}" = "hybrid-handoff-pr133-8af57906" || test "${RELEASE_ID}" = "combat-setup-pr138-ca4e23be"; then
            node --test application-source/tests/functions/checkin-hybrid-clipboard-route.test.mjs
            node --test application-source/tests/functions/post-attendance-hybrid-placement.test.mjs
            node --check application-source/public/coaches/attendance/hybrid-group-planning.js
          fi
          if test "${RELEASE_ID}" = "hybrid-handoff-pr117-4a8402b9"; then
            node --test application-source/tests/functions/checkin-hybrid-clipboard-route.test.mjs
          fi
          if test "${RELEASE_ID}" = "r2c-wrestling-waves-pr115-18d46b08" || test "${RELEASE_ID}" = "hybrid-handoff-pr117-4a8402b9" || test "${RELEASE_ID}" = "hybrid-stage4-pr120-8a122108" || test "${RELEASE_ID}" = "hybrid-stage4-fixed-pr122-7c625858" || test "${RELEASE_ID}" = "combat-setup-pr138-ca4e23be"; then
            node application-source/scripts/generate-youth-wrestling-browser-manifest.mjs
            git -C application-source diff --exit-code -- \
              public/assets/data/youth-wrestling-placement-manifest.json \
              public/assets/js/hybrid/youth/road2champion-wrestling-tier-wave-crosswalk.js
            node --test application-source/tests/functions/road2champion-wrestling-tier-waves.test.mjs
            node --test application-source/tests/functions/practice-closeout-phase4.test.mjs
            node --check application-source/public/assets/js/hybrid/youth/road2champion-wrestling-tier-wave-crosswalk.js
            node --check application-source/public/assets/js/hybrid/youth/road2champion-wrestling-tier-wave-policy.js
            node --check application-source/public/coaches/execution/session-builder/hybrid-planning-policy.js
          fi
          if test "${RELEASE_ID}" = "combat-setup-pr125-8a5ae0f2" || test "${RELEASE_ID}" = "combat-setup-fixed-pr127-fcd6f016" || test "${RELEASE_ID}" = "combat-setup-regexfix-pr129-b7545f30" || test "${RELEASE_ID}" = "combat-setup-final-pr131-ea296f66" || test "${RELEASE_ID}" = "hybrid-handoff-pr133-8af57906" || test "${RELEASE_ID}" = "combat-setup-pr138-ca4e23be"; then
            node --test application-source/tests/functions/combined-practice-setup.test.mjs
            node --test application-source/tests/functions/verified-coach-training-environments.test.mjs
            node --check application-source/public/coaches/execution/session-builder/session-entry-policy.js
          fi
          if test "${RELEASE_ID}" = "hybrid-handoff-pr133-8af57906" || test "${RELEASE_ID}" = "combat-setup-pr138-ca4e23be"; then
            node --test application-source/tests/functions/hybrid-clipboard-handoff-recovery.test.mjs
          fi
          if test "${RELEASE_ID}" = "combat-setup-pr138-ca4e23be"; then
            node --test application-source/tests/functions/attendance-submitted-resume.test.mjs
          fi
          if test "${RELEASE_ID}" = "tier-aware-groups-pr150-36374e8d"; then
            node --test application-source/tests/functions/checkin-hybrid-clipboard-route.test.mjs
            node --test application-source/tests/functions/post-attendance-hybrid-placement.test.mjs
            node --test application-source/tests/functions/hybrid-clipboard-handoff-recovery.test.mjs
            node --test application-source/tests/functions/attendance-submitted-resume.test.mjs
          fi
          if test "${RELEASE_ID}" = "unified-hybrid-pr152-0c2dc9d8" || test "${RELEASE_ID}" = "unified-hybrid-pr155-34fa3550"; then
            node --test \
              application-source/tests/functions/attendance-step3-status.test.mjs \
              application-source/tests/functions/attendance-submitted-resume.test.mjs \
              application-source/tests/functions/checkin-hybrid-clipboard-route.test.mjs \
              application-source/tests/functions/combined-practice-setup.test.mjs \
              application-source/tests/functions/hybrid-clipboard-handoff-recovery.test.mjs \
              application-source/tests/functions/hybrid-review-presentation.test.mjs \
              application-source/tests/functions/post-attendance-hybrid-placement.test.mjs \
              application-source/tests/functions/practice-closeout-phase4.test.mjs \
              application-source/tests/functions/road2champion-wrestling-tier-waves.test.mjs \
              application-source/tests/functions/session-builder-big-clock-drill-run.test.mjs \
              application-source/tests/functions/session-builder-entry-policy.test.mjs \
              application-source/tests/functions/session-builder-session-memory.test.mjs \
              application-source/tests/functions/verified-coach-training-environments.test.mjs
            node --check application-source/public/coaches/attendance/hybrid-group-planning.js
            node --check application-source/public/coaches/execution/clipboard-2.0/clipboard-2.0.js
            node --check application-source/public/coaches/execution/big-clock-2.0/big-clock-2.0.js
            node --check application-source/public/coaches/execution/session-builder/hybrid-planning-policy.js
            node --check application-source/public/coaches/execution/session-builder/session-entry-policy.js
          fi
          node --check application-source/public/coaches/attendance/practice-group-policy.js
          node --check application-source/public/coaches/attendance/session.js
          node --check application-source/public/coaches/execution/session-builder/session-builder.js
          grep -q 'executionMode === "hybrid"' application-source/public/coaches/attendance/session.js
          grep -q 'planning=1' application-source/public/coaches/attendance/session.js
          if test "${RELEASE_ID}" = "tier-aware-groups-pr150-36374e8d" || test "${RELEASE_ID}" = "unified-hybrid-pr152-0c2dc9d8" || test "${RELEASE_ID}" = "unified-hybrid-pr155-34fa3550"; then
            grep -q 'NORMAL_TRAINING_GROUP_CAPACITY = 3' application-source/public/coaches/attendance/practice-group-policy.js
            grep -q 'MAX_TRAINING_GROUPS = 4' application-source/public/coaches/attendance/practice-group-policy.js
            grep -q 'fourGroupAcknowledgement' application-source/public/coaches/attendance/session.html
            grep -q 'trainingGroups: groups' application-source/public/coaches/execution/session-builder/session-builder.js
            ! grep -q 'trainingGroups.slice(0, 3)' application-source/public/coaches/execution/session-builder/session-builder.js
          else
            grep -q 'trainingGroups.slice(0, 3)' application-source/public/coaches/execution/session-builder/session-builder.js
          fi
          grep -q 'autoBlocked = selectedMode === "auto"' application-source/public/coaches/execution/session-builder/session-builder.js
      - name: Session Builder memory inherited baseline (reported, not release-gating)
        id: session-memory-baseline
        if: ${{ inputs.release_id == 'r2c-wrestling-waves-pr115-18d46b08' || inputs.release_id == 'hybrid-handoff-pr117-4a8402b9' || inputs.release_id == 'hybrid-stage4-pr120-8a122108' || inputs.release_id == 'hybrid-stage4-fixed-pr122-7c625858' || inputs.release_id == 'combat-setup-pr125-8a5ae0f2' || inputs.release_id == 'combat-setup-fixed-pr127-fcd6f016' || inputs.release_id == 'combat-setup-regexfix-pr129-b7545f30' || inputs.release_id == 'combat-setup-final-pr131-ea296f66' || inputs.release_id == 'hybrid-handoff-pr133-8af57906' || inputs.release_id == 'combat-setup-pr138-ca4e23be' }}
        continue-on-error: true
        run: node --test application-source/tests/functions/session-builder-session-memory.test.mjs
      - name: Record Session Builder memory baseline status
        if: ${{ always() && (inputs.release_id == 'r2c-wrestling-waves-pr115-18d46b08' || inputs.release_id == 'hybrid-handoff-pr117-4a8402b9' || inputs.release_id == 'hybrid-stage4-pr120-8a122108' || inputs.release_id == 'hybrid-stage4-fixed-pr122-7c625858' || inputs.release_id == 'combat-setup-pr125-8a5ae0f2' || inputs.release_id == 'combat-setup-fixed-pr127-fcd6f016' || inputs.release_id == 'combat-setup-regexfix-pr129-b7545f30' || inputs.release_id == 'combat-setup-final-pr131-ea296f66' || inputs.release_id == 'hybrid-handoff-pr133-8af57906' || inputs.release_id == 'combat-setup-pr138-ca4e23be') }}
        env:
          BASELINE_OUTCOME: ${{ steps.session-memory-baseline.outcome }}
        run: |
          echo "Session Builder memory inherited baseline: ${BASELINE_OUTCOME}. Compare with PR #113 before release approval; this status does not waive new Tier Wave failures." >> "$GITHUB_STEP_SUMMARY"
      - name: Historical reconciliation baseline (reported, not release-gating)
        id: historical-baseline
        continue-on-error: true
        run: |
          set -euo pipefail
          node --test application-source/functions/tests/historicalSkillReconciliation.test.cjs
      - name: Record historical baseline status
        if: always()
        env:
          BASELINE_OUTCOME: ${{ steps.historical-baseline.outcome }}
        run: |
          echo "Historical reconciliation suite: ${BASELINE_OUTCOME}. This is non-gating technical debt and does not certify unrelated regressions." >> "$GITHUB_STEP_SUMMARY"
      - name: Test trusted release policy
        working-directory: trusted-tooling
        run: node --test tests/functions/staging-exact-sha-release.test.mjs
      - name: Prepare artifacts with trusted tooling
        run: node trusted-tooling/scripts/staging/prepare-exact-sha-release.mjs "${{ inputs.release_id }}" application-source release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: exact-sha-staging-release-${{ steps.release.outputs.application_sha }}
          path: release-artifacts
          if-no-files-found: error

  preflight:
    needs: validate-source
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          path: trusted-tooling
          persist-credentials: false
      - id: marker-auth
        name: Authenticate as the established staging marker reader
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: sandman-staging-deployer@sandman-combat-staging.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
          token_format: access_token
      - name: Read only the synthetic marker
        env:
          ACCESS_TOKEN: ${{ steps.marker-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://firestore.googleapis.com/v1/projects/sandman-combat-staging/databases/(default)/documents/stagingMetadata/wrestling-auto" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s),f=d.fields||{}; console.log(JSON.stringify({projectId:f.projectId?.stringValue,environment:f.environment?.stringValue,syntheticDataOnly:f.syntheticDataOnly?.booleanValue}))})' \
            > marker.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://firebasehosting.googleapis.com/v1beta1/sites/sandman-combat-staging/releases?pageSize=1" \
            > hosting-release-before.json
          echo '{}' > runtimes.json
          if test "${{ needs.validate-source.outputs.deploy_functions }}" = "false"; then
            node trusted-tooling/scripts/staging/verify-exact-sha-remote-preflight.mjs "${{ inputs.release_id }}" marker.json runtimes.json
          fi
      - id: function-auth
        if: ${{ needs.validate-source.outputs.deploy_functions == 'true' }}
        name: Authenticate as the dedicated Practice deployer
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: sandman-practice-deployer@sandman-combat-staging.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Verify and preserve callable configuration and IAM
        if: ${{ needs.validate-source.outputs.deploy_functions == 'true' }}
        run: |
          set -euo pipefail
          for fn in savePracticeSessionMemory closePracticeSession; do
            gcloud functions describe "${fn}" --gen2 --region us-central1 --project sandman-combat-staging --format=json > "${fn}-before.json"
            gcloud functions get-iam-policy "${fn}" --gen2 --region us-central1 --project sandman-combat-staging --format=json > "${fn}-function-iam-before.json"
            service="$(node -e 'const d=require(`./${process.argv[1]}-before.json`);process.stdout.write(d.serviceConfig.service.split("/").at(-1))' "${fn}")"
            gcloud run services get-iam-policy "${service}" --region us-central1 --project sandman-combat-staging --format=json > "${fn}-run-iam-before.json"
          done
          node -e 'const fs=require("fs");const names=["savePracticeSessionMemory","closePracticeSession"];console.log(JSON.stringify(Object.fromEntries(names.map(n=>[n,JSON.parse(fs.readFileSync(`${n}-before.json`)).serviceConfig?.serviceAccountEmail]))))' > runtimes.json
          node trusted-tooling/scripts/staging/verify-exact-sha-remote-preflight.mjs "${{ inputs.release_id }}" marker.json runtimes.json
          node --input-type=module -e 'import {readFile} from "node:fs/promises"; import {loadRelease,validateFunctionConfiguration} from "./trusted-tooling/scripts/staging/exact-sha-release-policy.mjs"; const r=await loadRelease(process.argv[1]); for(const n of r.functions) validateFunctionConfiguration(r,n,JSON.parse(await readFile(`${n}-before.json`,"utf8")));' "${{ inputs.release_id }}"
      - name: Verify minimum service-account impersonation permissions
        if: ${{ needs.validate-source.outputs.deploy_functions == 'true' }}
        working-directory: trusted-tooling
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          runtime="$(node -e 'const r=require("./scripts/staging/approved-exact-sha-releases.json")[process.env.RELEASE_ID];if(!r)process.exit(64);process.stdout.write(r.functionRuntime)')"
          firebase_cli_default="sandman-combat-staging@appspot.gserviceaccount.com"
          access_token="$(gcloud auth print-access-token)"
          for service_account in "${runtime}" "${firebase_cli_default}"; do
            response="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${access_token}" \
              -H "Content-Type: application/json" \
              -X POST \
              -d '{"permissions":["iam.serviceAccounts.actAs"]}' \
              "https://iam.googleapis.com/v1/projects/sandman-combat-staging/serviceAccounts/${service_account}:testIamPermissions")"
            permission="$(node -e 'const d=JSON.parse(process.argv[1]);process.stdout.write((d.permissions||[]).join(","))' "${response}")"
            if test "${permission}" != "iam.serviceAccounts.actAs"; then
              echo "::error title=Missing service-account impersonation permission::The staging deployer lacks iam.serviceAccounts.actAs on ${service_account}. This read-only check made no IAM changes."
              exit 1
            fi
            echo "Verified iam.serviceAccounts.actAs on ${service_account}."
          done
      - name: Preserve read-only recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: staging-recovery-before-${{ needs.validate-source.outputs.application_sha }}
          path: |
            marker.json
            runtimes.json
            hosting-release-before.json
            savePracticeSessionMemory-before.json
            closePracticeSession-before.json
            savePracticeSessionMemory-function-iam-before.json
            closePracticeSession-function-iam-before.json
            savePracticeSessionMemory-run-iam-before.json
            closePracticeSession-run-iam-before.json
          if-no-files-found: error

  deploy-functions:
    if: ${{ inputs.action == 'deploy' }}
    needs: [validate-source, preflight]
    runs-on: ubuntu-24.04
    environment: staging
    strategy:
      max-parallel: 1
      matrix:
        function_name: [savePracticeSessionMemory, closePracticeSession]
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ needs.validate-source.outputs.deploy_functions == 'true' }}
        with:
          name: exact-sha-staging-release-${{ needs.validate-source.outputs.application_sha }}
          path: release-artifacts
      - uses: google-github-actions/auth@v3
        if: ${{ needs.validate-source.outputs.deploy_functions == 'true' }}
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: sandman-practice-deployer@sandman-combat-staging.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Verify targeted Firebase callable deployment inputs
        if: ${{ needs.validate-source.outputs.deploy_functions == 'true' }}
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("release-artifacts/firebase.functions.json"));const p=JSON.parse(fs.readFileSync("release-artifacts/functions/package.json")); if(a.functions.source!=="functions"||a.functions.codebase!=="default"||a.functions.runtime!=="nodejs22"||p.main!=="staging-release-entry.cjs") process.exit(64);'
          test ! -e release-artifacts/functions/.env.production
          test ! -e release-artifacts/functions/.env.sandmandashboard
          npm ci --omit=dev --prefix release-artifacts/functions
          node -e 'const f=require("./release-artifacts/functions")[process.argv[1]];if(!f?.__endpoint?.callableTrigger)process.exit(64)' "${{ matrix.function_name }}"
      - name: Deploy one allowlisted Firebase callable
        if: ${{ needs.validate-source.outputs.deploy_functions == 'true' }}
        run: |
          set -euo pipefail
          case "${{ matrix.function_name }}" in savePracticeSessionMemory|closePracticeSession) ;; *) exit 64 ;; esac
          cd release-artifacts
          npx --yes firebase-tools@15.11.0 deploy --config firebase.functions.json \
            --project sandman-combat-staging \
            --only "functions:default:${{ matrix.function_name }}" \
            --non-interactive

  deploy-hosting:
    if: ${{ inputs.action == 'deploy' }}
    needs: [validate-source, preflight, deploy-functions]
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: exact-sha-staging-release-${{ needs.validate-source.outputs.application_sha }}
          path: release-artifacts
      - uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: sandman-staging-deployer@sandman-combat-staging.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Deploy only the isolated staging Hosting site
        run: npx --yes firebase-tools@15.11.0 deploy --config release-artifacts/firebase.hosting.json --project sandman-combat-staging --only hosting --non-interactive

  verify-deployment:
    if: ${{ inputs.action == 'deploy' }}
    needs: [validate-source, preflight, deploy-functions, deploy-hosting]
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          path: trusted-tooling
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: staging-recovery-before-${{ needs.validate-source.outputs.application_sha }}
          path: before
      - uses: google-github-actions/auth@v3
        if: ${{ needs.validate-source.outputs.deploy_functions == 'true' }}
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: sandman-practice-deployer@sandman-combat-staging.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Compare callable configuration and IAM after deployment
        if: ${{ needs.validate-source.outputs.deploy_functions == 'true' }}
        run: |
          set -euo pipefail
          for fn in savePracticeSessionMemory closePracticeSession; do
            gcloud functions describe "${fn}" --gen2 --region us-central1 --project sandman-combat-staging --format=json > "${fn}-after.json"
            gcloud functions get-iam-policy "${fn}" --gen2 --region us-central1 --project sandman-combat-staging --format=json > "${fn}-function-iam-after.json"
            service="$(node -e 'const d=require(`./${process.argv[1]}-after.json`);process.stdout.write(d.serviceConfig.service.split("/").at(-1))' "${fn}")"
            gcloud run services get-iam-policy "${service}" --region us-central1 --project sandman-combat-staging --format=json > "${fn}-run-iam-after.json"
          done
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { loadRelease, verifyPreservedDeployment } from "./trusted-tooling/scripts/staging/exact-sha-release-policy.mjs";
          const release = await loadRelease("${{ inputs.release_id }}");
          for (const name of release.functions) {
            const read = path => readFile(path, "utf8").then(JSON.parse);
            verifyPreservedDeployment(release, name,
              await read(`before/${name}-before.json`), await read(`${name}-after.json`),
              await read(`before/${name}-function-iam-before.json`), await read(`${name}-function-iam-after.json`),
              await read(`before/${name}-run-iam-before.json`), await read(`${name}-run-iam-after.json`));
          }
          NODE
      - id: hosting-auth
        name: Authenticate as the isolated Hosting deployer for verification
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: sandman-staging-deployer@sandman-combat-staging.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
          token_format: access_token
      - name: Record deployed staging Hosting release
        env:
          ACCESS_TOKEN: ${{ steps.hosting-auth.outputs.access_token }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://firebasehosting.googleapis.com/v1beta1/sites/sandman-combat-staging/releases?pageSize=1" \
            > hosting-release-after.json
      - uses: actions/upload-artifact@v4
        with:
          name: staging-release-after-${{ needs.validate-source.outputs.application_sha }}
          path: |
            *-after.json
            hosting-release-after.json
          if-no-files-found: error
