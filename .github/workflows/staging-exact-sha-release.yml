          echo "Session Builder memory inherited baseline: ${BASELINE_OUTCOME}. Compare with PR #113 before release approval; this status does not waive new Tier Wave failures." >> "$GITHUB_STEP_SUMMARY"
      - name: Historical reconciliation baseline (reported, not release-gating)
        id: historical-baseline
