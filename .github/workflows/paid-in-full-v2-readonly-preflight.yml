name: Protected controlled staging releases

on:
  workflow_dispatch:
    inputs:
      action:
        description: Read-only verification or separately approved staging deployment
        required: true
        default: validate
        type: choice
        options: [validate, deploy]
      release_scope:
        description: Select the exact protected staging release scope
        required: true
        default: pif-v2
        type: choice
        options: [pif-v2, proposal-correction, payment-arrangements]
      approve_release:
        description: For deploy only, enter the exact approval phrase for the selected scope
        required: false
        type: string
      confirm_project:
        description: Type sandman-combat-staging
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: paid-in-full-v2-readonly-preflight
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ inputs.release_scope == 'pif-v2' }}
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - name: Check out protected trusted tooling
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - name: Check out exact merged application revision
        uses: actions/checkout@v4
        with:
          ref: 7df9dce66939cae693d4f112647da7bdd17e923c
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm fail-closed immutable release boundaries
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${CONFIRM_PROJECT}" = "sandman-combat-staging"
          test "$(git -C source rev-parse HEAD)" = "7df9dce66939cae693d4f112647da7bdd17e923c"
          node trusted/scripts/staging/paid-in-full-v2-preflight-check.mjs source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run focused prepaid tests and build
        run: |
          set -euo pipefail
          (cd source && node --test \
            tests/browser/billing-prepaid-terms.test.mjs \
            tests/browser/billing-prepaid-payment-date.test.mjs \
            tests/browser/pricing-paid-in-full-foundation.test.mjs \
            tests/functions/prepaid-six-month-contract.test.mjs \
            tests/functions/prepaid-membership-contract.test.mjs)
          (cd source && node --check public/management/billing/billing.js)
          npm ci --prefix source/functions
          npm run build --prefix source/functions
          (cd trusted && node --test tests/functions/pif-v2-controlled-release.test.mjs tests/functions/paid-in-full-v2-readonly-preflight.test.mjs)
          python3 -m py_compile trusted/scripts/staging/pif-v2-controlled-hosting.py
      - name: Authenticate as existing staging Functions read-only preflight principal
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: sandman-practice-deployer@sandman-combat-staging.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Capture current target Function and Cloud Run metadata without changing them
        run: |
          set -euo pipefail
          mkdir -p evidence
          gcloud functions describe recordProposalPrepaidCash --v2 --region=us-central1 --project=sandman-combat-staging --format=json > evidence/function.json
          gcloud functions get-iam-policy recordProposalPrepaidCash --region=us-central1 --project=sandman-combat-staging --format=json > evidence/function-iam.json
          gcloud run services describe recordproposalprepaidcash --region=us-central1 --project=sandman-combat-staging --format=json > evidence/run-service.json
          gcloud run services get-iam-policy recordproposalprepaidcash --region=us-central1 --project=sandman-combat-staging --format=json > evidence/run-iam.json
          node -e 'const fs=require("fs");const f=JSON.parse(fs.readFileSync("evidence/function.json"));if(!f.name?.startsWith("projects/sandman-combat-staging/")||f.state!=="ACTIVE"||f.buildConfig?.runtime!=="nodejs22"||f.buildConfig?.entryPoint!=="recordProposalPrepaidCash")process.exit(64);console.log("Target Function is ACTIVE and matches staging boundary")'
      - name: Authenticate as staging Hosting preflight identity
        id: hosting-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: sandman-staging-deployer@sandman-combat-staging.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: true
          export_environment_variables: true
      - name: Capture Hosting rollback baseline without modifying the site
        env:
          STAGING_HOSTING_TOKEN: ${{ steps.hosting-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          python trusted/scripts/staging/paid-in-full-v2-hosting-baseline.py \
            --source-root source \
            --evidence-file evidence/hosting-baseline.json
      - name: Upload read-only baseline and fail-closed evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: paid-in-full-v2-readonly-preflight-${{ github.run_id }}
          path: evidence/
          if-no-files-found: ignore

  deploy:
    if: ${{ inputs.release_scope == 'pif-v2' && inputs.action == 'deploy' }}
    needs: validate
    runs-on: ubuntu-24.04
    environment: staging
    env:
      PROJECT_ID: sandman-combat-staging
      REGION: us-central1
      SOURCE_SHA: 7df9dce66939cae693d4f112647da7bdd17e923c
      WIF_PROVIDER: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
    steps:
      - name: Require separate explicit exact-scope staging authorization
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          APPROVE_RELEASE: ${{ inputs.approve_release }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_WORKFLOW_REF}" = "raulsandoval81-maker/SandmanSystem/.github/workflows/paid-in-full-v2-readonly-preflight.yml@refs/heads/main"
          test "${CONFIRM_PROJECT}" = "${PROJECT_ID}"
          test "${APPROVE_RELEASE}" = "APPROVE_PIF_V2_STAGING_ONE_FUNCTION_FOUR_ASSETS"
      - name: Check out protected release tooling
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - name: Check out pinned merged application source
        uses: actions/checkout@v4
        with:
          ref: 7df9dce66939cae693d4f112647da7bdd17e923c
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Download this run's successful preflight evidence
        uses: actions/download-artifact@v4
        with:
          name: paid-in-full-v2-readonly-preflight-${{ github.run_id }}
          path: baseline
      - name: Verify release manifest and recorded current staging baselines
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "${SOURCE_SHA}"
          node trusted/scripts/staging/paid-in-full-v2-preflight-check.mjs source
          node - <<'NODE'
          const fs = require('fs');
          const m = require('./trusted/scripts/staging/pif-v2-controlled-release.json');
          const f = require('./baseline/function.json');
          const h = require('./baseline/hosting-baseline.json');
          const run = require('./baseline/run-service.json');
          const iam = require('./baseline/function-iam.json');
          const runIam = require('./baseline/run-iam.json');
          function assert(condition, message) { if (!condition) throw Error(message); }
          assert(m.projectId === 'sandman-combat-staging' && m.applicationSha === process.env.SOURCE_SHA && m.deploymentAuthorized === false && m.productionAuthorized === false, 'Release policy mismatch');
          assert(f.name === 'projects/sandman-combat-staging/locations/us-central1/functions/recordProposalPrepaidCash' && f.state === 'ACTIVE', 'Function identity/state mismatch');
          assert(f.serviceConfig?.revision === m.functionRevisionBefore && f.serviceConfig?.serviceAccountEmail === m.runtimeServiceAccount, 'Function revision/runtime drift');
          assert(f.buildConfig?.runtime === 'nodejs22' && f.buildConfig?.entryPoint === m.functionName, 'Function runtime/entrypoint drift');
          assert(h.priorRelease === m.hostingReleaseBefore && h.rollbackVersion === m.hostingVersionBefore && h.project === m.projectId && h.site === m.hostingSite, 'Hosting evidence mismatch');
          assert(h.plannedFiles?.length === 4 && h.plannedFiles.every(x => m.hostingAssets.includes(x.path) && x.willChange), 'Hosting asset scope mismatch');
          assert(Array.isArray(iam.bindings) ? iam.bindings.length === 0 : !iam.bindings, 'Unexpected Function IAM bindings');
          assert(Array.isArray(runIam.bindings) ? runIam.bindings.length === 0 : !runIam.bindings, 'Unexpected Run IAM bindings');
          assert(run.metadata?.annotations?.['run.googleapis.com/invoker-iam-disabled'] === 'true', 'Cloud Run invocation policy mismatch');
          console.log('PINNED_RELEASE_BASELINES_MATCH');
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate to capture live Function and IAM before release
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: sandman-practice-deployer@sandman-combat-staging.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Reject any Function, service, or IAM drift since preflight
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          gcloud functions describe recordProposalPrepaidCash --v2 --region="${REGION}" --project="${PROJECT_ID}" --format=json > release-evidence/function-before.json
          gcloud functions get-iam-policy recordProposalPrepaidCash --region="${REGION}" --project="${PROJECT_ID}" --format=json > release-evidence/function-iam-before.json
          gcloud run services describe recordproposalprepaidcash --region="${REGION}" --project="${PROJECT_ID}" --format=json > release-evidence/run-before.json
          gcloud run services get-iam-policy recordproposalprepaidcash --region="${REGION}" --project="${PROJECT_ID}" --format=json > release-evidence/run-iam-before.json
          for entry in "function function-before" "function-iam function-iam-before" "run-service run-before" "run-iam run-iam-before"; do
            set -- ${entry}
            diff -u <(jq -S . "baseline/$1.json") <(jq -S . "release-evidence/$2.json")
          done
      - name: Authenticate staging Hosting identity for final pre-deploy drift check
        id: hosting-pre-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: sandman-staging-deployer@sandman-combat-staging.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: true
          export_environment_variables: true
      - name: Verify exact current Hosting release and four-file overlay before Function update
        env:
          STAGING_HOSTING_TOKEN: ${{ steps.hosting-pre-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          python trusted/scripts/staging/pif-v2-controlled-hosting.py --mode verify \
            --source-root source --evidence-dir release-evidence/hosting \
            --confirm-project "${PROJECT_ID}" --confirm-source-sha "${SOURCE_SHA}"
      - name: Reauthenticate as existing staging Functions deployer
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: sandman-practice-deployer@sandman-combat-staging.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Build the exact reviewed Functions source with no environment files
        run: |
          set -euo pipefail
          npm ci --prefix source/functions
          npm run build --prefix source/functions
          mkdir release-functions
          rsync -a --exclude='node_modules/' --exclude='.env' --exclude='.env.*' \
            --exclude='**/.env' --exclude='**/.env.*' source/functions/ release-functions/
          if find release-functions -type f \( -name '.env' -o -name '.env.*' \) -print -quit | grep -q .; then
            echo 'Unexpected environment file in release artifact' >&2
            exit 64
          fi
          test -f release-functions/lib/billing/recordProposalPrepaidCash.js
      - name: Update the one existing approved staging Function
        run: |
          set -euo pipefail
          gcloud functions deploy recordProposalPrepaidCash --gen2 \
            --project="${PROJECT_ID}" --region="${REGION}" --runtime=nodejs22 \
            --entry-point=recordProposalPrepaidCash --source=release-functions \
            --run-service-account=991554514268-compute@developer.gserviceaccount.com \
            --build-service-account=projects/sandman-combat-staging/serviceAccounts/sandman-practice-build@sandman-combat-staging.iam.gserviceaccount.com \
            --cpu=1 --memory=256Mi --timeout=60s --max-instances=20 --concurrency=80 \
            --ingress-settings=all --trigger-http --quiet
      - name: Verify Function deployed and sensitive settings remain unchanged before Hosting publication
        run: |
          set -euo pipefail
          gcloud functions describe recordProposalPrepaidCash --v2 --region="${REGION}" --project="${PROJECT_ID}" --format=json > release-evidence/function-after.json
          gcloud functions get-iam-policy recordProposalPrepaidCash --region="${REGION}" --project="${PROJECT_ID}" --format=json > release-evidence/function-iam-after.json
          gcloud run services describe recordproposalprepaidcash --region="${REGION}" --project="${PROJECT_ID}" --format=json > release-evidence/run-after.json
          gcloud run services get-iam-policy recordproposalprepaidcash --region="${REGION}" --project="${PROJECT_ID}" --format=json > release-evidence/run-iam-after.json
          diff -u <(jq -S . release-evidence/function-iam-before.json) <(jq -S . release-evidence/function-iam-after.json)
          diff -u <(jq -S . release-evidence/run-iam-before.json) <(jq -S . release-evidence/run-iam-after.json)
          node - <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync('release-evidence/'+p+'.json'));
          const a=read('function-before'),b=read('function-after');
          const r0=read('run-before'),r1=read('run-after');
          function same(x,y,k){if(JSON.stringify(x)!==JSON.stringify(y))throw Error(k+' drifted');}
          if(b.state!=='ACTIVE'||b.serviceConfig?.revision===a.serviceConfig?.revision)throw Error('Function not updated to active new revision');
          for(const k of ['serviceAccountEmail','ingressSettings','availableMemory','availableCpu','timeoutSeconds','maxInstanceCount','maxInstanceRequestConcurrency'])
            same(a.serviceConfig?.[k],b.serviceConfig?.[k],k);
          for(const k of ['runtime','entryPoint','serviceAccount'])same(a.buildConfig?.[k],b.buildConfig?.[k],k);
          same(a.serviceConfig?.environmentVariables,b.serviceConfig?.environmentVariables,'Environment variables');
          same(a.serviceConfig?.secretEnvironmentVariables,b.serviceConfig?.secretEnvironmentVariables,'Secret environment bindings');
          same(a.serviceConfig?.secretVolumes,b.serviceConfig?.secretVolumes,'Secret volumes');
          same(r0.metadata?.annotations?.['run.googleapis.com/invoker-iam-disabled'],r1.metadata?.annotations?.['run.googleapis.com/invoker-iam-disabled'],'Invocation check');
          if(r1.metadata?.annotations?.['run.googleapis.com/invoker-iam-disabled']!=='true')throw Error('Cloud Run disabled invoker marker lost');
          console.log('FUNCTION_DEPLOYMENT_VERIFIED; HOSTING_RELEASE_ALLOWED');
          NODE
      - name: Reauthenticate Hosting identity for exact four-file deployment
        id: hosting-deploy-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: sandman-staging-deployer@sandman-combat-staging.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: true
          export_environment_variables: true
      - name: Release only the four approved Hosting assets, preserving rollback version
        env:
          STAGING_HOSTING_TOKEN: ${{ steps.hosting-deploy-auth.outputs.access_token }}
          PIF_V2_FUNCTION_DEPLOYED_AND_VERIFIED: yes
          APPROVE_RELEASE: ${{ inputs.approve_release }}
        run: |
          set -euo pipefail
          python trusted/scripts/staging/pif-v2-controlled-hosting.py --mode deploy \
            --source-root source --evidence-dir release-evidence/hosting \
            --confirm-project "${PROJECT_ID}" --confirm-source-sha "${SOURCE_SHA}" \
            --approve-release "${APPROVE_RELEASE}"
      - name: Preserve full release receipt and rollback evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: paid-in-full-v2-staging-release-${{ github.run_id }}
          path: release-evidence
          if-no-files-found: warn

  proposal-correction-validate:
    if: ${{ inputs.release_scope == 'proposal-correction' }}
    runs-on: ubuntu-24.04
    environment: staging
    env:
      PROJECT_ID: sandman-combat-staging
      REGION: us-central1
      SOURCE_SHA: 786dba9824663feea4aa092a1bbe54b151c8233a
      WIF_PROVIDER: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
    steps:
      - name: Check out protected release tooling
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - name: Check out pinned proposal-correction source
        uses: actions/checkout@v4
        with:
          ref: 786dba9824663feea4aa092a1bbe54b151c8233a
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source and run focused contracts
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${CONFIRM_PROJECT}" = "${PROJECT_ID}"
          test "$(git -C source rev-parse HEAD)" = "${SOURCE_SHA}"
          node --test source/tests/functions/proposal-correction-repair.test.mjs \
            trusted/tests/functions/proposal-correction-release.test.mjs \
            trusted/tests/functions/proposal-correction-workflow.test.mjs
          npm ci --prefix source/functions
          npm run build --prefix source/functions
          python3 -m py_compile trusted/scripts/staging/proposal-correction-controlled-hosting.py
      - name: Authenticate as existing staging Functions deployer
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: sandman-practice-deployer@sandman-combat-staging.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Capture missing Function, security prerequisites, and sibling configuration
        run: |
          set -euo pipefail
          mkdir -p evidence
          set +e
          gcloud functions describe returnProposalToDraft --gen2 --region="${REGION}" \
            --project="${PROJECT_ID}" --format=json > evidence/function-stdout.txt 2> evidence/function-stderr.txt
          status=$?
          set -e
          printf '%s\n' "${status}" > evidence/function-status.txt
          test "${status}" -ne 0
          gcloud iam roles describe sandmanPracticeDeployer --project="${PROJECT_ID}" \
            --format=json > evidence/practice-role.json
          gcloud iam roles describe sandmanBillingInvokerIamRelease --project="${PROJECT_ID}" \
            --format=json > evidence/invocation-role.json
          gcloud projects get-iam-policy "${PROJECT_ID}" --format=json > evidence/project-iam.json
          gcloud iam service-accounts get-iam-policy \
            sandman-billing-runtime@sandman-combat-staging.iam.gserviceaccount.com \
            --project="${PROJECT_ID}" --format=json > evidence/runtime-iam.json
          gcloud iam service-accounts get-iam-policy \
            sandman-practice-build@sandman-combat-staging.iam.gserviceaccount.com \
            --project="${PROJECT_ID}" --format=json > evidence/build-iam.json
          gcloud secrets get-iam-policy STRIPE_SECRET_KEY --project="${PROJECT_ID}" \
            --format=json > evidence/secret-iam.json
          gcloud functions describe issueProposalClientReview --gen2 --region="${REGION}" \
            --project="${PROJECT_ID}" --format=json > evidence/sibling-function.json
          gcloud run services describe issueproposalclientreview --region="${REGION}" \
            --project="${PROJECT_ID}" --format=json > evidence/sibling-run.json
      - name: Authenticate as existing staging Hosting identity
        id: proposal-hosting-preflight-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: sandman-staging-deployer@sandman-combat-staging.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: true
          export_environment_variables: true
      - name: Capture exact Hosting rollback baseline without publishing
        env:
          STAGING_HOSTING_TOKEN: ${{ steps.proposal-hosting-preflight-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          python trusted/scripts/staging/proposal-correction-controlled-hosting.py --mode verify \
            --source-root source --evidence-dir evidence/hosting \
            --confirm-project "${PROJECT_ID}" --confirm-source-sha "${SOURCE_SHA}"
      - name: Fail closed unless all create and invocation prerequisites are exact
        run: node trusted/scripts/staging/proposal-correction-release.mjs evidence
      - name: Preserve proposal-correction validation and rollback evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: proposal-correction-staging-preflight-${{ github.run_id }}
          path: evidence
          if-no-files-found: error

  proposal-correction-deploy:
    if: ${{ inputs.release_scope == 'proposal-correction' && inputs.action == 'deploy' }}
    needs: proposal-correction-validate
    runs-on: ubuntu-24.04
    environment: staging
    env:
      PROJECT_ID: sandman-combat-staging
      REGION: us-central1
      SOURCE_SHA: 786dba9824663feea4aa092a1bbe54b151c8233a
      RELEASE_ID: proposal-correction-786dba98
      WIF_PROVIDER: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
    steps:
      - name: Require separate exact-scope staging approval
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          APPROVE_RELEASE: ${{ inputs.approve_release }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_WORKFLOW_REF}" = "raulsandoval81-maker/SandmanSystem/.github/workflows/paid-in-full-v2-readonly-preflight.yml@refs/heads/main"
          test "${CONFIRM_PROJECT}" = "${PROJECT_ID}"
          test "${APPROVE_RELEASE}" = "APPROVE_STAGING_PROPOSAL_CORRECTION_ONE_FUNCTION_ONE_ASSET"
      - name: Check out protected tooling and pinned source
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 786dba9824663feea4aa092a1bbe54b151c8233a
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: proposal-correction-staging-preflight-${{ github.run_id }}
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate as existing staging Functions deployer
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: sandman-practice-deployer@sandman-combat-staging.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Reject source, Function-state, or security-prerequisite drift
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "${SOURCE_SHA}"
          mkdir -p release-evidence/current
          set +e
          gcloud functions describe returnProposalToDraft --gen2 --region="${REGION}" \
            --project="${PROJECT_ID}" --format=json > release-evidence/current/function-stdout.txt \
            2> release-evidence/current/function-stderr.txt
          status=$?
          set -e
          printf '%s\n' "${status}" > release-evidence/current/function-status.txt
          test "${status}" -ne 0
          gcloud iam roles describe sandmanPracticeDeployer --project="${PROJECT_ID}" --format=json > release-evidence/current/practice-role.json
          gcloud iam roles describe sandmanBillingInvokerIamRelease --project="${PROJECT_ID}" --format=json > release-evidence/current/invocation-role.json
          gcloud projects get-iam-policy "${PROJECT_ID}" --format=json > release-evidence/current/project-iam.json
          gcloud iam service-accounts get-iam-policy sandman-billing-runtime@sandman-combat-staging.iam.gserviceaccount.com --project="${PROJECT_ID}" --format=json > release-evidence/current/runtime-iam.json
          gcloud iam service-accounts get-iam-policy sandman-practice-build@sandman-combat-staging.iam.gserviceaccount.com --project="${PROJECT_ID}" --format=json > release-evidence/current/build-iam.json
          gcloud secrets get-iam-policy STRIPE_SECRET_KEY --project="${PROJECT_ID}" --format=json > release-evidence/current/secret-iam.json
          gcloud functions describe issueProposalClientReview --gen2 --region="${REGION}" --project="${PROJECT_ID}" --format=json > release-evidence/current/sibling-function.json
          gcloud run services describe issueproposalclientreview --region="${REGION}" --project="${PROJECT_ID}" --format=json > release-evidence/current/sibling-run.json
          node trusted/scripts/staging/proposal-correction-release.mjs release-evidence/current
      - name: Build exact source and reject every environment-file variant
        run: |
          set -euo pipefail
          npm ci --prefix source/functions
          npm run build --prefix source/functions
          mkdir release-functions
          rsync -a --exclude='node_modules/' --exclude='.env' --exclude='.env.*' \
            --exclude='**/.env' --exclude='**/.env.*' source/functions/ release-functions/
          if find release-functions -type f \( -name '.env' -o -name '.env.*' \) -print -quit | grep -q .; then
            echo 'Unexpected environment file in release artifact' >&2
            exit 64
          fi
          test -f release-functions/lib/proposals/returnProposalToDraft.js
      - name: Create exactly the missing staging callable
        run: |
          set -euo pipefail
          gcloud functions deploy returnProposalToDraft --gen2 \
            --project="${PROJECT_ID}" --region="${REGION}" --runtime=nodejs22 \
            --entry-point=returnProposalToDraft --source=release-functions \
            --run-service-account=sandman-billing-runtime@sandman-combat-staging.iam.gserviceaccount.com \
            --build-service-account=projects/sandman-combat-staging/serviceAccounts/sandman-practice-build@sandman-combat-staging.iam.gserviceaccount.com \
            --cpu=1 --memory=256Mi --timeout=60s --max-instances=20 --concurrency=80 \
            --ingress-settings=all --trigger-http \
            --update-env-vars=SANDMAN_STAGING_ACK=sandman-combat-staging,SANDMAN_STAGING_PROJECT_ID=sandman-combat-staging,SANDMAN_WRESTLING_RUNTIME_SERVICE_ACCOUNT=sandman-wrestling-runtime@sandman-combat-staging.iam.gserviceaccount.com \
            --set-secrets=STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest \
            --update-labels=sandman-release="${RELEASE_ID}",sandman-source-sha="${SOURCE_SHA}" --quiet
          gcloud run services update returnproposaltodraft --project="${PROJECT_ID}" \
            --region="${REGION}" --no-invoker-iam-check --quiet
      - name: Verify exact Function configuration and unchanged empty IAM
        run: |
          set -euo pipefail
          gcloud functions describe returnProposalToDraft --gen2 --region="${REGION}" --project="${PROJECT_ID}" --format=json > release-evidence/function-after.json
          gcloud functions get-iam-policy returnProposalToDraft --gen2 --region="${REGION}" --project="${PROJECT_ID}" --format=json > release-evidence/function-iam-after.json
          gcloud run services describe returnproposaltodraft --region="${REGION}" --project="${PROJECT_ID}" --format=json > release-evidence/run-after.json
          gcloud run services get-iam-policy returnproposaltodraft --region="${REGION}" --project="${PROJECT_ID}" --format=json > release-evidence/run-iam-after.json
          node - <<'NODE'
          const fs=require('fs');const read=p=>JSON.parse(fs.readFileSync(p));
          const f=read('release-evidence/function-after.json'),r=read('release-evidence/run-after.json');
          const fi=read('release-evidence/function-iam-after.json'),ri=read('release-evidence/run-iam-after.json');
          const exact=(a,b,m)=>{if(JSON.stringify(a)!==JSON.stringify(b))throw Error(m)};
          if(f.name!=='projects/sandman-combat-staging/locations/us-central1/functions/returnProposalToDraft'||f.state!=='ACTIVE'||f.environment!=='GEN_2')throw Error('Function identity/state mismatch');
          if(f.buildConfig?.runtime!=='nodejs22'||f.buildConfig?.entryPoint!=='returnProposalToDraft'||f.buildConfig?.serviceAccount!=='projects/sandman-combat-staging/serviceAccounts/sandman-practice-build@sandman-combat-staging.iam.gserviceaccount.com')throw Error('Build configuration mismatch');
          const s=f.serviceConfig||{};
          if(s.serviceAccountEmail!=='sandman-billing-runtime@sandman-combat-staging.iam.gserviceaccount.com'||s.ingressSettings!=='ALLOW_ALL'||s.availableMemory!=='256Mi'||s.availableCpu!=='1'||s.timeoutSeconds!==60||s.maxInstanceCount!==20||s.maxInstanceRequestConcurrency!==80)throw Error('Runtime configuration mismatch');
          const expectedEnv={SANDMAN_STAGING_ACK:'sandman-combat-staging',SANDMAN_STAGING_PROJECT_ID:'sandman-combat-staging',SANDMAN_WRESTLING_RUNTIME_SERVICE_ACCOUNT:'sandman-wrestling-runtime@sandman-combat-staging.iam.gserviceaccount.com'};
          const actualEnv=Object.fromEntries(Object.entries(s.environmentVariables||{}).filter(([k])=>k.startsWith('SANDMAN_')));
          exact(actualEnv,expectedEnv,'Staging environment mismatch');
          if(f.labels?.['sandman-release']!=='proposal-correction-786dba98'||f.labels?.['sandman-source-sha']!==process.env.SOURCE_SHA)throw Error('Release label mismatch');
          const secrets=(s.secretEnvironmentVariables||[]).map(x=>({key:x.key,secret:x.secret,version:x.version}));
          exact(secrets,[{key:'STRIPE_SECRET_KEY',secret:'STRIPE_SECRET_KEY',version:'latest'}],'Secret mismatch');
          if((fi.bindings||[]).length||(ri.bindings||[]).length)throw Error('Unexpected invocation IAM binding');
          if(r.metadata?.annotations?.['run.googleapis.com/invoker-iam-disabled']!=='true')throw Error('Callable transport configuration missing');
          console.log('PROPOSAL_CORRECTION_FUNCTION_VERIFIED');
          NODE
      - name: Authenticate as staging Hosting identity
        id: proposal-hosting-deploy-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: sandman-staging-deployer@sandman-combat-staging.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: true
          export_environment_variables: true
      - name: Publish exactly one approved Hosting asset
        env:
          STAGING_HOSTING_TOKEN: ${{ steps.proposal-hosting-deploy-auth.outputs.access_token }}
          PROPOSAL_CORRECTION_FUNCTION_VERIFIED: yes
          APPROVE_RELEASE: ${{ inputs.approve_release }}
        run: |
          set -euo pipefail
          python trusted/scripts/staging/proposal-correction-controlled-hosting.py --mode deploy \
            --source-root source --evidence-dir release-evidence/hosting \
            --confirm-project "${PROJECT_ID}" --confirm-source-sha "${SOURCE_SHA}" \
            --approve-release "${APPROVE_RELEASE}"
      - name: Preserve release and rollback evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: proposal-correction-staging-release-${{ github.run_id }}
          path: release-evidence
          if-no-files-found: warn

  arrangements-validate:
    if: ${{ inputs.release_scope == 'payment-arrangements' }}
    runs-on: ubuntu-24.04
    environment: staging
    env:
      CONFIRM_PROJECT: ${{ inputs.confirm_project }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f402c04ee27a5ca9309a422221c3556f6523588a
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable scope and release-tooling guards
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "f402c04ee27a5ca9309a422221c3556f6523588a"
          python3 -m unittest discover -s trusted/tests/staging -p test_pr482_release.py -v
          python3 - <<'PYCODE'
          import importlib.util
          s=importlib.util.spec_from_file_location('r','trusted/scripts/staging/pr482-release.py')
          r=importlib.util.module_from_spec(s);s.loader.exec_module(r);r.protected()
          PYCODE
      - name: Compile pinned source for source-package overlays
        run: |
          set -euo pipefail
          npm ci --prefix source/functions
          npm run build --prefix source/functions
          test -f source/functions/lib/billing/paymentArrangement.js
          test -f source/functions/lib/billing/prepaidProposalCheckout.js
      - name: Authenticate existing staging Functions principal
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: sandman-practice-deployer@sandman-combat-staging.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Capture seven existing Functions and immutable rollback sources read-only
        run: |
          set -euo pipefail
          mkdir -p evidence
          PR482_DEFER_HOSTING=1 python3 trusted/scripts/staging/pr482-capture.py evidence/baseline > evidence/capture-receipt.json
      - name: Authenticate existing staging Hosting principal
        id: arrangements-hosting-preflight
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: sandman-staging-deployer@sandman-combat-staging.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: true
          export_environment_variables: true
      - name: Complete read-only Hosting capture with the existing Hosting identity
        run: python3 trusted/scripts/staging/pr482-capture.py evidence/baseline --hosting > evidence/capture-receipt.json
      - name: Prepare and verify exact source overlays against pinned baseline
        run: |
          set -euo pipefail
          python3 trusted/scripts/staging/pr482-release.py package --source source --baseline evidence/baseline --out evidence/packages
      - name: Verify complete Hosting baseline and seven-file overlay without publishing
        env:
          STAGING_HOSTING_TOKEN: ${{ steps.arrangements-hosting-preflight.outputs.access_token }}
        run: python3 trusted/scripts/staging/pr482-hosting.py verify --source source --baseline evidence/baseline --out evidence/hosting
      - uses: actions/upload-artifact@v4
        with:
          name: pr482-verified-preflight-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error

  arrangements-deploy:
    if: ${{ inputs.release_scope == 'payment-arrangements' && inputs.action == 'deploy' }}
    needs: arrangements-validate
    runs-on: ubuntu-24.04
    environment: staging
    env:
      CONFIRM_PROJECT: ${{ inputs.confirm_project }}
      APPROVE_RELEASE: ${{ inputs.approve_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f402c04ee27a5ca9309a422221c3556f6523588a
          path: source
          persist-credentials: false
      - name: Require exact separate deployment approval
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import importlib.util
          s=importlib.util.spec_from_file_location('r','trusted/scripts/staging/pr482-release.py')
          r=importlib.util.module_from_spec(s);s.loader.exec_module(r);r.protected(True)
          PYCODE
      - uses: actions/download-artifact@v4
        with:
          name: pr482-verified-preflight-${{ github.run_id }}
          path: preflight
      - name: Authenticate Hosting principal before any Function mutation
        id: arrangements-hosting-before
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: sandman-staging-deployer@sandman-combat-staging.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: true
          export_environment_variables: true
      - name: Reject Hosting drift before first Function update
        env:
          STAGING_HOSTING_TOKEN: ${{ steps.arrangements-hosting-before.outputs.access_token }}
        run: python3 trusted/scripts/staging/pr482-hosting.py verify --source source --baseline preflight/baseline --out release-evidence/hosting-precheck
      - name: Authenticate existing Functions deployer
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: sandman-practice-deployer@sandman-combat-staging.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Update and verify one existing Function at a time; stop on first failure
        run: |
          set -euo pipefail
          for name in createProposalDraft updateProposalDraft issueProposalClientReview acceptProposalClientReview createProposalCheckout recordProposalPrepaidCash stripeBillingWebhook; do
            python3 trusted/scripts/staging/pr482-release.py function --name "$name" --baseline preflight/baseline --packages preflight/packages --out release-evidence/functions
          done
          python3 trusted/scripts/staging/pr482-release.py aggregate --baseline preflight/baseline --packages preflight/packages --out release-evidence/functions
      - name: Authenticate existing Hosting deployer after seven verified Functions
        id: arrangements-hosting-deploy
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: sandman-staging-deployer@sandman-combat-staging.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: true
          export_environment_variables: true
      - name: Publish seven-path overlay and verify all live asset hashes and config
        env:
          STAGING_HOSTING_TOKEN: ${{ steps.arrangements-hosting-deploy.outputs.access_token }}
        run: python3 trusted/scripts/staging/pr482-hosting.py deploy --source source --baseline preflight/baseline --out release-evidence/hosting --verified-functions release-evidence/functions
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: pr482-release-receipt-${{ github.run_id }}
          path: release-evidence/
          if-no-files-found: warn
