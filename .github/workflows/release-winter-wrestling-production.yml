name: Winter Wrestling production Hosting release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preflight creates no release; deploy and rollback require production approval
        required: true
        default: preflight
        type: choice
        options: [preflight, deploy, rollback]
      confirm_project:
        description: Type sandmandashboard exactly
        required: true
        type: string
      confirm_source_sha:
        description: Confirm immutable staged application SHA
        required: true
        type: string
      expected_current_release:
        description: Exact live Hosting release observed during review
        required: true
        type: string
      expected_current_version:
        description: Exact live Hosting version observed during review
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sandman-production-hosting
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout trusted release tooling from main
        uses: actions/checkout@v5
        with:
          ref: main
          path: trusted-tooling
          persist-credentials: false
      - name: Enforce trusted workflow and immutable release identity
        working-directory: trusted-tooling
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          CONFIRM_SOURCE_SHA: ${{ inputs.confirm_source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW_REF" = "raulsandoval81-maker/SandmanSystem/.github/workflows/release-winter-wrestling-production.yml@refs/heads/main"
          test "$CONFIRM_PROJECT" = "sandmandashboard"
          test "$CONFIRM_SOURCE_SHA" = "6eba4d30395f7eaa100c5f3326c0a89033f6a689"
          case "$MODE" in preflight|deploy|rollback) ;; *) exit 64 ;; esac
          node --test tests/functions/winter-wrestling-production-release.test.mjs
      - name: Checkout immutable staged application source
        uses: actions/checkout@v5
        with:
          ref: 6eba4d30395f7eaa100c5f3326c0a89033f6a689
          path: application
          persist-credentials: false
      - name: Verify immutable application checkout
        working-directory: application
        run: test "$(git rev-parse HEAD)" = "6eba4d30395f7eaa100c5f3326c0a89033f6a689"
      - name: Authenticate production deployment identity
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SANDMANDASHBOARD }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release dependencies
        run: python -m pip install google-auth requests
      - name: Preflight or execute exact five-file overlay
        run: |
          python trusted-tooling/scripts/production/winter_wrestling_hosting_release.py \
            --manifest trusted-tooling/scripts/production/winter-wrestling-production-release.json \
            --source-root application \
            --evidence-dir release-evidence \
            --mode "${{ inputs.mode }}" \
            --confirm-project "${{ inputs.confirm_project }}" \
            --confirm-source-sha "${{ inputs.confirm_source_sha }}" \
            --expected-current-release "${{ inputs.expected_current_release }}" \
            --expected-current-version "${{ inputs.expected_current_version }}"
      - name: Upload production release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winter-wrestling-production-${{ github.run_id }}-${{ inputs.mode }}
          path: release-evidence/
          if-no-files-found: error
