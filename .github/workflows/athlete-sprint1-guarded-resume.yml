name: Athlete Sprint 1 — guarded staging resume

on:
  workflow_dispatch:
    inputs:
      action:
        description: Resume only the partially deployed Athlete Sprint 1 release
        type: choice
        required: true
        options:
          - athlete-sprint1-staging-resume
      confirm_project:
        description: Type sandman-combat-staging
        type: string
        required: true
      staging_resume_approval:
        description: Mutation approval APPROVE_SPRINT1_PARTIAL_RESUME_STAGING_ONLY
        type: string
        required: false
      application_auth_transport_approval:
        description: Transport approval APPROVE_STAGING_APPLICATION_AUTH_TRANSPORT
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: controlled-exact-sha-staging-release
  cancel-in-progress: false

jobs:
  readonly:
    name: Verify live partial state, rollback baseline and scoped IAM (read-only)
    if: ${{ github.repository == 'raulsandoval81-maker/SandmanSystem' && github.ref == 'refs/heads/main' && inputs.action == 'athlete-sprint1-staging-resume' }}
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Require exact protected main, first attempt and staging project
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = raulsandoval81-maker/SandmanSystem
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_WORKFLOW_REF" = "raulsandoval81-maker/SandmanSystem/.github/workflows/athlete-sprint1-guarded-resume.yml@refs/heads/main"
          test "$CONFIRM_PROJECT" = sandman-combat-staging
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 0e9d96e3994094fffacbb606ac77f474902bf666
          path: application
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download cryptographically pinned original evidence and run 469 receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sprint1-baseline" "$RUNNER_TEMP/sprint1-partial"
          gh run download 46086011747 --repo raulsandoval81-maker/SandmanSystem --name sprint1-staging-readonly-46086011747 --dir "$RUNNER_TEMP/sprint1-baseline"
          gh run download 46094443807 --repo raulsandoval81-maker/SandmanSystem --name athlete-sprint1-functions-46094443807 --dir "$RUNNER_TEMP/sprint1-partial"
          test -s "$RUNNER_TEMP/sprint1-baseline/sprint1-staging-readonly-evidence.json"
          test -s "$RUNNER_TEMP/sprint1-partial/athlete-sprint1-functions-deploy-evidence.json"
      - name: Verify tested source and package exact two-callable source
        run: |
          set -euo pipefail
          npm ci --prefix application/functions --ignore-scripts --no-audit --no-fund
          npm run build --prefix application/functions
          python3 scripts/staging/athlete-sprint1-release/validate_release_candidate.py --evidence "$RUNNER_TEMP/sprint1-baseline/sprint1-staging-readonly-evidence.json" --source-root application
          python3 scripts/staging/athlete-sprint1-release/build_callable_package.py --source application --out "$RUNNER_TEMP/sprint1-callables"
      - name: Authenticate existing protected staging identity — read only
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: sandman-staging-deployer@sandman-combat-staging.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
      - name: Reconcile 53 untouched Functions, Profile, Rules, Hosting and IAM
        env:
          SPRINT1_BASELINE_JSON: ${{ runner.temp }}/sprint1-baseline/sprint1-staging-readonly-evidence.json
          SPRINT1_PARTIAL_RECEIPT_JSON: ${{ runner.temp }}/sprint1-partial/athlete-sprint1-functions-deploy-evidence.json
          SPRINT1_ACTION: ${{ inputs.action }}
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: python3 scripts/staging/athlete-sprint1-release/guarded_resume.py preflight --source "$RUNNER_TEMP/sprint1-callables"
      - name: Preserve protected read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint1-guarded-resume-preflight-${{ github.run_id }}
          path: athlete-sprint1-resume-evidence.json
          if-no-files-found: warn
          retention-days: 30

  functions:
    name: Preserve existing Profile and create ONLY missing Skills Function
    needs: readonly
    if: ${{ inputs.staging_resume_approval == 'APPROVE_SPRINT1_PARTIAL_RESUME_STAGING_ONLY' && inputs.application_auth_transport_approval == 'APPROVE_STAGING_APPLICATION_AUTH_TRANSPORT' }}
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Validate separately authorized, first-attempt, staging-only release
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          SPRINT1_APPROVAL: ${{ inputs.staging_resume_approval }}
          SPRINT1_TRANSPORT_APPROVAL: ${{ inputs.application_auth_transport_approval }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_WORKFLOW_REF" = "raulsandoval81-maker/SandmanSystem/.github/workflows/athlete-sprint1-guarded-resume.yml@refs/heads/main"
          test "$CONFIRM_PROJECT" = sandman-combat-staging
          test "$SPRINT1_APPROVAL" = APPROVE_SPRINT1_PARTIAL_RESUME_STAGING_ONLY
          test "$SPRINT1_TRANSPORT_APPROVAL" = APPROVE_STAGING_APPLICATION_AUTH_TRANSPORT
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 0e9d96e3994094fffacbb606ac77f474902bf666
          path: application
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore immutable source and protected baseline / partial receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sprint1-baseline" "$RUNNER_TEMP/sprint1-partial"
          gh run download 46086011747 --repo raulsandoval81-maker/SandmanSystem --name sprint1-staging-readonly-46086011747 --dir "$RUNNER_TEMP/sprint1-baseline"
          gh run download 46094443807 --repo raulsandoval81-maker/SandmanSystem --name athlete-sprint1-functions-46094443807 --dir "$RUNNER_TEMP/sprint1-partial"
          npm ci --prefix application/functions --ignore-scripts --no-audit --no-fund
          npm run build --prefix application/functions
          python3 scripts/staging/athlete-sprint1-release/validate_release_candidate.py --evidence "$RUNNER_TEMP/sprint1-baseline/sprint1-staging-readonly-evidence.json" --source-root application
          python3 scripts/staging/athlete-sprint1-release/build_callable_package.py --source application --out "$RUNNER_TEMP/sprint1-callables"
      - name: Authenticate protected staging-deployer (no IAM changes)
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: sandman-staging-deployer@sandman-combat-staging.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
      - name: Execute guarded Profile transport update and create-only Skills, then reject anonymous calls
        env:
          SPRINT1_BASELINE_JSON: ${{ runner.temp }}/sprint1-baseline/sprint1-staging-readonly-evidence.json
          SPRINT1_PARTIAL_RECEIPT_JSON: ${{ runner.temp }}/sprint1-partial/athlete-sprint1-functions-deploy-evidence.json
          SPRINT1_ACTION: ${{ inputs.action }}
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          SPRINT1_APPROVAL: ${{ inputs.staging_resume_approval }}
          SPRINT1_TRANSPORT_APPROVAL: ${{ inputs.application_auth_transport_approval }}
        run: python3 scripts/staging/athlete-sprint1-release/guarded_resume.py execute --source "$RUNNER_TEMP/sprint1-callables"
      - name: Preserve partial success evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint1-guarded-resume-functions-${{ github.run_id }}
          path: athlete-sprint1-resume-evidence.json
          if-no-files-found: warn
          retention-days: 30

  rules-hosting:
    name: Reviewed additive Rules and exact 18-asset staging Hosting overlay
    needs: functions
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve protected immutable rollback source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sprint1-baseline"
          gh run download 46086011747 --repo raulsandoval81-maker/SandmanSystem --name sprint1-staging-readonly-46086011747 --dir "$RUNNER_TEMP/sprint1-baseline"
          python3 scripts/staging/athlete-sprint1-release/validate_release_candidate.py --evidence "$RUNNER_TEMP/sprint1-baseline/sprint1-staging-readonly-evidence.json"
      - name: Authenticate protected staging Rules/Hosting identity
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: sandman-staging-deployer@sandman-combat-staging.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
      - name: Publish reviewed Firestore delta and exactly 18 Hosting assets
        env:
          SPRINT1_BASELINE_JSON: ${{ runner.temp }}/sprint1-baseline/sprint1-staging-readonly-evidence.json
          SPRINT1_ACTION: ${{ inputs.action }}
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          SPRINT1_APPROVAL: ${{ inputs.staging_resume_approval }}
          SPRINT1_TRANSPORT_APPROVAL: ${{ inputs.application_auth_transport_approval }}
        run: |
          set -euo pipefail
          python3 scripts/staging/athlete-sprint1-release/release_rules_hosting.py publish
          python3 scripts/staging/athlete-sprint1-release/verify_after_release.py
      - name: Preserve rollback and partial publish receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint1-guarded-resume-rules-hosting-${{ github.run_id }}
          path: athlete-sprint1-release-evidence.json
          if-no-files-found: warn
          retention-days: 30

  acceptance:
    name: Protected synthetic Athlete, Parent, Coach, Management and Admin acceptance
    needs: rules-hosting
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Validate exact staging scope and first attempt
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$CONFIRM_PROJECT" = sandman-combat-staging
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned synthetic browser
        run: |
          npm install --prefix "$RUNNER_TEMP/p0-acceptance" --ignore-scripts --no-audit --no-fund playwright@1.51.1
          "$RUNNER_TEMP/p0-acceptance/node_modules/.bin/playwright" install --with-deps chromium
      - name: Authenticated synthetic five-role acceptance with cross-athlete denials
        env:
          P0_ATHLETE_DIAGNOSTIC: 'false'
          P0_OWNERSHIP_CLASSIFICATION: 'false'
          P0_DEPENDENCY_DIAGNOSTIC: 'false'
          P0_NAVIGATION_DIAGNOSTIC: 'false'
          P0_SPRINT1_CHECKS: 'true'
          P0_STAGING_FIXTURES: ${{ vars.SANDMAN_P0_STAGING_FIXTURES }}
          P0_STAGING_PASSWORD: ${{ secrets.SANDMAN_STAGING_TEST_PASSWORD }}
          P0_PLAYWRIGHT: ${{ runner.temp }}/p0-acceptance/node_modules/playwright/index.mjs
        run: node scripts/staging/p0-authenticated-acceptance.mjs
      - name: Retain sanitized acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint1-guarded-resume-acceptance-${{ github.run_id }}
          path: p0-acceptance-results.json
          if-no-files-found: warn
          retention-days: 30
