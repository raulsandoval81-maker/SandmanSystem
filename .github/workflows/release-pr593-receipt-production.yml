name: PR593 isolated receipt production release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Offline preflight, read-only permission diagnosis, or separately approved deploy
        required: true
        default: preflight
        type: choice
        options: [preflight, diagnose, deploy]
      confirm_project:
        description: Type sandmandashboard
        required: true
        type: string
      confirm_source_sha:
        description: Exact merged PR593 source SHA
        required: true
        type: string
      deployment_approval:
        description: For deploy only, type APPROVE_PR593_PRODUCTION_RECEIPT_ONE_FUNCTION
        required: false
        type: string
      confirm_target_absent:
        description: For deploy only, type TARGET_ABSENT_IN_APPROVED_PREFLIGHT
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sandman-production-functions
  cancel-in-progress: false

jobs:
  receipt-release:
    runs-on: ubuntu-24.04
    # Offline preflight requires no production approval; diagnose/deploy remain protected.
    environment: ${{ inputs.mode == 'preflight' && 'receipt-offline-preflight' || 'production' }}
    timeout-minutes: 30
    env:
      PROJECT_ID: sandmandashboard
      PROJECT_NUMBER: '889326401061'
      REGION: us-central1
      SOURCE_SHA: ff4b6ca3997b89384f8287c838bce0718370172d
      FUNCTION_NAME: sendProposalPrepaidCashReceipt
      RUNTIME_SA: 889326401061-compute@developer.gserviceaccount.com
    steps:
      - name: Enforce immutable one-function production boundary
        run: |
          set -euo pipefail
          mkdir -p evidence
          require_boundary(){ local label="$1"; shift; if ! "$@"; then echo "::error::PR593 production boundary failed: ${label}"; printf 'FAILED_CONDITION=%s\n' "$label" > evidence/boundary.txt; exit 1; fi; }
          require_boundary REPOSITORY test "$GITHUB_REPOSITORY" = "raulsandoval81-maker/SandmanSystem"
          require_boundary MAIN_REF test "$GITHUB_REF" = "refs/heads/main"
          require_boundary TRUSTED_WORKFLOW test "$GITHUB_WORKFLOW_REF" = "raulsandoval81-maker/SandmanSystem/.github/workflows/release-pr593-receipt-production.yml@refs/heads/main"
          require_boundary PROJECT test "${{ inputs.confirm_project }}" = "$PROJECT_ID"
          require_boundary SOURCE_SHA test "${{ inputs.confirm_source_sha }}" = "$SOURCE_SHA"
          if test "${{ inputs.mode }}" = deploy; then
            require_boundary APPROVAL test "${{ inputs.deployment_approval }}" = "APPROVE_PR593_PRODUCTION_RECEIPT_ONE_FUNCTION"
            require_boundary ABSENT_BASELINE test "${{ inputs.confirm_target_absent }}" = "TARGET_ABSENT_IN_APPROVED_PREFLIGHT"
          else
            require_boundary READ_ONLY_MODE bash -c 'test "$1" = preflight || test "$1" = diagnose' _ "${{ inputs.mode }}"
          fi
          printf 'BOUNDARY_OK\n' > evidence/boundary.txt
      - uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ff4b6ca3997b89384f8287c838bce0718370172d
          path: application
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: application/functions/package-lock.json
      - name: Verify exact source manifest and receipt security contracts
        run: |
          set -euo pipefail
          test "$(git -C application rev-parse HEAD)" = "$SOURCE_SHA"
          node <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process');
          const m=JSON.parse(fs.readFileSync('trusted/scripts/production/pr593-receipt-release.json'));
          if(m.project!==process.env.PROJECT_ID||m.projectNumber!==process.env.PROJECT_NUMBER||m.sourceSha!==process.env.SOURCE_SHA||m.function!==process.env.FUNCTION_NAME||m.hosting!==false||m.production!==true)throw Error('Production manifest mismatch');
          const actual=cp.execFileSync('git',['-C','application','diff','--name-only',m.baselineSha,m.sourceSha],{encoding:'utf8'}).trim().split('\n').filter(Boolean).sort();
          if(JSON.stringify(actual)!==JSON.stringify([...m.allowedChangedFiles].sort()))throw Error('Exact PR593 source manifest drift');
          NODE
          node --test trusted/tests/functions/pr593-receipt-production-release.test.mjs
      - name: Build and run four receipt review tests
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefix application/functions
          npm --prefix application/functions run build
          (cd application && node --test tests/functions/emmett-2c-receipt-bootstrap-review.test.mjs) | tee evidence/receipt-review-tests.txt
          grep -q '# tests 4' evidence/receipt-review-tests.txt
          grep -q '# pass 4' evidence/receipt-review-tests.txt
          grep -q '# fail 0' evidence/receipt-review-tests.txt
      - name: Assemble and verify compiled-only one-export candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pr593-receipt-release"
          test ! -e "$root"
          mkdir -p "$root/lib/billing" "$root/lib/modules/email" "$root/lib/proposals"
          cp application/functions/package.json application/functions/package-lock.json "$root/"
          cp application/functions/lib/billing/sendProposalPrepaidCashReceipt.js "$root/lib/billing/"
          cp application/functions/lib/modules/email/resend.js "$root/lib/modules/email/"
          cp application/functions/lib/proposals/proposalAccess.js "$root/lib/proposals/"
          node - "$root" <<'NODE'
          const fs=require('node:fs'),root=process.argv[2],pkg=require(root+'/package.json');
          pkg.main='index.js';pkg.scripts={};fs.writeFileSync(root+'/package.json',JSON.stringify(pkg,null,2)+'\n');
          fs.writeFileSync(root+'/index.js','const admin=require("firebase-admin");if(!admin.apps.length)admin.initializeApp();exports.sendProposalPrepaidCashReceipt=require("./lib/billing/sendProposalPrepaidCashReceipt").sendProposalPrepaidCashReceipt;\n');
          NODE
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund --prefix "$root"
          NODE_PATH="$root/node_modules" node - "$root" <<'NODE'
          const root=process.argv[2],candidate=require(root),keys=Object.keys(candidate);
          if(JSON.stringify(keys)!==JSON.stringify(['sendProposalPrepaidCashReceipt'])||!candidate.sendProposalPrepaidCashReceipt?.__endpoint?.callableTrigger)throw Error('Unexpected compiled production export');
          NODE
          test ! -e "$root/.env" && test ! -e "$root/tsconfig.json"
      - name: Authenticate established production deployment identity
        if: ${{ inputs.mode == 'diagnose' || inputs.mode == 'deploy' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SANDMANDASHBOARD }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          chmod 600 "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
          # gcloud CLI must be authenticated separately from ADC for read-only diagnosis/deploy.
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/firebase-sa.json" --project="$PROJECT_ID" --quiet >/dev/null
          node -e 'const x=require(process.env.RUNNER_TEMP+"/firebase-sa.json");if(x.project_id!=="sandmandashboard"||!x.client_email)process.exit(64);console.log("Authenticated production deployment identity:",x.client_email)'
      - name: Capture before-state and verify effective permissions
        if: ${{ inputs.mode == 'diagnose' || inputs.mode == 'deploy' }}
        run: |
          set -euo pipefail
          mkdir -p evidence/before
          if gcloud functions describe "$FUNCTION_NAME" --gen2 --region="$REGION" --project="$PROJECT_ID" --format=json > evidence/before/target.json 2> evidence/before/target.err; then
            echo 'Target already exists; this create-only release is blocked.' >&2; exit 64
          fi
          gcloud functions list --v2 --regions="$REGION" --project="$PROJECT_ID" --format=json > evidence/before/functions.json
          gcloud secrets describe RESEND_API_KEY --project="$PROJECT_ID" --format='json(name,replication)' > evidence/before/resend-secret.json
          gcloud secrets versions list RESEND_API_KEY --project="$PROJECT_ID" --filter='state=ENABLED' --format='json(name,state,createTime)' > evidence/before/resend-versions.json
          gcloud secrets get-iam-policy RESEND_API_KEY --project="$PROJECT_ID" --format=json > evidence/before/resend-iam.json
          token="$(gcloud auth print-access-token)"
          node - "$token" <<'NODE'
          const fs=require('node:fs'),token=process.argv[2],project='sandmandashboard',headers={Authorization:`Bearer ${token}`,'Content-Type':'application/json'};
          const required=['cloudfunctions.functions.create','cloudfunctions.functions.get','cloudfunctions.functions.list','run.services.create','run.services.get','run.services.update','run.services.getIamPolicy','cloudbuild.builds.create'];
          const request=async(url,permissions)=>{const response=await fetch(url,{method:'POST',headers,body:JSON.stringify({permissions})}),result=await response.json();if(!response.ok)throw Error(result.error?.message||'permission test failed');return result};
          (async()=>{
            const result=await request(`https://cloudresourcemanager.googleapis.com/v1/projects/${project}:testIamPermissions`,required);
            const missing=required.filter(value=>!(result.permissions||[]).includes(value));
            fs.writeFileSync('evidence/before/deployer-permissions.json',JSON.stringify({required,granted:result.permissions||[],missing},null,2)+'\n');
            const secret=await request(`https://secretmanager.googleapis.com/v1/projects/${project}/secrets/RESEND_API_KEY:testIamPermissions`,['secretmanager.secrets.get']);
            const secretAllowed=(secret.permissions||[]).includes('secretmanager.secrets.get');
            fs.writeFileSync('evidence/before/deployer-secret-permissions.json',JSON.stringify({resource:'projects/'+project+'/secrets/RESEND_API_KEY',required:['secretmanager.secrets.get'],granted:secret.permissions||[],missing:secretAllowed?[]:['secretmanager.secrets.get']},null,2)+'\n');
            const actAs=await request('https://iam.googleapis.com/v1/projects/-/serviceAccounts/889326401061-compute@developer.gserviceaccount.com:testIamPermissions',['iam.serviceAccounts.actAs']);
            fs.writeFileSync('evidence/before/runtime-actas.json',JSON.stringify(actAs,null,2)+'\n');
            if(missing.length||!secretAllowed)throw Error('Deployment identity missing: '+[...missing,...(!secretAllowed?['secretmanager.secrets.get on RESEND_API_KEY']:[])].join(','));
            const hostingResponse=await fetch('https://firebasehosting.googleapis.com/v1beta1/sites/sandman-main/releases?pageSize=1',{headers:{Authorization:`Bearer ${token}`}});
            const hosting=await hostingResponse.json();
            if(!hostingResponse.ok||!hosting.releases?.[0]?.version?.name)throw Error('Production Hosting baseline unavailable');
            fs.writeFileSync('evidence/before/hosting.json',JSON.stringify({release:hosting.releases[0].name,version:hosting.releases[0].version.name},null,2)+'\n');
          })().catch(error=>{console.error(error.message);process.exit(64)});
          NODE
          node <<'NODE'
          const fs=require('node:fs'),versions=require('./evidence/before/resend-versions.json'),iam=require('./evidence/before/resend-iam.json'),actAs=require('./evidence/before/runtime-actas.json');
          if(!versions.length||versions.some(x=>x.state!=='ENABLED'))throw Error('Enabled RESEND version missing');
          const member='serviceAccount:889326401061-compute@developer.gserviceaccount.com';if(!(iam.bindings||[]).some(b=>b.role==='roles/secretmanager.secretAccessor'&&(b.members||[]).includes(member)))throw Error('Runtime secretAccessor missing');
          if(!(actAs.permissions||[]).includes('iam.serviceAccounts.actAs'))throw Error('Deployment identity cannot act as runtime identity');
          NODE
          printf '%s\n' 'ROLLBACK_REQUIRES_SEPARATE_DELETE_APPROVAL: gcloud functions delete sendProposalPrepaidCashReceipt --gen2 --region=us-central1 --project=sandmandashboard' > evidence/ROLLBACK.txt
      - name: Deploy exactly one new production callable
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pr593-receipt-release"
          gcloud functions deploy "$FUNCTION_NAME" --gen2 --project="$PROJECT_ID" --region="$REGION" \
            --runtime=nodejs22 --entry-point="$FUNCTION_NAME" --source="$root" \
            --run-service-account="$RUNTIME_SA" --cpu=1 --memory=256Mi --timeout=60s --max-instances=20 --concurrency=80 \
            --ingress-settings=all --set-secrets=RESEND_API_KEY=RESEND_API_KEY:latest \
            --trigger-http --no-allow-unauthenticated --quiet
          gcloud run services update sendproposalprepaidcashreceipt --project="$PROJECT_ID" --region="$REGION" --no-invoker-iam-check --quiet
      - name: Verify callable, transport, neighbors and unchanged Hosting
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          set -euo pipefail
          mkdir -p evidence/after
          gcloud functions describe "$FUNCTION_NAME" --gen2 --region="$REGION" --project="$PROJECT_ID" --format=json > evidence/after/target.json
          gcloud functions get-iam-policy "$FUNCTION_NAME" --region="$REGION" --project="$PROJECT_ID" --format=json > evidence/after/function-iam.json
          gcloud run services describe sendproposalprepaidcashreceipt --region="$REGION" --project="$PROJECT_ID" --format=json > evidence/after/run.json
          gcloud run services get-iam-policy sendproposalprepaidcashreceipt --region="$REGION" --project="$PROJECT_ID" --format=json > evidence/after/run-iam.json
          gcloud functions list --v2 --regions="$REGION" --project="$PROJECT_ID" --format=json > evidence/after/functions.json
          token="$(gcloud auth print-access-token)"
          node - "$token" <<'NODE'
          const fs=require('node:fs'),token=process.argv[2];(async()=>{const response=await fetch('https://firebasehosting.googleapis.com/v1beta1/sites/sandman-main/releases?pageSize=1',{headers:{Authorization:`Bearer ${token}`}}),result=await response.json();if(!response.ok||!result.releases?.[0]?.version?.name)throw Error('Production Hosting post-state unavailable');fs.writeFileSync('evidence/after/hosting.json',JSON.stringify({release:result.releases[0].name,version:result.releases[0].version.name},null,2)+'\n')})().catch(error=>{console.error(error.message);process.exit(64)});
          NODE
          node <<'NODE'
          const fs=require('node:fs'),read=file=>JSON.parse(fs.readFileSync(file));const target=read('evidence/after/target.json'),run=read('evidence/after/run.json');
          if(target.state!=='ACTIVE'||target.buildConfig?.runtime!=='nodejs22'||target.buildConfig?.entryPoint!=='sendProposalPrepaidCashReceipt'||target.serviceConfig?.serviceAccountEmail!=='889326401061-compute@developer.gserviceaccount.com')throw Error('Target configuration mismatch');
          if(JSON.stringify((target.serviceConfig?.secretEnvironmentVariables||[]).map(x=>x.key))!==JSON.stringify(['RESEND_API_KEY']))throw Error('Secret binding mismatch');
          if(run.metadata?.annotations?.['run.googleapis.com/invoker-iam-disabled']!=='true')throw Error('Callable transport not configured');
          for(const file of ['evidence/after/function-iam.json','evidence/after/run-iam.json'])if((read(file).bindings||[]).some(b=>(b.members||[]).includes('allUsers')))throw Error('Public invoker IAM binding is forbidden');
          const before=read('evidence/before/functions.json').filter(x=>!x.name.endsWith('/sendProposalPrepaidCashReceipt')).map(x=>[x.name,x.updateTime]).sort();const after=read('evidence/after/functions.json').filter(x=>!x.name.endsWith('/sendProposalPrepaidCashReceipt')).map(x=>[x.name,x.updateTime]).sort();if(JSON.stringify(before)!==JSON.stringify(after))throw Error('Neighbor Function changed');
          if(JSON.stringify(read('evidence/before/hosting.json'))!==JSON.stringify(read('evidence/after/hosting.json')))throw Error('Production Hosting changed');
          NODE
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: pr593-production-receipt-${{ inputs.mode }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
