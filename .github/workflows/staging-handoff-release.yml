name: Protected staging handoff source release
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preflight, deploy]
        default: preflight
        required: true
      confirm_project:
        type: string
        required: true
      confirm_sha:
        type: string
        required: true
      approval:
        type: string
      approved_baseline:
        type: string
permissions:
  contents: read
concurrency:
  group: controlled-exact-sha-staging-release
  cancel-in-progress: false
jobs:
  handoff:
    if: github.repository == 'raulsandoval81-maker/SandmanSystem' && github.ref == 'refs/heads/main'
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      PYTHONPATH: trusted/scripts/production:trusted/scripts/staging
      MODE: ${{ inputs.mode }}
      CONFIRM_PROJECT: ${{ inputs.confirm_project }}
      CONFIRM_SHA: ${{ inputs.confirm_sha }}
      APPROVAL: ${{ inputs.approval }}
      APPROVED_BASELINE: ${{ inputs.approved_baseline }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Verify protected staging dispatch
        run: |
          python3 -c 'import importlib, os; importlib.import_module("staging-handoff-release").guard(os.environ)'
          curl --fail --silent --show-error "https://api.github.com/repos/$GITHUB_REPOSITORY/environments/staging" |
            jq -e 'any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length > 0))' >/dev/null
      - uses: actions/checkout@v4
        with:
          ref: a2d716eb4a54d022ff403f6860138861465b8cda
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 77949da45bfd9c4f9f1e3aa514d523be54779e86
          path: staging-core
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate the exact single-Function package before cloud access
        run: |
          path=functions/src/proposals/issueProposalEnrollmentHandoff.ts
          cp "candidate/$path" "staging-core/$path"
          npm ci --prefix staging-core/functions --ignore-scripts --no-audit --no-fund
          npm run build --prefix staging-core/functions
          python3 -c 'import importlib; importlib.import_module("staging-handoff-release").package()'
      - uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: sandman-practice-deployer@sandman-combat-staging.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
      - name: Capture baseline or update handoff source only
        run: python3 trusted/scripts/staging/staging-handoff-release.py
