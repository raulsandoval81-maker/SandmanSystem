name: Athlete Sprint 1 candidate validation (test-only)

on:
  push:
    branches:
      - codex/athlete-profile-read-authorization
      - codex/sprint1-immutable-lane-archive-retry
    paths:
      - '.github/workflows/athlete-sprint1-test-only.yml'
      - 'public/assets/js/athlete-*.js'
      - 'public/assets/js/immutable-lane-archive.js'
      - 'public/coaches/lanes/honor/review.js'
      - 'public/coaches/lanes/conditioning/review.js'
      - 'public/athletes/**'
      - 'functions/src/modules/athlete/**'
      - 'functions/src/services/athleteProfileReadAuthorization.ts'
      - 'scripts/staging/p0-containment/firestore.rules'
      - 'tests/functions/**'
      - 'tests/firestore/p0-athlete-ownership.rules.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-regressions:
    name: Athlete Node + Functions TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Install only declared dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Build Functions TypeScript without deployment
        run: npm --prefix functions run build
      - name: Run complete targeted Athlete Node suite
        run: |
          node --test \
            tests/functions/dashboard-foundation.test.mjs \
            tests/functions/mini-arsenal-legacy-route.test.mjs \
            tests/functions/full-arsenal-id-case.test.mjs \
            tests/functions/mini-profile-id-case.test.mjs \
            tests/functions/immutable-lane-archive-retry.test.mjs

  firestore-emulator:
    name: Athlete ownership rules + callables (synthetic emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install declared dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Build callable handlers
        run: npm --prefix functions run build
      - name: Run only isolated demo-project Firestore emulator tests
        env:
          GOOGLE_CLOUD_PROJECT: demo-sandman-p0-athlete-ownership
          GCLOUD_PROJECT: demo-sandman-p0-athlete-ownership
        run: |
          npx --yes firebase-tools@14 emulators:exec \
            --only firestore \
            --project demo-sandman-p0-athlete-ownership \
            'node --test tests/firestore/p0-athlete-ownership.rules.test.mjs'
