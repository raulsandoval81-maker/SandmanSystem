name: Deploy Practice Session Functions

on:
  push:
    branches:
      - main
    paths:
      - "functions/src/practice/practiceSessions.ts"
      - ".github/workflows/deploy-practice-session-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandman-practice-session-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Practice Session functions
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout approved commit
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        run: npm ci --prefix functions

      - name: Compile Firebase Functions
        run: npm --prefix functions run build

      - name: Authenticate Firebase CLI
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SANDMANDASHBOARD }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Firebase service account secret is missing"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Deploy Practice Session endpoints
        run: npx --yes firebase-tools@latest deploy --only functions:openPracticeSession,functions:createOrRecoverCanonicalPractice --project sandmandashboard --non-interactive
