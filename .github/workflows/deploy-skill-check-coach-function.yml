name: Deploy Skill Check Coach Function

on:
  workflow_dispatch:
    inputs:
      confirm_project:
        description: "Type sandmandashboard to confirm the production project"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sandman-skill-check-function-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy skillCheckCoachCall only
    if: ${{ inputs.confirm_project == 'sandmandashboard' }}
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout approved commit
        uses: actions/checkout@v5
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install locked Functions dependencies
        run: npm ci --prefix functions
      - name: Build and test Functions
        run: npm test --prefix functions
      - name: Verify production service account secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SANDMANDASHBOARD }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Deploy only skillCheckCoachCall
        run: npx --yes firebase-tools@latest deploy --only functions:skillCheckCoachCall --project sandmandashboard --non-interactive
