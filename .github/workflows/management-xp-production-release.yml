name: Management XP protected single-Function production release
on:
  pull_request:
    paths:
      - '.github/workflows/management-xp-production-release.yml'
      - 'scripts/production/management_xp_*.py'
      - 'tests/production/test_management_xp*.py'
  workflow_dispatch:
    inputs:
      release_mode:
        description: Read-only verify first; DEPLOY requires fresh production approval
        required: true
        default: VERIFY_ONLY
        type: choice
        options:
          - VERIFY_ONLY
          - DEPLOY
      confirm_target:
        description: Type sandmandashboard/us-central1/createManagementXpAdjustment
        required: true
        type: string
      deployment_approval:
        description: Type APPROVE_MANAGEMENT_XP_SINGLE_FUNCTION_RELEASE
        required: true
        type: string
      historical_provenance_ack:
        description: Type ACKNOWLEDGE_PINNED_OLD_IMAGE_AND_BUILD_SOURCE_PROVENANCE_GAPS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sandman-management-xp-production-preflight
  cancel-in-progress: false

jobs:
  offline-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify XP release guard without cloud access
        run: python3 -m unittest discover -s tests/production -p 'test_management_xp*.py'

  release:
    if: github.repository == 'raulsandoval81-maker/SandmanSystem' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: trusted
      - uses: actions/checkout@v4
        with:
          ref: 8734b84762e6765bccf51cadbdf59c52434a7843
          persist-credentials: false
          path: application
      - name: Verify release scope and offline safeguards
        env:
          XP_RELEASE_MODE: ${{ inputs.release_mode }}
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
          DEPLOYMENT_APPROVAL: ${{ inputs.deployment_approval }}
          HISTORICAL_PROVENANCE_ACK: ${{ inputs.historical_provenance_ack }}
        run: |
          set -euo pipefail
          test "$CONFIRM_TARGET" = sandmandashboard/us-central1/createManagementXpAdjustment
          test "$DEPLOYMENT_APPROVAL" = APPROVE_MANAGEMENT_XP_SINGLE_FUNCTION_RELEASE
          test "$HISTORICAL_PROVENANCE_ACK" = ACKNOWLEDGE_PINNED_OLD_IMAGE_AND_BUILD_SOURCE_PROVENANCE_GAPS
          test "$XP_RELEASE_MODE" = VERIFY_ONLY -o "$XP_RELEASE_MODE" = DEPLOY
          python3 -m unittest discover -s trusted/tests/production -p 'test_management_xp*.py'
      - uses: google-github-actions/auth@v2
        with:
          project_id: sandmandashboard
          create_credentials_file: true
          export_environment_variables: true
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SANDMANDASHBOARD }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify provenance and rollback before the exact Function update
        env:
          XP_RELEASE_MODE: ${{ inputs.release_mode }}
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
          DEPLOYMENT_APPROVAL: ${{ inputs.deployment_approval }}
          HISTORICAL_PROVENANCE_ACK: ${{ inputs.historical_provenance_ack }}
        run: python3 trusted/scripts/production/management_xp_release.py application
