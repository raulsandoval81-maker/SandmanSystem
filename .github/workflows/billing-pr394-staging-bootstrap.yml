name: Billing PR394 — separately approved staging bootstrap

on:
  workflow_dispatch:
    inputs:
      action:
        description: Read-only plan or separately approved six-function bootstrap
        required: true
        type: choice
        options:
          - plan
          - execute
        default: plan
      confirm_project:
        description: Type sandman-combat-staging
        required: true
        type: string
      confirm_release:
        description: Type billing-pr394-deploy-7befb7f2
        required: true
        type: string
      approve_six_functions:
        description: For execute only, type APPROVE_SIX_NEW_STAGING_FUNCTIONS
        required: false
        type: string
      confirm_stripe_test_key:
        description: For execute only, independently verify staging secret contains a Stripe test-mode key; type STRIPE_TEST_KEY_VERIFIED
        required: false
        type: string
      confirm_webhook_secret:
        description: For execute only, independently verify staging webhook signing secret matches the Stripe sandbox destination; type STAGING_WEBHOOK_SECRET_MATCH_VERIFIED
        required: false
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: controlled-exact-sha-staging-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - name: Require trusted main and immutable PR394 selection
        env:
          PROJECT: ${{ inputs.confirm_project }}
          RELEASE: ${{ inputs.confirm_release }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "raulsandoval81-maker/SandmanSystem"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${PROJECT}" = "sandman-combat-staging"
          test "${RELEASE}" = "billing-pr394-deploy-7befb7f2"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: exact-sha-staging-release-7befb7f2dba6debb0e32c9336cda99ad897712de
          path: release-artifacts
          run-id: 41169028301
          github-token: ${{ github.token }}
      - name: Verify pinned artifact and bootstrap tests
        run: |
          set -euo pipefail
          test -f release-artifacts/functions/staging-release-entry.cjs
          node -e 'const p=require("./release-artifacts/functions/package.json");if(p.main!=="staging-release-entry.cjs"||p.scripts?.["gcp-build"]!=="")process.exit(64)'
          node --test tests/functions/billing-pr394-bootstrap-workflow.test.mjs
          node scripts/staging/billing-pr394-bootstrap.mjs plan release-artifacts/functions

  bootstrap:
    if: ${{ inputs.action == 'execute' }}
    needs: plan
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - name: Require separate explicit execution and Stripe sandbox attestations
        env:
          APPROVAL: ${{ inputs.approve_six_functions }}
          TEST_KEY: ${{ inputs.confirm_stripe_test_key }}
          WEBHOOK_SECRET: ${{ inputs.confirm_webhook_secret }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${APPROVAL}" = "APPROVE_SIX_NEW_STAGING_FUNCTIONS"
          test "${TEST_KEY}" = "STRIPE_TEST_KEY_VERIFIED"
          test "${WEBHOOK_SECRET}" = "STAGING_WEBHOOK_SECRET_MATCH_VERIFIED"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: exact-sha-staging-release-7befb7f2dba6debb0e32c9336cda99ad897712de
          path: release-artifacts
          run-id: 41169028301
          github-token: ${{ github.token }}
      - uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: sandman-practice-deployer@sandman-combat-staging.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Check staging-only identities and secret metadata without reading secret values
        run: |
          set -euo pipefail
          for account in sandman-practice-deployer sandman-practice-build sandman-billing-runtime; do
            gcloud iam service-accounts describe "${account}@sandman-combat-staging.iam.gserviceaccount.com" --project=sandman-combat-staging --format='value(email)' >/dev/null
          done
          for secret in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET RESEND_API_KEY; do
            gcloud secrets describe "${secret}" --project=sandman-combat-staging --format='value(name)' >/dev/null
          done
          gcloud secrets describe STRIPE_SECRET_KEY --project=sandman-combat-staging --format=json > stripe-metadata.json
          node -e 'const m=require("./stripe-metadata.json");if(m.labels?.environment!=="staging"||m.labels?.stripe_mode!=="test")throw Error("Staging Stripe secret metadata mismatch")'
          # Metadata/attestations do not by themselves prove Stripe key contents.
      - name: Verify only pinned compiled functions are executable
        run: |
          set -euo pipefail
          npm ci --omit=dev --prefix release-artifacts/functions
          node -e 'const a=require("./release-artifacts/functions");for(const n of ["recordHistoricalCashDisposition","issueProposalClientReview","getProposalClientReview","acceptProposalClientReview","createProposalCheckout","stripeBillingWebhook"]){const e=a[n]?.__endpoint;if(!e || !(n==="stripeBillingWebhook" ? e.httpsTrigger&&!e.callableTrigger : e.callableTrigger))throw Error("Unexpected function export: "+n)}'
      - name: Create and independently verify only six new staging functions
        env:
          SANDMAN_BOOTSTRAP_PROJECT: ${{ inputs.confirm_project }}
          SANDMAN_BOOTSTRAP_RELEASE: ${{ inputs.confirm_release }}
          SANDMAN_BOOTSTRAP_AUTHORIZATION: ${{ inputs.approve_six_functions }}
          SANDMAN_STRIPE_TEST_MODE_ATTESTED: ${{ inputs.confirm_stripe_test_key }}
          SANDMAN_STRIPE_WEBHOOK_SECRET_ATTESTED: ${{ inputs.confirm_webhook_secret }}
        run: |
          set -euo pipefail
          node scripts/staging/billing-pr394-bootstrap.mjs execute release-artifacts/functions
