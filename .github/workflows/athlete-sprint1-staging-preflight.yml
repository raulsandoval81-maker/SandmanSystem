name: Athlete Sprint 1 — staging read-only release gate

on:
  workflow_dispatch:
    inputs:
      confirm_project:
        description: "Type sandman-combat-staging; this action reads live metadata only"
        type: string
        required: true

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: athlete-sprint1-staging-readonly
  cancel-in-progress: false

jobs:
  environment-inventory:
    name: Snapshot staged Firestore, Hosting, Functions and rollback identifiers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Enforce trusted dispatch and explicit staging scope
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "raulsandoval81-maker/SandmanSystem"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$CONFIRM_PROJECT" = "sandman-combat-staging"
          test "$GITHUB_WORKFLOW_REF" = "raulsandoval81-maker/SandmanSystem/.github/workflows/athlete-sprint1-staging-preflight.yml@refs/heads/main"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate with existing protected staging identity
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: sandman-staging-deployer@sandman-combat-staging.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify exact Sprint 1 source and record live rollback baselines
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: |
          set -euo pipefail
          python3 scripts/staging/athlete-sprint1-readonly-preflight.py
      - name: Upload sanitized read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint1-staging-readonly-${{ github.run_id }}
          path: sprint1-staging-readonly-evidence.json
          if-no-files-found: warn
          retention-days: 14
