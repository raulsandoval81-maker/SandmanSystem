name: Billing PR410 staging release validation

on:
  pull_request:
    paths:
      - "scripts/staging/approved-exact-sha-releases.json"
      - "scripts/staging/exact-sha-release-policy.mjs"
      - "scripts/staging/prepare-exact-sha-release.mjs"
      - "scripts/staging/gcloud-function-release.mjs"
      - "tests/functions/staging-exact-sha-release.test.mjs"
      - ".github/workflows/staging-exact-sha-release.yml"
      - ".github/workflows/billing-pr410-staging-validation.yml"

permissions:
  contents: read

jobs:
  release-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Check pinned two-function release policy
        run: node --test tests/functions/staging-exact-sha-release.test.mjs
      - name: Build pinned PR410 source and run Billing regressions
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/billing-pr410-source 96a1452d3178c443df83c80aeedfd817cbd69519
          npm --prefix /tmp/billing-pr410-source/functions ci
          npm --prefix /tmp/billing-pr410-source/functions run build
          (
            cd /tmp/billing-pr410-source
            node --test tests/functions/billing-public-origin.test.mjs
            node --test tests/functions/historical-cash-*.test.mjs
          )
      - name: Package the exact two-function staging artifact without deploying
        run: |
          set -euo pipefail
          node scripts/staging/prepare-exact-sha-release.mjs \
            billing-pr410-functions-96a1452d \
            /tmp/billing-pr410-source \
            /tmp/billing-pr410-artifact
          node -e 'const m=require("/tmp/billing-pr410-artifact/release-evidence.json");if(m.hosting!==false||m.functions.join(",")!=="issueProposalClientReview,createProposalCheckout")throw Error("Wrong artifact scope");const e=require("node:fs").readFileSync("/tmp/billing-pr410-artifact/functions/staging-release-entry.cjs","utf8");if(!e.includes("issueProposalClientReview: require(")||!e.includes("createProposalCheckout: require(")||e.includes("stripeBillingWebhook: require(")||e.includes("module.exports = require(\"./lib/staging.js\")"))throw Error("Wrong callable exports");'
      - name: Package separately authorized two-function deployment candidate without deploying
        run: |
          set -euo pipefail
          node scripts/staging/prepare-exact-sha-release.mjs \
            billing-pr410-deploy-96a1452d \
            /tmp/billing-pr410-source \
            /tmp/billing-pr410-deploy-artifact
          node -e 'const fs=require("node:fs");const a=require("/tmp/billing-pr410-deploy-artifact/release-evidence.json");const m=require("./scripts/staging/approved-exact-sha-releases.json")["billing-pr410-deploy-96a1452d"];if(a.hosting!==false||a.functions.join(",")!=="issueProposalClientReview,createProposalCheckout"||m.validationOnly!==false||m.newFunctions.length!==0)throw Error("Unexpected deployment scope");const entry=fs.readFileSync("/tmp/billing-pr410-deploy-artifact/functions/staging-release-entry.cjs","utf8");if(!entry.includes("issueProposalClientReview: require(")||!entry.includes("createProposalCheckout: require(")||entry.includes("stripeBillingWebhook: require("))throw Error("Non-target callable exported");'
      - name: Assert no deployment occurs
        run: |
          node -e 'const r=require("./scripts/staging/approved-exact-sha-releases.json")["billing-pr410-functions-96a1452d"];if(!r||r.validationOnly!==true||r.hosting!==false||r.functions.join(",")!=="issueProposalClientReview,createProposalCheckout")process.exit(64)'
