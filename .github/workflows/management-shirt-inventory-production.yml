name: Management Inventory - Guarded Production Release
on:
  push:
    branches: [main]
    paths:
      - 'functions/src/management/shirtInventory.ts'
      - 'public/management/inventory/**'
      - 'scripts/production/management_inventory_hosting_overlay.py'
      - '.github/workflows/management-shirt-inventory-production.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview only, or deploy the new callable plus six-file overlay
        type: choice
        required: true
        default: preflight
        options: [preflight, deploy]
      confirm_project:
        description: Type sandmandashboard
        required: true
        type: string
      confirm_opening:
        description: Type 147 to acknowledge count; import remains manual after deployment
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sandman-management-inventory-production
  cancel-in-progress: false
jobs:
  inventory:
    name: Verify source, production function and Hosting baseline
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Validate dispatch and protected branch
        env:
          PROJECT: ${{ github.event_name == 'push' && 'sandmandashboard' || inputs.confirm_project }}
          COUNT: ${{ github.event_name == 'push' && '147' || inputs.confirm_opening }}
          MODE: ${{ github.event_name == 'push' && 'deploy' || inputs.mode }}
        run: |
          test "${{ github.ref }}" = "refs/heads/main"
          test "$PROJECT" = "sandmandashboard"
          test "$COUNT" = "147"
          test "$MODE" = "preflight" -o "$MODE" = "deploy"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json
      - name: Build and verify the one-callable change
        shell: bash
        run: |
          npm ci --prefix functions
          npm --prefix functions run build
          node --test functions/tests/managementShirtInventory.test.cjs
          node --check public/management/inventory/inventory.js
          grep -q 'maxInstances:20' functions/src/management/shirtInventory.ts
          grep -q 'managementShirtInventory' functions/src/index.ts
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SANDMANDASHBOARD }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify new Function is not present; no mutations
        shell: bash
        run: |
          set -euo pipefail
          if gcloud functions describe managementShirtInventory --gen2 --project=sandmandashboard --region=us-central1 --format=json > "$RUNNER_TEMP/inventory-existing.json" 2>"$RUNNER_TEMP/inventory-describe-error.txt"; then
            echo "STOP_NO_RETRY: inventory callable already exists; new deployment requires baseline comparison."
            exit 1
          fi
          grep -Eqi 'NOT_FOUND|not found' "$RUNNER_TEMP/inventory-describe-error.txt" || { cat "$RUNNER_TEMP/inventory-describe-error.txt"; exit 1; }
          echo "Function absent as expected. New function may be deployed with maxInstances 20."
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only Hosting API dependencies
        run: |
          python -m pip install 'google-auth>=2.0,<3' 'requests>=2.31,<3'
          python -c 'import google.auth; from google.auth.transport.requests import Request; print("Hosting auth transport ready")'
      - name: Fetch pinned pre-inventory baseline for Hosting parity check
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 1b1b5089643ab21e6205e8ae6c26331dcea9573d
          git cat-file -e 1b1b5089643ab21e6205e8ae6c26331dcea9573d^{commit}
      - name: Preserve and preview live Hosting files
        env:
          MODE: preflight
        run: python scripts/production/management_inventory_hosting_overlay.py
      - name: Deploy only the new Management Inventory callable
        if: github.event_name == 'push' || inputs.mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p isolated/functions
          cp -R functions/lib isolated/functions/lib
          cp functions/package.json functions/package-lock.json isolated/functions/
          node - <<'NODE'
          const fs=require('node:fs');
          const pkg=JSON.parse(fs.readFileSync('isolated/functions/package.json'));
          pkg.main='index.cjs';
          pkg.scripts={};
          fs.writeFileSync('isolated/functions/package.json',JSON.stringify(pkg,null,2)+'\n');
          fs.writeFileSync('isolated/functions/index.cjs',
             'const {getApps,initializeApp}=require("firebase-admin/app");\n'+
             'if (!getApps().length) initializeApp();\n'+
             'module.exports={managementShirtInventory:require("./lib/management/shirtInventory").managementShirtInventory};\n');
          fs.writeFileSync('isolated/firebase.json',JSON.stringify({functions:{source:'functions',runtime:'nodejs22'}}));
          NODE
          cd isolated
          npx --yes firebase-tools@14 deploy --only functions:managementShirtInventory --project sandmandashboard --config firebase.json --non-interactive
      - name: Verify the new revision before deploying Hosting
        if: github.event_name == 'push' || inputs.mode == 'deploy'
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          gcloud functions describe managementShirtInventory --gen2 --project=sandmandashboard --region=us-central1 --format=json > "$RUNNER_TEMP/inventory-deployed.json"
          node - "$RUNNER_TEMP/inventory-deployed.json" <<'NODE'
          const fs=require('node:fs'),v=JSON.parse(fs.readFileSync(process.argv[2]));
          if(v.state!=='ACTIVE'||v.buildConfig?.runtime!=='nodejs22'||Number(v.serviceConfig?.maxInstanceCount)!==20) {
            throw Error('STOP_NO_RETRY: new function runtime/scaling is not healthy');
          }
          if((v.serviceConfig?.secretEnvironmentVariables||[]).length||(v.serviceConfig?.secretVolumes||[]).length)
            throw Error('Unexpected secret config');
          console.log('Callable healthy',v.serviceConfig?.revision);
          NODE
          echo "verified=true" >> "$GITHUB_OUTPUT"
      - name: Overlay exactly six Hosting files, preserving all others
        if: (github.event_name == 'push' || inputs.mode == 'deploy') && steps.verify.outputs.verified == 'true'
        env:
          MODE: deploy
          INVENTORY_FUNCTION_VERIFIED: 'true'
        run: python scripts/production/management_inventory_hosting_overlay.py
      - name: Confirm published static assets
        if: (github.event_name == 'push' || inputs.mode == 'deploy') && steps.verify.outputs.verified == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://sandmancombat.com/management/inventory/ | grep -q 'Shirt Inventory'
          curl --fail --silent --show-error --location https://sandmancombat.com/management/inventory/inventory.js | grep -q 'managementShirtInventory'
          echo 'Production Hosting inventory assets present. No inventory data was seeded.'
