name: Elias P-000019 Billing UI production Hosting overlay

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preflight or protected Hosting-only deploy
        required: true
        type: choice
        default: preflight
        options: [preflight, deploy]
      confirm_project:
        description: Type sandmandashboard exactly
        required: true
        type: string
      confirm_source_sha:
        description: Exact immutable PR427 corrective UI source SHA
        required: true
        type: string
      expected_current_release:
        description: Reviewed live Hosting release from preflight (deploy only)
        required: false
        type: string
      expected_current_version:
        description: Reviewed live Hosting version from preflight (deploy only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sandman-production-hosting
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          path: trusted-tooling
          persist-credentials: false
      - name: Enforce immutable approved source and target
        env:
          PROJECT: ${{ inputs.confirm_project }}
          SOURCE_SHA: ${{ inputs.confirm_source_sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_WORKFLOW_REF}" = "raulsandoval81-maker/SandmanSystem/.github/workflows/release-elias-p000019-billing-hosting-production.yml@refs/heads/main"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${PROJECT}" = "sandmandashboard"
          test "${SOURCE_SHA}" = "f3650ca4007448086d5a674df5784bbb3cdb9f54"
      - uses: actions/checkout@v5
        with:
          ref: f3650ca4007448086d5a674df5784bbb3cdb9f54
          path: application
          persist-credentials: false
      - name: Verify immutable Billing correction source
        working-directory: application
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f3650ca4007448086d5a674df5784bbb3cdb9f54"
          test -z "$(git status --porcelain=v1)"
          grep -q 'data-correct-p000019' public/management/billing/billing.js
          grep -q 'correctP000019HistoricalAllocation' public/management/billing/billing.js
          test -f public/management/shared/services/historical-payment-summary.js
          grep -q 'export function historicalPaymentSummary' public/management/shared/services/historical-payment-summary.js
          grep -q '/management/shared/services/historical-payment-summary.js' public/management/billing/billing.js
          node --test tests/functions/p000019-historical-allocation-ui.test.mjs tests/functions/management-historical-ledger-sync.test.mjs
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SANDMANDASHBOARD }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-auth requests
      - name: Preflight or release Billing HTML, JS and required shared summary, preserve entire live site
        run: |
          python trusted-tooling/scripts/production/elias_p000019_billing_hosting_release.py \
            --source-root application \
            --evidence-dir release-evidence \
            --mode "${{ inputs.mode }}" \
            --confirm-project "${{ inputs.confirm_project }}" \
            --confirm-source-sha "${{ inputs.confirm_source_sha }}" \
            --expected-release "${{ inputs.expected_current_release }}" \
            --expected-version "${{ inputs.expected_current_version }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elias-p000019-billing-hosting-${{ github.run_id }}-${{ inputs.mode }}
          path: release-evidence/
          if-no-files-found: error
