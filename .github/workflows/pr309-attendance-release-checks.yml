name: PR309 Attendance staging-release safeguards

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/staging-exact-sha-release.yml'
      - '.github/workflows/pr309-attendance-release-checks.yml'
      - 'scripts/staging/approved-exact-sha-releases.json'
      - 'scripts/staging/exact-sha-release-policy.mjs'
      - 'scripts/staging/prepare-exact-sha-release.mjs'
      - 'tests/functions/staging-exact-sha-release.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-and-package-safeguards:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release policy, exact source and isolated artifact invariants
        run: node --test tests/functions/staging-exact-sha-release.test.mjs
      - name: Verify application source initialization and authorization checks
        run: node --test tests/functions/staging-practice-admin-initialization.test.mjs
      - name: Verify workflow and packaging JavaScript syntax
        run: |
          node --check scripts/staging/exact-sha-release-policy.mjs
          node --check scripts/staging/prepare-exact-sha-release.mjs
