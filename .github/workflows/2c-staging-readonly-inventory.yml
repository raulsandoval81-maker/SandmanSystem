name: Emmett 2C read-only staging Function inventory

on:
  pull_request:
    paths:
      - '.github/workflows/2c-staging-readonly-inventory.yml'
      - 'scripts/staging/emmett-2c-readonly-preflight-plan.json'
      - 'tests/functions/emmett-2c-staging-preflight-plan.test.mjs'
  workflow_dispatch:
    inputs:
      confirm_project:
        description: Type sandman-combat-staging to request read-only inventory
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: emmett-2c-staging-readonly-inventory
  cancel-in-progress: false

jobs:
  offline-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify read-only scope plan
        run: node --test tests/functions/emmett-2c-staging-preflight-plan.test.mjs

  staging-function-inventory:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: offline-validation
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Refuse unapproved branch or project and reject deployment flags
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${CONFIRM_PROJECT}" = "sandman-combat-staging"
          node -e 'const m=require("./scripts/staging/emmett-2c-readonly-preflight-plan.json"); if(m.deploymentAuthorized!==false||m.productionAuthorized!==false||m.mode!=="validation-only"||m.syntheticDataOnly!==true||m.targetProject!=="sandman-combat-staging")process.exit(64)'
      - uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: sandman-practice-deployer@sandman-combat-staging.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Capture non-secret metadata and IAM fingerprints without writes
        run: |
          set -euo pipefail
          mkdir -p evidence
          node -e 'const m=require("./scripts/staging/emmett-2c-readonly-preflight-plan.json");for(const f of m.functionsToInventory) {if(!/^[a-zA-Z][a-zA-Z0-9]*$/.test(f))process.exit(64); console.log(f)}' > evidence/functions.txt
          while IFS= read -r fn; do
            mkdir -p "evidence/${fn}"
            if gcloud functions describe "${fn}" --v2 --region=us-central1 --project=sandman-combat-staging --format=json > "evidence/${fn}/function.raw.json"; then
              jq '{name, state, updateTime, runtime:.buildConfig.runtime, entryPoint:.buildConfig.entryPoint, revision:.serviceConfig.revision, serviceAccount:.serviceConfig.serviceAccountEmail, ingressSettings:.serviceConfig.ingressSettings, runtimeSecretNames:[.serviceConfig.secretEnvironmentVariables[]?.key]}' "evidence/${fn}/function.raw.json" > "evidence/${fn}/function.summary.json"
              gcloud functions get-iam-policy "${fn}" --region=us-central1 --project=sandman-combat-staging --format=json | jq -S . | sha256sum | cut -d' ' -f1 > "evidence/${fn}/function-iam.sha256"
              # A discovered Gen2 service uses the known lower-case callable service convention.
              service="$(printf '%s' "${fn}" | tr '[:upper:]' '[:lower:]')"
              gcloud run services describe "${service}" --region=us-central1 --project=sandman-combat-staging --format=json |
                jq '{service:.metadata.name, generation:.metadata.generation, latestReadyRevision:.status.latestReadyRevisionName, traffic:.status.traffic, invocationIamDisabled:.metadata.annotations["run.googleapis.com/invoker-iam-disabled"]}' > "evidence/${fn}/run.summary.json"
              gcloud run services get-iam-policy "${service}" --region=us-central1 --project=sandman-combat-staging --format=json |
                jq -S . | sha256sum | cut -d' ' -f1 > "evidence/${fn}/run-iam.sha256"
              rm "evidence/${fn}/function.raw.json"
            else
              rm -f "evidence/${fn}/function.raw.json"
              printf 'ABSENT_OR_INACCESSIBLE: manual verification required\n' > "evidence/${fn}/status.txt"
            fi
          done < evidence/functions.txt
      - name: Upload read-only evidence for release review
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: emmett-2c-staging-function-inventory-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
