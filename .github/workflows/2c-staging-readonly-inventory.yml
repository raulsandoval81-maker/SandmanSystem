name: Emmett 2C read-only staging Function inventory

on:
  pull_request:
    paths:
      - '.github/workflows/2c-staging-readonly-inventory.yml'
      - 'scripts/staging/emmett-2c-readonly-preflight-plan.json'
      - 'tests/functions/emmett-2c-staging-preflight-plan.test.mjs'
  # Cloud inventory moved to the existing authorized staging-exact-sha-release.yml.
  # Keep this workflow for offline PR checks only: it must not request OIDC.

permissions:
  contents: read

concurrency:
  group: emmett-2c-staging-readonly-inventory
  cancel-in-progress: false

jobs:
  offline-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify read-only scope plan
        run: node --test tests/functions/emmett-2c-staging-preflight-plan.test.mjs

