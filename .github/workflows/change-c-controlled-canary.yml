name: Change C controlled staging canary

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact authorized first-canary release SHA
        required: true
        default: 6ca5309c2f7149468b0b45efc18c0271fd5cd311
        type: string
      function_name:
        description: Exact authorized first-canary function
        required: true
        type: choice
        options:
          - getPracticeSession
      confirm_project:
        description: Type sandman-combat-staging
        required: true
        type: string
      transport_evidence:
        description: Exact function-bound callable transport evidence
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: change-c-controlled-staging-canary
  cancel-in-progress: false

jobs:
  deploy-one:
    runs-on: ubuntu-24.04
    environment: change-c-staging-canary
    env:
      SANDMAN_STAGING_PROJECT_ID: sandman-combat-staging
      SANDMAN_STAGING_PROJECT_NUMBER: "991554514268"
      SANDMAN_STAGING_ACK: sandman-combat-staging
      SANDMAN_AUTHORIZED_RELEASE_SHA: 6ca5309c2f7149468b0b45efc18c0271fd5cd311
      SANDMAN_AUTHORIZED_FUNCTION: getPracticeSession
      SANDMAN_AUTHORIZED_WORKFLOW_REF: refs/heads/release/change-c-canary-dispatcher
      SANDMAN_CALLABLE_TRANSPORT_VERIFIED: "YES"
      SANDMAN_CALLABLE_TRANSPORT_EVIDENCE: ${{ inputs.transport_evidence }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6ca5309c2f7149468b0b45efc18c0271fd5cd311
          persist-credentials: false
      - name: Verify immutable first-canary authorization
        id: plan
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          FUNCTION_NAME: ${{ inputs.function_name }}
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "${SANDMAN_AUTHORIZED_WORKFLOW_REF}"
          test "${CONFIRM_PROJECT}" = "sandman-combat-staging"
          test "${RELEASE_SHA}" = "${SANDMAN_AUTHORIZED_RELEASE_SHA}"
          test "${FUNCTION_NAME}" = "${SANDMAN_AUTHORIZED_FUNCTION}"
          test "$(git rev-parse HEAD)" = "${SANDMAN_AUTHORIZED_RELEASE_SHA}"
          test "$(git status --porcelain=v1 --untracked-files=all)" = ""
          echo "runtime=sandman-practice-runtime@sandman-combat-staging.iam.gserviceaccount.com" >> "${GITHUB_OUTPUT}"
          echo "deployer=sandman-practice-deployer@sandman-combat-staging.iam.gserviceaccount.com" >> "${GITHUB_OUTPUT}"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Test immutable release in an isolated copy
        shell: bash
        env:
          TEST_ROOT: ${{ runner.temp }}/change-c-release-tests-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test ! -e "${TEST_ROOT}"
          mkdir -p "${TEST_ROOT}"
          git archive "${SANDMAN_AUTHORIZED_RELEASE_SHA}" | tar -x -C "${TEST_ROOT}"
          npm ci --prefix "${TEST_ROOT}/functions"
          npm test --prefix "${TEST_ROOT}/functions"
          (
            cd "${TEST_ROOT}"
            node --test tests/functions/staging-runtime-hardening.test.mjs tests/functions/wrestling-staging-isolation.test.mjs
          )
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-github-actions
          service_account: ${{ steps.plan.outputs.deployer }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Verify deployment checkout remains immutable
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SANDMAN_AUTHORIZED_RELEASE_SHA}"
          test "$(git status --porcelain=v1 --untracked-files=all)" = ""
          test "$(git diff --cached --name-only)" = ""
          test "$(git ls-files --others --ignored --exclude-standard -- functions/src functions/package.json functions/package-lock.json functions/tsconfig.json)" = ""
          test "$(git ls-files -s -- functions/src | awk '$1 == "120000" { print }')" = ""
      - name: Install reviewed Functions dependencies for deployment build
        run: npm ci --prefix functions
      - name: Deploy exactly one reviewed callable
        env:
          SANDMAN_STAGING_SERVICE_ACCOUNT_EMAIL: ${{ steps.plan.outputs.deployer }}
          SANDMAN_SELECTED_RUNTIME_SERVICE_ACCOUNT: ${{ steps.plan.outputs.runtime }}
          SANDMAN_STAGING_MIGRATION_CONFIRM: MIGRATE:getPracticeSession:sandman-combat-staging
          RELEASE_SHA: ${{ inputs.release_sha }}
          FUNCTION_NAME: ${{ inputs.function_name }}
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "${SANDMAN_AUTHORIZED_WORKFLOW_REF}"
          test "${CONFIRM_PROJECT}" = "sandman-combat-staging"
          test "${RELEASE_SHA}" = "${SANDMAN_AUTHORIZED_RELEASE_SHA}"
          test "${FUNCTION_NAME}" = "${SANDMAN_AUTHORIZED_FUNCTION}"
          test "$(git rev-parse HEAD)" = "${SANDMAN_AUTHORIZED_RELEASE_SHA}"
          node scripts/staging/migrate-one-function.mjs --deploy \
            --function getPracticeSession \
            --commit 6ca5309c2f7149468b0b45efc18c0271fd5cd311
