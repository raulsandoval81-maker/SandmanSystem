name: Change C controlled staging canary

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact reviewed 40-character release SHA
        required: true
        type: string
      function_name:
        description: One approved staging function
        required: true
        type: choice
        options:
          - getPracticeSession
          - getPracticeAttendanceReview
          - createOrRecoverCanonicalPractice
          - openPracticeSession
          - savePracticeSessionMemory
          - saveDailyPracticeLog
          - updatePracticeCheckIn
          - finalizePracticeAttendance
          - savePracticeAthleteInput
          - closePracticeSession
          - completePracticeDailyGrind
          - skillCheckCoachCall
      confirm_project:
        description: Type sandman-combat-staging
        required: true
        type: string
      transport_evidence:
        description: Exact function-bound callable transport evidence
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: change-c-controlled-staging-canary
  cancel-in-progress: false

jobs:
  deploy-one:
    runs-on: ubuntu-24.04
    environment: change-c-staging-canary
    env:
      SANDMAN_STAGING_PROJECT_ID: sandman-combat-staging
      SANDMAN_STAGING_PROJECT_NUMBER: "991554514268"
      SANDMAN_STAGING_ACK: sandman-combat-staging
      SANDMAN_CALLABLE_TRANSPORT_VERIFIED: "YES"
      SANDMAN_CALLABLE_TRANSPORT_EVIDENCE: ${{ inputs.transport_evidence }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Verify immutable source and select exact identity group
        id: plan
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          FUNCTION_NAME: ${{ inputs.function_name }}
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: |
          set -euo pipefail
          test "${CONFIRM_PROJECT}" = "sandman-combat-staging"
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          test "$(git status --porcelain=v1 --untracked-files=all)" = ""
          case "${FUNCTION_NAME}" in
            getPracticeAttendanceReview|updatePracticeCheckIn|finalizePracticeAttendance) group=attendance ;;
            createOrRecoverCanonicalPractice|openPracticeSession|getPracticeSession|closePracticeSession|savePracticeSessionMemory|savePracticeAthleteInput|saveDailyPracticeLog) group=practice ;;
            completePracticeDailyGrind|skillCheckCoachCall) group=progression ;;
            *) exit 64 ;;
          esac
          echo "group=${group}" >> "${GITHUB_OUTPUT}"
          echo "runtime=sandman-${group}-runtime@sandman-combat-staging.iam.gserviceaccount.com" >> "${GITHUB_OUTPUT}"
          echo "deployer=sandman-${group}-deployer@sandman-combat-staging.iam.gserviceaccount.com" >> "${GITHUB_OUTPUT}"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - run: npm test --prefix functions
      - run: node --test tests/functions/staging-runtime-hardening.test.mjs tests/functions/wrestling-staging-isolation.test.mjs
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-github-actions
          service_account: ${{ steps.plan.outputs.deployer }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Deploy exactly one reviewed callable
        env:
          SANDMAN_STAGING_SERVICE_ACCOUNT_EMAIL: ${{ steps.plan.outputs.deployer }}
          SANDMAN_SELECTED_RUNTIME_SERVICE_ACCOUNT: ${{ steps.plan.outputs.runtime }}
          SANDMAN_STAGING_MIGRATION_CONFIRM: MIGRATE:${{ inputs.function_name }}:sandman-combat-staging
        run: node scripts/staging/migrate-one-function.mjs --deploy --function "${{ inputs.function_name }}" --commit "${{ inputs.release_sha }}"
