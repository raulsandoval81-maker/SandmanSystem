name: Command Center #862 — staging release gate validation (offline)

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'scripts/staging/command-center-862-readonly.py'
      - 'scripts/staging/test_command_center_862_readonly.py'
      - 'scripts/staging/command-center-862-release.py'
      - 'scripts/staging/test_command_center_862_release.py'
      - '.github/workflows/staging-exact-sha-release.yml'
      - '.github/workflows/command-center-862-staging-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate exact 15 reviewed Command Center sources, 7 Hosting paths and isolated read-only gate
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts/staging/command-center-862-readonly.py scripts/staging/test_command_center_862_readonly.py scripts/staging/command-center-862-release.py scripts/staging/test_command_center_862_release.py
          python3 -m unittest discover -s scripts/staging -p 'test_command_center_862_*.py' -v
          ruby -ryaml -e 'YAML.load_file(ARGV.fetch(0))' .github/workflows/staging-exact-sha-release.yml
          ruby -ryaml -e 'YAML.load_file(ARGV.fetch(0))' .github/workflows/command-center-862-staging-validation.yml
      - name: Build merged application without staging or production credentials
        env:
          STRIPE_SECRET_KEY: ''
          RESEND_API_KEY: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix functions --ignore-scripts --no-audit --no-fund
          npm run build --prefix functions
          node --test functions/tests/commandCenterPolicy.test.cjs tests/functions/command-center-v1.test.mjs
      - name: Deny ALL client direct reads and writes on Command Center collections
        env:
          STRIPE_SECRET_KEY: ''
          RESEND_API_KEY: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
        run: |
          npx --yes firebase-tools@15.11.0 emulators:exec \
            --project demo-sandman-command-center-rules \
            --config firebase.json --only firestore \
            'node --test tests/firestore/command-center.rules.test.mjs'
      - name: Verify real synthetic Auth, Functions and Firestore owner lifecycle
        env:
          STRIPE_SECRET_KEY: ''
          RESEND_API_KEY: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
        run: |
          npx --yes firebase-tools@15.11.0 emulators:exec \
            --project demo-sandman-command-center-e2e \
            --config firebase.paid-in-full-test.json --only firestore,auth,functions \
            'node --test tests/emulator/command-center.e2e.test.mjs'
