name: PR505 2C protected live staging read-only inventory

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Only validate is available; no deploy action exists"
        required: true
        default: validate
        type: choice
        options: [validate]
      confirm_project:
        description: "Type sandman-combat-staging"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: pr505-staging-readonly
  cancel-in-progress: false

jobs:
  inventory:
    if: ${{ github.ref == 'refs/heads/main' && inputs.action == 'validate' && inputs.confirm_project == 'sandman-combat-staging' }}
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out protected trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Fail closed unless protected read-only entrypoint
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          RELEASE_ACTION: ${{ inputs.action }}
          APPROVE_RELEASE: ""
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "raulsandoval81-maker/SandmanSystem"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_WORKFLOW_REF}" = "raulsandoval81-maker/SandmanSystem/.github/workflows/pr505-2c-live-readonly.yml@refs/heads/main"
          test "${CONFIRM_PROJECT}" = "sandman-combat-staging"
          test "${RELEASE_ACTION}" = "validate"
          test -z "${APPROVE_RELEASE}"
          python3 -m py_compile scripts/staging/pr505-2c-live-readonly-inventory.py
          node -e 'let m=require("./scripts/staging/pr505-2c-readonly-plan.json");if(m.deploymentAuthorized!==false||m.productionAuthorized!==false||m.iamChangesAuthorized!==false||m.stripeOperationsAuthorized!==false||m.sendEmailsAuthorized!==false)process.exit(64)'
      - name: Diagnose exact protected GitHub OIDC claims without cloud access
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          RELEASE_ACTION: ${{ inputs.action }}
          APPROVE_RELEASE: ""
        run: |
          set -euo pipefail
          node scripts/staging/pr505-2c-oidc-diagnostics.cjs
      - name: Authenticate existing staging Functions read principal
        uses: google-github-actions/auth@v3
        with:
          project_id: sandman-combat-staging
          workload_identity_provider: projects/991554514268/locations/global/workloadIdentityPools/sandman-github-staging/providers/sandman-hybrid-staging
          service_account: sandman-practice-deployer@sandman-combat-staging.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Capture only sanitized read-only Function metadata and IAM digests
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          RELEASE_ACTION: ${{ inputs.action }}
          APPROVE_RELEASE: ""
          PR505_EVIDENCE_FILE: pr505-readonly-evidence.json
        run: |
          set -euo pipefail
          python3 scripts/staging/pr505-2c-live-readonly-inventory.py
      - name: Upload sanitized non-authorizing staging inventory
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: pr505-2c-live-readonly-${{ github.run_id }}
          path: pr505-readonly-evidence.json
          if-no-files-found: error
