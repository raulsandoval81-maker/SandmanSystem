name: Commercial foundation isolation tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'commercial-foundation/**'
      - 'foundation/commercial/**'
      - '.github/workflows/commercial-foundation-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commercial-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: commercial-foundation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: commercial-foundation/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:production-dependencies

  postgres-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: commercial_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d commercial_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: commercial-foundation
    env:
      DATABASE_URL: postgres://postgres:synthetic-ci-only@localhost:5432/commercial_acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: commercial-foundation/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:postgres
