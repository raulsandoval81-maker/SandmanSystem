name: Historical Skill Reconciliation Tests

on:
  push:
    paths:
      - 'functions/src/modules/historicalSkillReconciliation.ts'
      - 'functions/src/modules/verifiedProgressionResolver.ts'
      - 'functions/src/modules/skillCheckCoachCall.ts'
      - 'functions/src/practice/practiceSessions.ts'
      - 'functions/src/enrollment/syncActivatedEnrollmentPlacement.ts'
      - 'firestore.rules'
      - 'functions/tests/**'
      - 'public/management/shared/services/historical-payment-summary.js'
      - 'public/management/billing/billing.js'
      - 'public/connect/proposals/proposals.js'
      - 'public/management/enrollment-flow/enrollment-flow.js'
      - 'tests/functions/p000019-historical-allocation-ui.test.mjs'
      - 'tests/functions/management-historical-ledger-sync.test.mjs'
      - 'functions/package.json'
      - 'functions/package-lock.json'
      - '.github/workflows/historical-skill-tests.yml'
  pull_request:
    paths:
      - 'functions/src/modules/historicalSkillReconciliation.ts'
      - 'functions/src/modules/verifiedProgressionResolver.ts'
      - 'functions/src/modules/skillCheckCoachCall.ts'
      - 'functions/src/practice/practiceSessions.ts'
      - 'functions/src/enrollment/syncActivatedEnrollmentPlacement.ts'
      - 'firestore.rules'
      - 'functions/tests/**'
      - 'public/management/shared/services/historical-payment-summary.js'
      - 'public/management/billing/billing.js'
      - 'public/connect/proposals/proposals.js'
      - 'public/management/enrollment-flow/enrollment-flow.js'
      - 'tests/functions/p000019-historical-allocation-ui.test.mjs'
      - 'tests/functions/management-historical-ledger-sync.test.mjs'
      - 'functions/package.json'
      - 'functions/package-lock.json'
      - '.github/workflows/historical-skill-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functions-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Validate P-000019 correction and cross-page Management ledger
        working-directory: .
        run: node --test tests/functions/p000019-historical-allocation-ui.test.mjs tests/functions/management-historical-ledger-sync.test.mjs

  firestore-emulator-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: functions
      - name: Run isolated Firestore emulator integration tests
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-sandman-historical 'npm --prefix functions run test:integration'
