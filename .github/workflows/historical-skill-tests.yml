name: Historical Skill Reconciliation Tests

on:
  push:
    paths:
      - 'functions/src/modules/historicalSkillReconciliation.ts'
      - 'functions/src/modules/resumableHistoricalCertification.ts'
      - 'functions/src/modules/resumableHistoricalCertificationCall.ts'
      - 'functions/src/modules/verifiedProgressionResolver.ts'
      - 'functions/src/modules/skillCheckCoachCall.ts'
      - 'functions/src/config/functionRuntime.ts'
      - 'functions/src/practice/practiceSessions.ts'
      - 'functions/src/enrollment/syncActivatedEnrollmentPlacement.ts'
      - 'firestore.rules'
      - 'functions/tests/**'
      - 'functions/scripts/inspect-historical-evidence.mjs'
      - 'functions/scripts/historical-certification-fixtures.mjs'
      - 'scripts/staging/**'
      - 'tests/functions/historical-staging-readiness.test.mjs'
      - 'tests/functions/wrestling-staging-isolation.test.mjs'
      - 'tests/functions/staging-runtime-hardening.test.mjs'
      - 'docs/staging-phase-4-transport-artifact-integrity.md'
      - 'firebase.staging.json'
      - '.firebaserc'
      - 'functions/package.json'
      - 'functions/package-lock.json'
      - '.github/workflows/historical-skill-tests.yml'
  pull_request:
    paths:
      - 'functions/src/modules/historicalSkillReconciliation.ts'
      - 'functions/src/modules/resumableHistoricalCertification.ts'
      - 'functions/src/modules/resumableHistoricalCertificationCall.ts'
      - 'functions/src/modules/verifiedProgressionResolver.ts'
      - 'functions/src/modules/skillCheckCoachCall.ts'
      - 'functions/src/config/functionRuntime.ts'
      - 'functions/src/practice/practiceSessions.ts'
      - 'functions/src/enrollment/syncActivatedEnrollmentPlacement.ts'
      - 'firestore.rules'
      - 'functions/tests/**'
      - 'functions/scripts/inspect-historical-evidence.mjs'
      - 'functions/scripts/historical-certification-fixtures.mjs'
      - 'scripts/staging/**'
      - 'tests/functions/historical-staging-readiness.test.mjs'
      - 'tests/functions/wrestling-staging-isolation.test.mjs'
      - 'tests/functions/staging-runtime-hardening.test.mjs'
      - 'docs/staging-phase-4-transport-artifact-integrity.md'
      - 'firebase.staging.json'
      - '.firebaserc'
      - 'functions/package.json'
      - 'functions/package-lock.json'
      - '.github/workflows/historical-skill-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      - name: Verify staging isolation, runtime hardening, inspection, fixtures, and runner
        run: node --test tests/functions/wrestling-staging-isolation.test.mjs tests/functions/historical-staging-readiness.test.mjs tests/functions/staging-runtime-hardening.test.mjs

  functions-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test

  historical-authority-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: functions
      - name: Install isolated rules-test dependencies
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing firebase
        working-directory: functions
      - name: Enforce historical authority Firestore rules
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-sandman-historical 'node functions/tests/historicalAuthority.rules.cjs'

  firestore-emulator-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: functions
      - name: Run isolated Firestore emulator integration tests
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-sandman-historical 'npm --prefix functions run test:integration'
