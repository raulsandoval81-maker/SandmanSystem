<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Access | Sandman System</title><link rel="stylesheet" href="/assets/css/admin-ui.css"></head>
<body class="admin-app"><main class="admin-auth-page"><section class="admin-auth-card" aria-labelledby="entryTitle">
  <p class="admin-eyebrow">Sandman System Administration</p><h1 id="entryTitle">Admin Workspace</h1>
  <p class="admin-hero__lede">Governance, access control, operational oversight, and system integrity.</p>
  <p id="entryStatus" class="admin-status" role="status">Verifying Admin access…</p>
  <div class="admin-auth-actions"><a class="admin-button admin-button--primary" href="/admin/auth/login.html">Open Admin Sign In</a><a class="admin-button" href="/login/">Choose a Different Workspace</a></div>
</section></main>
<script type="module">
import {requireAdmin} from "/assets/js/admin-guard.js";
const statusEl=document.getElementById("entryStatus");
try{await requireAdmin();statusEl.textContent="Admin access verified. Opening the Admin Hub…";statusEl.classList.add("is-verified");window.location.replace("/admin/hub/dashboard.html")}catch(error){statusEl.textContent="Sign in with an active Admin account to continue."}
</script></body></html>
