<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      background: #0b1220;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      background: #111827;
      padding: 28px;
      border-radius: 16px;
      width: 320px;
      box-shadow: 0 0 0 1px #1f2937;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 20px;
      text-align: center;
      color: #facc15;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #020617;
      color: #fff;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #facc15;
      color: #000;
      font-weight: 600;
      cursor: pointer;
    }

    .link-btn {
      margin-top: 10px;
      background: transparent;
      color: #facc15;
      border: 1px solid #374151;
    }

    .status {
      margin-top: 10px;
      font-size: 13px;
      text-align: center;
      color: #9ca3af;
      min-height: 18px;
    }

    .error {
      color: #f87171;
    }
  
    .remember-row {
      display: flex !important;
      align-items: flex-start !important;
      gap: 10px !important;
      margin: 4px 0 16px !important;
      color: #374151 !important;
      cursor: pointer !important;
    }

    .remember-row input {
      width: 18px !important;
      height: 18px !important;
      min-height: 18px !important;
      margin: 2px 0 0 !important;
      padding: 0 !important;
      flex: 0 0 18px !important;
      accent-color: #d4af37 !important;
      box-shadow: none !important;
    }

    .remember-row span {
      display: block !important;
      line-height: 1.35 !important;
    }

    .remember-row strong {
      display: block !important;
      color: #111827 !important;
      font-size: 0.9rem !important;
      font-weight: 900 !important;
    }

    .remember-row small {
      display: block !important;
      margin-top: 3px !important;
      color: #6b7280 !important;
      font-size: 0.78rem !important;
      font-weight: 500 !important;
      line-height: 1.4 !important;
    }

  </style>

  <link
    rel="stylesheet"
    href="/assets/css/portal-auth.css"
  />
  <link rel="stylesheet" href="/assets/css/password-toggle.css">
  <link rel="stylesheet" href="/assets/css/admin-ui.css">
</head>
<body class="admin-app admin-auth-page">

  <main class="card admin-auth-card">
    <p class="kicker admin-eyebrow">Sandman System Administration</p>
    <h1>Admin Access</h1>

    <p class="sub">
      Sign in with an approved administrator account.
    </p>

    <input id="email" type="email" placeholder="Admin email" autocomplete="username" />
    <input id="password" type="password" placeholder="Password" />

    <label class="remember-row" for="keepSignedIn">
      <input
        id="keepSignedIn"
        type="checkbox"
      />

      <span>
        <strong>Keep me signed in on this device</strong>

        <small>
          Leave unchecked on shared devices or when you regularly
          use more than one Sandman account.
        </small>
      </span>
    </label>



    <button id="loginBtn" class="admin-button admin-button--primary">Sign In</button>
    <button id="resetBtn" class="link-btn admin-button" type="button">Forgot Password?</button>

    <div id="status" class="status"></div>
    
    <a
      class="back-link"
      href="/management/auth/"
    >
      Open Management Access
    </a>

<a class="back-link" href="/login/">
      ← Choose a different role
    </a>
  </main>


<script type="module">
  import {
    auth
  } from "/assets/js/firebase-init.js";

  import { requireAdmin } from "/assets/js/admin-guard.js";

  import {
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    onAuthStateChanged,
    browserLocalPersistence,
    browserSessionPersistence,
    setPersistence,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";


  const keepSignedIn =
    document.getElementById("keepSignedIn");

  const statusEl =
    document.getElementById("status");

  const emailEl =
    document.getElementById("email");

  const passwordEl =
    document.getElementById("password");

  const loginBtn =
    document.getElementById("loginBtn");

  const resetBtn =
    document.getElementById("resetBtn");

  const params =
    new URLSearchParams(window.location.search);

  const requestedReturnUrl =
    params.get("returnUrl") ||
    params.get("next") ||
    "";


  function getSafeReturnUrl() {
    if (
      requestedReturnUrl &&
      requestedReturnUrl.startsWith("/") &&
      !requestedReturnUrl.startsWith("//") &&
      requestedReturnUrl.startsWith("/admin/")
    ) {
      return requestedReturnUrl;
    }

    return "/admin/hub/dashboard.html";
  }


  function setStatus(
    message,
    isError = false
  ) {
    statusEl.textContent = message;

    statusEl.classList.toggle(
      "error",
      isError
    );
  }


  async function applyAuthPersistence() {
    await setPersistence(
      auth,
      keepSignedIn?.checked
        ? browserLocalPersistence
        : browserSessionPersistence
    );
  }


  function redirectAfterLogin() {
    window.location.replace(
      getSafeReturnUrl()
    );
  }


  async function handleLogin() {
    const email =
      emailEl.value.trim();

    const password =
      passwordEl.value;

    if (!email || !password) {
      setStatus(
        "Enter email and password.",
        true
      );

      return;
    }

    try {
      setStatus("Signing in...");

      loginBtn.disabled = true;
      resetBtn.disabled = true;

      /*
       * Remove an anonymous Firebase session before
       * attempting administrator authentication.
       */
      if (auth.currentUser?.isAnonymous) {
        await signOut(auth);
      }

      await applyAuthPersistence();

      const result =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      if (
        !result.user ||
        result.user.isAnonymous ||
        !result.user.email
      ) {
        throw new Error(
          "A verified administrator account is required."
        );
      }

      console.log(
        "ADMIN SIGNED IN:",
        result.user.uid,
        result.user.email
      );

      setStatus("Verifying Admin access...");

      await requireAdmin();

      setStatus("Admin access verified. Redirecting...");

      window.setTimeout(
        redirectAfterLogin,
        300
      );
    } catch (error) {
      console.error(
        "[admin-login] sign-in failed:",
        error
      );

      setStatus(
        error?.message ||
        "Administrator sign-in failed.",
        true
      );
    } finally {
      loginBtn.disabled = false;
      resetBtn.disabled = false;
    }
  }


  loginBtn.addEventListener(
    "click",
    () => {
      void handleLogin();
    }
  );


  passwordEl.addEventListener(
    "keydown",
    (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        void handleLogin();
      }
    }
  );


  resetBtn.addEventListener(
    "click",
    async () => {
      const email =
        emailEl.value.trim();

      if (!email) {
        setStatus(
          "Enter your email first.",
          true
        );

        return;
      }

      try {
        setStatus(
          "Sending reset email..."
        );

        loginBtn.disabled = true;
        resetBtn.disabled = true;

        await sendPasswordResetEmail(
          auth,
          email
        );

        setStatus(
          "Password reset email sent. Check your inbox and spam folder."
        );
      } catch (error) {
        console.error(
          "[admin-login] reset failed:",
          error
        );

        setStatus(
          error?.message ||
          "Password reset could not be sent.",
          true
        );
      } finally {
        loginBtn.disabled = false;
        resetBtn.disabled = false;
      }
    }
  );


  onAuthStateChanged(
    auth,
    async (user) => {
      if (!user) {
        return;
      }

      /*
       * Never redirect an anonymous Firebase session
       * into the administrator workspace.
       */
      if (
        user.isAnonymous ||
        !user.email
      ) {
        console.log(
          "[admin-login] anonymous session detected; staying on login page"
        );

        try {
          await signOut(auth);
        } catch (error) {
          console.warn(
            "[admin-login] anonymous sign-out failed:",
            error
          );
        }

        return;
      }

      console.log("[admin-login] existing staff session:", user.uid, user.email);

      try {
        setStatus("Verifying Admin access...");
        await requireAdmin();
        setStatus("Admin access verified. Redirecting...");
        redirectAfterLogin();
      } catch (error) {
        console.error("[admin-login] existing session is not Admin:", error);
        setStatus("This account does not have active Admin access.", true);
      }
    }
  );
</script>
  <script src="/assets/js/password-toggle.js" defer></script>
</body>
</html>
