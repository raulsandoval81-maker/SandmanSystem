<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      background: #0b1220;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      background: #111827;
      padding: 28px;
      border-radius: 16px;
      width: 320px;
      box-shadow: 0 0 0 1px #1f2937;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 20px;
      text-align: center;
      color: #facc15;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #020617;
      color: #fff;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #facc15;
      color: #000;
      font-weight: 600;
      cursor: pointer;
    }

    .link-btn {
      margin-top: 10px;
      background: transparent;
      color: #facc15;
      border: 1px solid #374151;
    }

    .status {
      margin-top: 10px;
      font-size: 13px;
      text-align: center;
      color: #9ca3af;
      min-height: 18px;
    }

    .error {
      color: #f87171;
    }
  
    .remember-row {
      display: flex !important;
      align-items: flex-start !important;
      gap: 10px !important;
      margin: 4px 0 16px !important;
      color: #374151 !important;
      cursor: pointer !important;
    }

    .remember-row input {
      width: 18px !important;
      height: 18px !important;
      min-height: 18px !important;
      margin: 2px 0 0 !important;
      padding: 0 !important;
      flex: 0 0 18px !important;
      accent-color: #d4af37 !important;
      box-shadow: none !important;
    }

    .remember-row span {
      display: block !important;
      line-height: 1.35 !important;
    }

    .remember-row strong {
      display: block !important;
      color: #111827 !important;
      font-size: 0.9rem !important;
      font-weight: 900 !important;
    }

    .remember-row small {
      display: block !important;
      margin-top: 3px !important;
      color: #6b7280 !important;
      font-size: 0.78rem !important;
      font-weight: 500 !important;
      line-height: 1.4 !important;
    }

  </style>

  <link
    rel="stylesheet"
    href="/assets/css/portal-auth.css"
  />
</head>
<body>

  <main class="card">
    <p class="kicker">Administrators' Portal</p>
    <h1>Admin Access</h1>

    <p class="sub">
      Sign in with an approved administrator account.
    </p>

    <input id="email" type="email" placeholder="Email" value="coach@sandmancombat.com" />
    <input id="password" type="password" placeholder="Password" />

    <label class="remember-row" for="keepSignedIn">
      <input
        id="keepSignedIn"
        type="checkbox"
      />

      <span>
        <strong>Keep me signed in on this device</strong>

        <small>
          Leave unchecked on shared devices or when you regularly
          use more than one Sandman account.
        </small>
      </span>
    </label>



    <button id="loginBtn">Sign In</button>
    <button id="resetBtn" class="link-btn" type="button">Forgot Password?</button>

    <div id="status" class="status"></div>
    
    <a
      class="back-link"
      href="/management/auth/"
    >
      Open Management Access
    </a>

<a class="back-link" href="/login/">
      ← Choose a different role
    </a>
  </main>

<script type="module">
  import { auth } from "/assets/js/firebase-init.js";

  import {
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    onAuthStateChanged,
  browserLocalPersistence,
  browserSessionPersistence,
  setPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const keepSignedIn =
  document.getElementById("keepSignedIn");

async function applyAuthPersistence() {
  await setPersistence(
    auth,
    keepSignedIn?.checked
      ? browserLocalPersistence
      : browserSessionPersistence
  );
}



  const statusEl =
    document.getElementById("status");

  const emailEl =
    document.getElementById("email");

  const passwordEl =
    document.getElementById("password");

  const loginBtn =
    document.getElementById("loginBtn");

  const resetBtn =
    document.getElementById("resetBtn");

  const params =
    new URLSearchParams(window.location.search);

  const requestedReturnUrl =
    params.get("returnUrl") ||
    params.get("next") ||
    "";

  function getSafeReturnUrl() {
    if (
      requestedReturnUrl &&
      requestedReturnUrl.startsWith("/") &&
      !requestedReturnUrl.startsWith("//")
    ) {
      return requestedReturnUrl;
    }

    return "/admin/hub/";
  }

  function setStatus(
    message,
    isError = false
  ) {
    statusEl.textContent = message;

    statusEl.classList.toggle(
      "error",
      isError
    );
  }

  function redirectAfterLogin() {
    window.location.replace(
      getSafeReturnUrl()
    );
  }

  loginBtn.addEventListener(
    "click",
    async () => {
      const email =
        emailEl.value.trim();

      const password =
        passwordEl.value.trim();

      if (!email || !password) {
        setStatus(
          "Enter email and password",
          true
        );

        return;
      }

      try {
        setStatus("Signing in...");

        loginBtn.disabled = true;
        resetBtn.disabled = true;

        await applyAuthPersistence();

        const result =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

        console.log(
          "SIGNED IN:",
          result.user.uid,
          result.user.email
        );

        setStatus(
          "Success. Redirecting..."
        );

        setTimeout(
          redirectAfterLogin,
          300
        );
      } catch (error) {
        console.error(error);

        setStatus(
          error.message,
          true
        );
      } finally {
        loginBtn.disabled = false;
        resetBtn.disabled = false;
      }
    }
  );

  passwordEl.addEventListener(
    "keydown",
    (event) => {
      if (event.key === "Enter") {
        loginBtn.click();
      }
    }
  );

  resetBtn.addEventListener(
    "click",
    async () => {
      const email =
        emailEl.value.trim();

      if (!email) {
        setStatus(
          "Enter your email first",
          true
        );

        return;
      }

      try {
        setStatus(
          "Sending reset email..."
        );

        loginBtn.disabled = true;
        resetBtn.disabled = true;

        await sendPasswordResetEmail(
          auth,
          email
        );

        setStatus(
          "Password reset email sent. Check inbox and spam."
        );
      } catch (error) {
        console.error(error);

        setStatus(
          error.message,
          true
        );
      } finally {
        loginBtn.disabled = false;
        resetBtn.disabled = false;
      }
    }
  );

  onAuthStateChanged(
    auth,
    (user) => {
      if (!user) return;

      console.log(
        "Already signed in:",
        user.email
      );

      redirectAfterLogin();
    }
  );
</script>
</body>
</html>
