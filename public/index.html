<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Sandman Combat</title>

  <meta
    name="description"
    content="Combat Is the Classroom. Character Is the Curriculum."
  />

  <link rel="stylesheet" href="/assets/css/site.css" />
  <link rel="stylesheet" href="/assets/css/home.css" />
</head>

<body>

  <!-- Shared site navigation -->
  <div
    id="navigation"
    data-component="/components/navigation.html"
  ></div>

  <div class="site-hero-divider" aria-hidden="true"></div>

  <main>

    <!-- ENGLISH HERO -->

    <section
      class="hero-panel hero-panel--interactive"
      data-lang-block="en"
    >

      <img
        src="/assets/img/pages/home/hero-home-env2.png"
        alt="Sandman Academy homepage"
        class="home-hero__image"
      />

      <!-- Start Your Journey -->

      <a
        class="home-hotspot home-hotspot-journeys"
        href="/journeys.html"
        aria-label="Start Your Journey"
      ></a>

      <!-- Watch Our Story -->

      <a
        class="home-hotspot home-hotspot-origins"
        href="/origins.html"
        aria-label="Watch Our Story"
      ></a>

    </section>


    <!-- SPANISH HERO -->

    <section
      class="hero-panel hero-panel--interactive hidden-lang"
      data-lang-block="es"
    >

      <img
        src="/assets/img/pages/home/hero-home-esv2.png"
        alt="Página principal de Sandman Academy"
        class="home-hero__image"
      />

      <!-- Comienza Tu Camino -->

      <a
        class="home-hotspot home-hotspot-journeys"
        href="/journeys.html"
        aria-label="Comienza Tu Camino"
      ></a>

      <!-- Conoce Nuestra Historia -->

      <a
        class="home-hotspot home-hotspot-origins"
        href="/origins.html"
        aria-label="Conoce Nuestra Historia"
      ></a>

    </section>
<section class="home-flag-band">
  <img
    src="/assets/img/pages/home/home-flag-band.png"
    alt=""
  />
</section>
  </main>

  <!-- Shared footer -->

  <div
    id="footer"
    data-component="/components/footer.html"
  ></div>

  <script src="/assets/js/component-loader.js" defer></script>
  <script src="/assets/js/language.js" defer></script>
  <script src="/assets/js/theme.js" defer></script>
  <script src="/assets/js/navigation.js" defer></script>

</body>
</html>
