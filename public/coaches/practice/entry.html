<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Start Practice | Sandman Coach</title>
  <link rel="stylesheet" href="/coaches/_ui/coach-shell.css?v=3">
  <link rel="stylesheet" href="/coaches/practice/entry.css?v=20261010-1">
  <link rel="icon" href="data:,">
</head>

<body class="coach-shell-page" data-coach-page="Practice Entry" data-coach-area="practice">
<main class="practice-entry" data-coach-shell-content>

  <header class="entry-hero">
    <div>
      <p class="eyebrow">Practice Operations</p>
      <h1 id="entryTitle">Start Practice</h1>
      <p id="entryDescription">Open the practice and move straight to attendance.</p>
    </div>
    <a class="secondary-link" href="/coaches/practice/">← Practice Operations</a>
  </header>

  <section id="entryStatus" class="entry-notice" role="status" aria-live="polite">
    Verifying Coach access…
  </section>

  <section id="entryPanel" class="entry-card" hidden>
    <div class="entry-grid">
      <label>
        Practice Mode
        <select id="entryMode">
          <option value="planned">Planned Practice</option>
          <option value="quick-start">Quick Start</option>
          <option value="after-the-fact">Record Past Practice</option>
        </select>
      </label>

      <label>
        Practice Date
        <input id="sessionDateKey" type="date" required>
      </label>

      <label>
        Coach
        <input id="coachOnHand" type="text" readonly aria-readonly="true">
      </label>

      <label id="roomField" hidden>
        Session
        <select id="roomSelect" required></select>
      </label>

      <label id="programField" hidden>
        Program
        <select id="programSelect">
          <option value="">Select Program</option>
        </select>
      </label>

      <label id="practiceKeyField" class="entry-wide" hidden>
        Practice Key
        <input
          id="practiceKey"
          type="text"
          maxlength="120"
          placeholder="Example: saturday-rush-1"
        >
      </label>
    </div>

    <div class="entry-actions">
      <button id="createPractice" type="button">Continue to Attendance</button>
      <a href="/coaches/practice/">Cancel</a>
    </div>
  </section>

</main>

<script src="/coaches/_ui/coach-shell.js?v=3"></script>
<script type="module" src="/coaches/practice/entry.js?v=20261010-1"></script>
</body>
</html>
