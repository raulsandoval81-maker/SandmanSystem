<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Start Practice | Sandman Coach</title>
  <link rel="stylesheet" href="/coaches/_ui/coach-shell.css?v=3">
  <link rel="stylesheet" href="/coaches/practice/entry.css?v=20261010-1">
  <link rel="icon" href="data:,">
</head>

<body class="coach-shell-page" data-coach-page="Practice Entry" data-coach-area="practice">
<main class="practice-entry" data-coach-shell-content>

  <header class="entry-hero">
    <div>
      <p class="eyebrow">Practice Operations</p>
      <h1 id="entryTitle">Start Practice</h1>
      <p id="entryDescription">Confirm the practice date and Coach, then continue to Session Builder.</p>
    </div>
    <a class="secondary-link" href="/coaches/practice/">← Practice Operations</a>
  </header>

  <section id="entryStatus" class="entry-notice" role="status" aria-live="polite">
    Verifying Coach access…
  </section>

  <section id="entryPanel" class="entry-card" hidden>
    <div class="entry-grid">
<label>
        Practice Date
        <input id="sessionDateKey" type="date" required>
      </label>

      <label>
        Coach
        <input id="coachOnHand" type="text" readonly aria-readonly="true">
      </label>
    </div>

    <div class="entry-actions">
      <button id="createPractice" type="button">Continue to Session Builder</button>
      <a href="/coaches/practice/">Cancel</a>
    </div>
  </section>

</main>

<script src="/coaches/_ui/coach-shell.js?v=3"></script>
<script type="module" src="/coaches/practice/entry.js?v=20261011-1"></script>
</body>
</html>
