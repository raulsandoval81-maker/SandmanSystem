<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Practice Entry | Sandman Coach</title>
  <link rel="stylesheet" href="/coaches/_ui/coach-shell.css?v=3">
  <link rel="stylesheet" href="/coaches/practice/entry.css?v=20261003-1">
  <link rel="icon" href="data:,">
</head>

<body class="coach-shell-page" data-coach-page="Practice Entry" data-coach-area="practice">
<main class="practice-entry" data-coach-shell-content>

  <header class="entry-hero">
    <div>
      <p class="eyebrow">Practice Operations</p>
      <h1 id="entryTitle">Practice Entry</h1>
      <p id="entryDescription">
        Establish the canonical practice record before attendance.
      </p>
    </div>
    <a class="secondary-link" href="/coaches/practice/">← Practice Operations</a>
  </header>

  <section id="entryStatus" class="entry-notice" role="status" aria-live="polite">
    Verifying Coach access…
  </section>

  <section id="entryPanel" class="entry-card" hidden>
    <div class="entry-grid">
      <label>
        Entry Mode
        <select id="entryMode">
          <option value="planned">Planned Practice</option>
          <option value="quick-start">Quick Start Practice</option>
          <option value="after-the-fact">Record Past Practice</option>
        </select>
      </label>

      <label>
        Practice Date
        <input id="sessionDateKey" type="date" required>
      </label>

      <label>
        Room
        <select id="roomSelect" required></select>
      </label>

      <label>
        Program
        <select id="programSelect" required>
          <option value="">Select Program</option>
        </select>
      </label>

      <label id="practiceKeyField" class="entry-wide" hidden>
        Practice Key
        <input
          id="practiceKey"
          type="text"
          maxlength="120"
          placeholder="Example: saturday-rush-1"
        >
        <small>
          Required for after-the-fact entry so the same historical practice can be safely recovered without duplication.
        </small>
      </label>
    </div>

    <div class="entry-authority">
      <strong>What this does</strong>
      <p>
        Creates or recovers one canonical practice record. It does not finalize attendance,
        award XP, or close the practice.
      </p>
    </div>

    <div class="entry-actions">
      <button id="createPractice" type="button">Create / Recover Practice</button>
      <a href="/coaches/practice/">Cancel</a>
    </div>
  </section>

</main>

<script src="/coaches/_ui/coach-shell.js?v=3"></script>
<script type="module" src="/coaches/practice/entry.js?v=20261009-2"></script>
</body>
</html>
