<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Sandman Coaches Hub</title>

  <meta
    name="description"
    content="Sandman Coaches Hub—mission, standards, and entry into the Coach System."
  >

  <link rel="stylesheet" href="./hub.css">

  <script src="./hub.js" defer></script>
</head>

<body>

  <header class="coach-header">
    <div class="coach-header__inner">

      <div class="coach-header__left">
        <button
          id="langEN"
          class="toggle-pill active"
          type="button"
          aria-label="Use English"
          aria-pressed="true"
        >
          EN
        </button>

        <button
          id="langES"
          class="toggle-pill"
          type="button"
          aria-label="Usar español"
          aria-pressed="false"
        >
          ES
        </button>
      </div>

      <div class="coach-header__center">
        <a
          class="coach-brand"
          href="/coaches/hub/index.html"
          aria-label="Sandman Coaches Hub"
        >
          <span
            data-en="Sandman Combat System™"
            data-es="Sandman Combat System™"
          >
            Sandman Combat System™
          </span>
        </a>

        <div
          class="coach-sub"
          data-en="Coaches Hub"
          data-es="Centro de Entrenadores"
        >
          Coaches Hub
        </div>
      </div>

      <div class="coach-header__right">
        <button
          id="themeToggle"
          class="toggle-pill"
          type="button"
          aria-label="Switch to light theme"
          title="Change theme"
        >
          ☀️
        </button>
      </div>

    </div>

    <div class="coach-header__line"></div>
  </header>

  <main class="coach-hub-main">

    <picture class="coach-hub-art">
      <img
        id="coachHubImage"
        src="/assets/images/sandman-coaches-hub-en.png"
        alt="Sandman Coaches Hub mission, creed, code, goal, and standards"
        loading="eager"
      >
    </picture>

    <a
      class="enter-coach-system"
      href="/coaches/index.html"
      data-en="Enter Coach System"
      data-es="Entrar al Sistema de Entrenadores"
    >
      Enter Coach System
    </a>

  </main>

</body>
</html>
