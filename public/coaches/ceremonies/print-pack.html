<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Ceremony Print Pack</title>

  <style>
    body{
      font-family:Arial, Helvetica, sans-serif;
      padding:24px;
      color:#111;
    }

    h1{
      margin:0 0 6px;
      font-size:28px;
    }

    .meta{
      margin:0 0 18px;
      color:#444;
      font-size:14px;
    }

    .section{
      margin-top:22px;
    }

    .row{
      display:grid;
      grid-template-columns:2fr 1fr 1fr 1fr;
      gap:10px;
      padding:8px 0;
      border-bottom:1px solid #ddd;
      font-size:14px;
    }

    .head{
      font-weight:700;
      border-bottom:2px solid #111;
    }

    .empty{
      color:#777;
      font-style:italic;
      margin-top:12px;
    }

    .check{
      width:18px;
      height:18px;
      border:1px solid #111;
      display:inline-block;
    }

    @media print{
      body{
        padding:0.35in;
      }
    }
  </style>
</head>

<body>

<h1>Ceremony Print Pack</h1>
<p class="meta" id="meta">Loading...</p>

<section class="section">
  <h2>Presentation Roster</h2>

  <div class="row head">
    <div>Athlete</div>
    <div>Tier / Rank</div>
    <div>Certificate</div>
    <div>Belt / Award</div>
  </div>

  <div id="list"></div>
</section>

<script>
  const data = JSON.parse(localStorage.getItem("ceremony_roster") || "[]");

  document.getElementById("meta").textContent =
    `Athletes: ${data.length} • Generated: ${new Date().toLocaleDateString()}`;

  const list = document.getElementById("list");

  if (!data.length) {
    list.innerHTML = `<div class="empty">No ceremony roster found. Export roster from Ceremonies Hub first.</div>`;
  } else {
    list.innerHTML = data.map(a => `
      <div class="row">
        <div>${a.name || "—"}</div>
        <div>${a.tier || "—"}</div>
        <div><span class="check"></span></div>
        <div><span class="check"></span></div>
      </div>
    `).join("");

    setTimeout(() => window.print(), 300);
  }
</script>

</body>
</html>
