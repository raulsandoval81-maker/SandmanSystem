<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>

  <title>Ceremony History</title>

  <style>
    :root{
      color-scheme:dark;
      --bg:#06080d;
      --panel:#0f141b;
      --line:#334155;
      --gold:#ffdd48;
      --text:#f8fafc;
      --muted:#cbd5e1;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }

    .wrap{
      max-width:1100px;
      margin:auto;
      padding:28px 18px 60px;
    }

    h1{
      margin:0 0 8px;
      color:var(--gold);
    }

    p{
      color:var(--muted);
      margin-bottom:24px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:var(--panel);
      border:1px solid var(--line);
    }

    th,td{
      padding:12px;
      border-bottom:1px solid var(--line);
      text-align:left;
    }

    th{
      color:var(--gold);
      font-size:.8rem;
      text-transform:uppercase;
      letter-spacing:.05em;
    }

    tr:last-child td{
      border-bottom:none;
    }

    .empty{
      color:var(--muted);
      padding:24px;
      text-align:center;
    }
  </style>
</head>

<body>

<main class="wrap">

<h1>Ceremony History</h1>

<p>
Historical record of promotions, certificates, and ceremony presentations.
</p>

<table>

<thead>
<tr>
<th>Date</th>
<th>Athlete</th>
<th>Track</th>
<th>Rank</th>
<th>Ceremony</th>
</tr>
</thead>

<tbody id="list">
<tr>
<td colspan="5" class="empty">
Loading...
</td>
</tr>
</tbody>

</table>

</main>

<script>
async function load(){

if(!window.CoachCeremonies){
document.getElementById("list").innerHTML=
'<tr><td colspan="5" class="empty">Ceremony service unavailable.</td></tr>';
return;
}

const res=await window.CoachCeremonies.listRecent(100);

if(!res.length){
document.getElementById("list").innerHTML=
'<tr><td colspan="5" class="empty">No ceremonies recorded.</td></tr>';
return;
}

document.getElementById("list").innerHTML=res.map(r=>`

<tr>

<td>${new Date(r.ceremonyDate).toLocaleDateString()}</td>

<td>${r.athleteName||"—"}</td>

<td>${r.trackName||r.track||"—"}</td>

<td>${r.rankName||"—"}</td>

<td>${r.ceremonyName||"Quarterly Ceremony"}</td>

</tr>

`).join("");

}

load();


</script>
<script src="/coaches/ceremonies/ceremonies.service.js"></script>
</body>
</html>
