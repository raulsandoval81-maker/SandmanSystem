<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Athlete Check-In | Sandman Combat</title>

  <link rel="stylesheet" href="/coaches/attendance/attendance.css" />
</head>

<body class="attendance-checkin">
  <main class="attendance-page">
    <header class="attendance-header">
      <h1>Athlete Check-In</h1>
      <p>Load the active practice and record attendance as athletes check in, then submit it for Coach review.</p>
    </header>

    <section class="attendance-card">
    <div class="session-date">
      <span class="label">Today's Date</span>
      <span id="sessionDateLabel" class="value">—</span>
     </div>

   <label>
     Active Practice
     <input id="practiceIdentity" value="No active practice loaded" readonly aria-readonly="true" />
</label>


      <label>
        Coach Name
        <input id="coachName" type="text" value="Coach Sandoval" />
      </label>

      <label>
        Notes / Discipline
        <textarea id="practiceNotes" placeholder="Optional notes..."></textarea>
      </label>

      <button id="startSession" type="button">
        Load Active Practice
      </button>

      <p id="sessionStatus" class="muted">Ready.</p>
    </section>

    <section class="attendance-card">
      <h2>Attendance Roster</h2>

      <input
        id="searchAthlete"
        type="text"
        placeholder="Search athlete name..."
      />

      <div id="athleteList"></div>
    </section>

    <section class="attendance-card">
      <h2>Checked In Today</h2>
      <p id="checkedCount" class="muted">0 checked in</p>
      <div id="checkedList"></div>

      <button id="finalizeSession" type="button">
        Submit for Coach Review
      </button>
    </section>
  </main>

  <script type="module" src="/coaches/attendance/session.js"></script>
</body>
</html>
