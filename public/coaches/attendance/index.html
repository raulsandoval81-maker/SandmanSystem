<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Coach · Attendance</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>

  <link rel="stylesheet" href="/coaches/_ui/coach-shell.css?v=1"/>
  <link rel="stylesheet" href="/coaches/attendance/attendance.css"/>
  <link rel="icon" href="data:,">
</head>

<body class="coach-shell-page" data-coach-page="Attendance" data-coach-area="practice" data-coach-context="attendance">

<main class="attendance-page attendance-review" data-coach-shell-content>

  <header class="attendance-header">
    <div>
      <h1>Review &amp; Finalize Attendance</h1>
      <p class="muted">
        Verify athlete check-ins, correct attendance if needed, then finalize the practice.
      </p>
    </div>

    <nav class="top-nav">
      <a class="pill" href="/coaches/attendance/session.html">Athlete Check-In</a>
      <a class="pill" href="/coaches/roster/">Roster</a>
    </nav>
  </header>

  <section class="card setup-card">

    <label>
      Loaded program
      <input id="practiceType" value="—" readonly aria-readonly="true"/>
    </label>

  </section>

  <section class="toolbar-card">

    <div class="action-row">
      <button id="selectAll" class="pill" type="button" disabled>
        Select All
      </button>

      <button id="clearAll" class="pill" type="button" disabled>
        Clear All
      </button>

      <button id="saveAttendance"
              class="pill primary"
              type="button" disabled>
        Finalize Attendance
      </button>
    </div>

    <div class="save-meta">
      <strong id="presentCount">0 selected</strong>
      <p id="saveStatus" class="muted"></p>
    </div>

  </section>

  <section class="card roster-card">

    <div class="section-head">
      <h2>Verified Participants</h2>
      <span id="countMeta" class="muted"></span>
    </div>

    <div id="athleteList" class="athlete-list">
      <p class="muted">
        Loading attendance...
      </p>
    </div>

  </section>

</main>
<script src="/coaches/_ui/coach-shell.js?v=1"></script>
<script type="module" src="/coaches/attendance/attendance.js?v=handoff2"></script>

</body>
</html>
