<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Coach · Attendance</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>

  <link rel="stylesheet" href="/assets/css/site.css"/>
  <link rel="stylesheet" href="/coaches/attendance/attendance.css"/>
  <link rel="icon" href="data:,">
</head>

<body>

<main class="wrap">

  <header class="attendance-header">
    <div>
      <h1>Coach Attendance</h1>
      <p class="muted">
        Review today's session and finalize attendance.
      </p>
    </div>

    <nav class="top-nav">
      <a class="pill" href="/coaches/attendance/session.html">Session Check-In</a>
      <a class="pill" href="/coaches/roster/">Roster</a>
    </nav>
  </header>

  <section class="card setup-card">

    <label>
      Program
      <select id="practiceType">
        <option value="z2h">Zero2Hero</option>
        <option value="p2l" selected>Path2Legend</option>
        <option value="r2g">Road2Greatness</option>
        <option value="q2m">Quest2Mastery</option>
      </select>
    </label>

  </section>

  <section class="toolbar-card">

    <div class="action-row">
      <button id="selectAll" class="pill" type="button">
        Select All
      </button>

      <button id="clearAll" class="pill" type="button">
        Clear All
      </button>

      <button id="saveAttendance"
              class="pill primary"
              type="button">
        Finalize Attendance
      </button>
    </div>

    <div class="save-meta">
      <strong id="presentCount">0 selected</strong>
      <p id="saveStatus" class="muted"></p>
    </div>

  </section>

  <section class="card roster-card">

    <div class="section-head">
      <h2>Today's Athletes</h2>
      <span id="countMeta" class="muted"></span>
    </div>

    <div id="athleteList" class="athlete-list">
      <p class="muted">
        Loading attendance...
      </p>
    </div>

  </section>

</main>
<script type="module" src="/coaches/attendance/attendance.js?v=handoff2"></script>

</body>
</html>
