<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Management Notice | Sandman Coach System</title>

  <link rel="stylesheet" href="./management-notice.css">
</head>

<body>
  <header class="notice-header">
    <div>
      <p class="eyebrow">Coach System</p>
      <h1>Management Notice</h1>
      <p class="subtitle">
        Updates, requests, and follow-up from academy management.
      </p>
    </div>

    <a
      class="back-link"
      href="/coaches/command-center/"
    >
      ← Command Center
    </a>
  </header>

  <main class="notice-main">
    <section class="notice-panel">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">Internal Communication</p>
          <h2>Management Messages</h2>
        </div>

        <span class="count-badge">0</span>
      </div>

      <div class="empty-state">
        <h3>No management notices</h3>
        <p>
          Messages and follow-up sent to you by academy
          management will appear here.
        </p>
      </div>
    </section>
  </main>

  <script
    type="module"
    src="./management-notice.js"
  ></script>
</body>
</html>
