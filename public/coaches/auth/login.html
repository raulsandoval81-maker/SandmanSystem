<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Coach Login | Sandman</title>

  <meta
    name="robots"
    content="noindex,nofollow"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(
          circle at top,
          #1f2937 0,
          #0b1220 45%,
          #020617 100%
        );
      color: #fff;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .card {
      width: min(380px, 100%);
      padding: 28px;
      border: 1px solid #1f2937;
      border-radius: 18px;
      background: #111827;
      box-shadow:
        0 22px 50px rgba(0, 0, 0, 0.34);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #facc15;
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-align: center;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 8px;
      color: #fff;
      font-size: 1.55rem;
      text-align: center;
    }

    .intro {
      margin: 0 0 22px;
      color: #9ca3af;
      font-size: 0.92rem;
      line-height: 1.5;
      text-align: center;
    }

    label {
      display: block;
      margin: 0 0 6px;
      color: #e5e7eb;
      font-size: 0.85rem;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 48px;
      margin-bottom: 14px;
      padding: 11px 12px;
      border: 1px solid #374151;
      border-radius: 10px;
      background: #020617;
      color: #fff;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: #facc15;
      box-shadow:
        0 0 0 2px rgba(250, 204, 21, 0.17);
    }

    button {
      width: 100%;
      min-height: 48px;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: #facc15;
      color: #000;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    .link-btn {
      margin-top: 10px;
      border: 1px solid #374151;
      background: transparent;
      color: #facc15;
    }

    .back-link {
      display: block;
      margin-top: 18px;
      color: #9ca3af;
      font-size: 0.88rem;
      text-align: center;
      text-decoration: none;
    }

    .back-link:hover,
    .back-link:focus-visible {
      color: #facc15;
    }

    .status {
      min-height: 20px;
      margin-top: 14px;
      color: #9ca3af;
      font-size: 0.84rem;
      line-height: 1.45;
      text-align: center;
    }

    .status.error {
      color: #f87171;
    }
  </style>

  <link
    rel="stylesheet"
    href="/assets/css/portal-auth.css"
  />
</head>

<body>
  <main class="card">

    <p class="kicker">Coaches' Portal</p>

    <h1>Coach Access</h1>

    <p class="sub">
      Sign in with an approved Coach or Admin account.
    </p>

    <label for="email">
      Email
    </label>

    <input
      id="email"
      type="email"
      inputmode="email"
      autocomplete="username"
      placeholder="coach@example.com"
    />

    <label for="password">
      Password
    </label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="Password"
    />

    <button
      id="loginBtn"
      type="button"
    >
      Sign In as Coach
    </button>

    <button
      id="resetBtn"
      class="link-btn"
      type="button"
    >
      Forgot Password?
    </button>

    <div
      id="status"
      class="status"
      aria-live="polite"
    ></div>


    <a
      class="back-link"
      href="/management/auth/"
    >
      Open Management Access
    </a>

    <a
      class="back-link"
      href="/login/"
    >
      ← Choose a different role
    </a>

  </main>

  <script type="module">
    import {
      auth
    } from "/assets/js/firebase-init.js";

    import {
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const statusEl =
      document.getElementById("status");

    const emailEl =
      document.getElementById("email");

    const passwordEl =
      document.getElementById("password");

    const loginBtn =
      document.getElementById("loginBtn");

    const resetBtn =
      document.getElementById("resetBtn");

    const params =
      new URLSearchParams(
        window.location.search
      );

    const requestedReturnUrl =
      params.get("returnUrl") ||
      params.get("next") ||
      "";

    let authCheckRunning = false;

    function getSafeReturnUrl() {
      if (
        requestedReturnUrl &&
        requestedReturnUrl.startsWith("/") &&
        !requestedReturnUrl.startsWith("//") &&
        (
          requestedReturnUrl.startsWith("/coaches/") ||
          requestedReturnUrl.startsWith("/communications/coach/")
        )
      ) {
        return requestedReturnUrl;
      }

      return "/coaches/hub/";
    }

    function setStatus(
      message,
      isError = false
    ) {
      statusEl.textContent =
        message || "";

      statusEl.classList.toggle(
        "error",
        isError
      );
    }

    function setBusy(isBusy) {
      loginBtn.disabled = isBusy;
      resetBtn.disabled = isBusy;
      emailEl.disabled = isBusy;
      passwordEl.disabled = isBusy;
    }

    async function hasCoachAccess(user) {
      const token =
        await user.getIdTokenResult(true);

      const claims =
        token.claims || {};

      return (
        claims.coach === true ||
        claims.admin === true
      );
    }

    async function finishCoachLogin(user) {
      if (!user || authCheckRunning) {
        return;
      }

      authCheckRunning = true;
      setBusy(true);

      try {
        setStatus(
          "Checking Coach access..."
        );

        const authorized =
          await hasCoachAccess(user);

        if (!authorized) {
          await signOut(auth);

          setStatus(
            "This account does not have Coach access.",
            true
          );

          return;
        }

        setStatus(
          "Access approved. Opening Coach Hub..."
        );

        window.location.replace(
          getSafeReturnUrl()
        );
      } catch (error) {
        console.error(
          "[coach-login] access check failed:",
          error
        );

        setStatus(
          "Unable to verify Coach access.",
          true
        );
      } finally {
        authCheckRunning = false;
        setBusy(false);
      }
    }

    loginBtn.addEventListener(
      "click",
      async () => {
        const email =
          emailEl.value
            .trim()
            .toLowerCase();

        const password =
          passwordEl.value;

        if (!email || !password) {
          setStatus(
            "Enter email and password.",
            true
          );

          return;
        }

        try {
          setBusy(true);

          setStatus(
            "Signing in..."
          );

          const result =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );

          await finishCoachLogin(
            result.user
          );
        } catch (error) {
          console.error(
            "[coach-login] sign-in failed:",
            error
          );

          setStatus(
            "Sign-in failed. Check your email and password.",
            true
          );

          setBusy(false);
        }
      }
    );

    passwordEl.addEventListener(
      "keydown",
      (event) => {
        if (event.key === "Enter") {
          loginBtn.click();
        }
      }
    );

    resetBtn.addEventListener(
      "click",
      async () => {
        const email =
          emailEl.value
            .trim()
            .toLowerCase();

        if (!email) {
          setStatus(
            "Enter your email first.",
            true
          );

          return;
        }

        try {
          setBusy(true);

          setStatus(
            "Sending password reset email..."
          );

          await sendPasswordResetEmail(
            auth,
            email
          );

          setStatus(
            "Password reset email sent. Check your inbox and spam folder."
          );
        } catch (error) {
          console.error(
            "[coach-login] reset failed:",
            error
          );

          setStatus(
            "Unable to send password reset email.",
            true
          );
        } finally {
          setBusy(false);
        }
      }
    );

    onAuthStateChanged(
      auth,
      async (user) => {
        if (!user) {
          return;
        }

        emailEl.value =
          user.email || "";

        await finishCoachLogin(user);
      }
    );
  </script>
</body>
</html>
