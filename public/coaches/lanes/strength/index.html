<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Coach • Strength Review</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/coaches/_ui/coach-shell.css?v=5">

  <style>
    *{box-sizing:border-box}

    .lane-hero,
    .lane-panel{
      margin-bottom:16px;
      padding:18px;
      border:1px solid var(--coach-shell-line);
      border-radius:16px;
      background:var(--coach-shell-panel);
      color:var(--coach-shell-text);
      box-shadow:0 10px 24px var(--coach-shell-shadow);
    }

    .lane-panel{padding:16px}

    .title{
      font-weight:900;
      font-size:1.1rem;
      letter-spacing:.5px;
      color:var(--coach-shell-gold);
    }

    .sub{
      color:var(--coach-shell-muted);
      font-size:.85rem;
      opacity:1;
    }

    main{
      width:100%;
      max-width:none;
      margin:0;
      padding:0;
    }

    .empty{
      opacity:.6;
      padding:20px;
      border:1px dashed var(--coach-shell-line);
      border-radius:12px;
      text-align:center;
    }

    .footer{
      margin-top:40px;
      padding-top:20px;
      border-top:1px solid var(--coach-shell-line);
      font-size:.8rem;
      opacity:.6;
      text-align:center;
    }

    @media (max-width:600px){
      .header-inner{flex-direction:column;align-items:flex-start}
    }
  </style>
</head>
<body class="coach-shell-page" data-coach-page="Strength Review" data-coach-area="today">
  <main data-coach-shell-content>
  <section class="lane-hero">
    <div class="title">Strength Lane Review</div>
    <div class="sub">All Segments • Coach View • Status + XP Award</div>
  </section>
  <section class="lane-panel">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;">
      <div>
        <h2 style="margin:0 0 6px;">Active Strength Phase</h2>
        <div id="strengthPhaseSummary" class="sub">Confirming Coach authority…</div>
      </div>
      <div style="display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;">
        <label style="display:grid;gap:5px;font-weight:800;font-size:.82rem;">
          <span>Phase</span>
          <select id="strengthPhaseSelect" disabled style="min-height:42px;padding:0 10px;border:1px solid var(--coach-shell-line);border-radius:9px;background:var(--coach-shell-page-bg);color:var(--coach-shell-text);">
            <option value="preseason">Preseason</option>
            <option value="inseason">In-Season</option>
            <option value="postseason">Postseason</option>
          </select>
        </label>
        <button id="strengthPhaseSave" class="btn" type="button" disabled>Save Phase</button>
      </div>
    </div>
    <div id="strengthPhaseStatus" class="sub" role="status" aria-live="polite" style="margin-top:9px;"></div>
  </section>
  <section style="margin-bottom:16px;">
    <h2 style="margin:0 0 10px;">Remote Work Requests</h2>
    <div id="remote-requests-container">
      <div class="empty">Loading remote requests…</div>
    </div>
  </section>

  <div id="submissions-container">
    <div class="empty">Loading Strength submissions…</div>
  </div>

  <div class="footer">
    Coach is final authority • No auto-awards
  </div>
</main>
<script type="module" src="/coaches/lanes/strength/phase-control.js"></script>
  <script src="/coaches/_ui/coach-shell.js?v=5"></script>
  <script type="module" src="/coaches/lanes/strength/review.js?v=coach-shell-2"></script>
</body>
</html>
