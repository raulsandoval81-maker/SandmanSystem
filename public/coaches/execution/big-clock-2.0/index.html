<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width,initial-scale=1" />

  <title>Sandman Big Screen</title>

  <link rel="stylesheet"
        href="/coaches/execution/big-clock-2.0/big-clock-2.0.css?v=20261008-11" />
</head>

<body>

<div id="readyScreen" class="ready-screen">

  <div class="ready-inner">


<!-- BRAND -->

<div class="ready-brand">
  SANDMAN COMBAT
</div>

<div class="ready-standards-title">
  RULES OF LIFE
</div>

<div class="ready-fear">
  <div>FOCUS</div>
  <div>•</div>
  <div>EFFORT</div>
  <div>•</div>
  <div>ATTITUDE</div>
  <div>•</div>
  <div>RESPECT</div>
</div>

<div class="ready-status">
  Session Ready
</div>

<div id="clockMatLane" class="ready-status">
  Mat 1
</div>

<div id="fastPassTimeSetup" class="fast-pass-time hidden">
  <div class="fast-pass-label">Choose Practice Time</div>
  <div class="fast-pass-times" role="group" aria-label="Practice duration">
    <button type="button" data-fast-minutes="30">30 min</button>
    <button type="button" data-fast-minutes="45">45 min</button>
    <button type="button" data-fast-minutes="60" class="active">60 min</button>
    <button type="button" data-fast-minutes="90">90 min</button>
  </div>
</div>

<button
  class="ready-pill primary ready-start"
  type="button"
  onclick="startPracticeNow()">

  Begin Practice

</button>



  </div>

</div>

<div id="liveCompanionTools" class="live-companion-tools hidden">
  <button id="liveCompanionToggle" class="live-companion-toggle" type="button"
          aria-expanded="false" aria-controls="liveCompanionPanel"
          onclick="toggleLiveCompanionQr()">Coach Field Log · QR</button>
  <div id="liveCompanionPanel" class="live-companion-panel hidden" role="region"
       aria-label="Coach Field Log QR code">
    <strong>Open Coach Field Log</strong>
    <p>Scan with your phone to access the practice tools.</p>
    <img id="liveCompanionQr" alt="QR code to open Coach Field Log" />
    <button type="button" class="live-companion-close" onclick="toggleLiveCompanionQr()">Close</button>
  </div>
</div>

<main class="big-screen">

  <div id="status"
       class="status stopped">


STOPPED


  </div>

  <div id="block"
       class="block">


No active block


  </div>

  <div id="clock"
       class="clock">


00:00


  </div>

  <div id="action"
       class="action">
  </div>

  <section id="drillPanel" class="drill-panel hidden" aria-live="polite">
    <div class="drill-panel-topline">
      <span id="drillLabel" class="drill-label">Current drill</span>
      <span id="drillCueLevel" class="drill-cue-level"></span>
    </div>
    <div id="drillName" class="drill-name"></div>
    <div id="drillGoal" class="drill-goal"></div>
    <div id="drillFlow" class="drill-flow"></div>
  </section>

  <div id="next"
       class="next">


Next: —


  </div>

  <div id="cues"
       class="cues">
  </div>

</main>

<div class="brand">
  Sandman Combat
</div>

<div class="session-end-actions hidden"
     id="sessionEndActions">

<a id="sessionEndPrimaryAction" class="return-btn"
  href="/coaches/execution/coach-companion/">


Return to Coach Field Log


  </a>

</div>

<script
  type="module"
  src="/coaches/execution/big-clock-2.0/big-clock-2.0.js?v=20261008-19">
</script>

</body>
</html>
