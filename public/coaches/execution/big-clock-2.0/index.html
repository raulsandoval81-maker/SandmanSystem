<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sandman Big Clock 2.0</title>
  <link rel="stylesheet" href="/coaches/execution/big-clock-2.0/big-clock-2.0.css?v=20261025-1">
</head>
<body>
  <div id="ready-overlay" class="ready-overlay">
    <div class="ready-card">
      <p class="eyebrow">Sandman Combat · Big Clock 2.0</p>
      <h1>One room. One synchronized practice.</h1>
      <div id="fast-duration" class="fast-duration hidden" aria-label="Fast practice duration">
        <p>Choose practice time</p>
        <div>
          <button type="button" data-fast-minutes="30">30 min</button>
          <button type="button" data-fast-minutes="45">45 min</button>
          <button type="button" data-fast-minutes="60">60 min</button>
          <button type="button" data-fast-minutes="90">90 min</button>
        </div>
      </div>
      <button id="begin-practice" class="primary" type="button">Begin Practice</button>
    </div>
  </div>

  <main class="room-display">
    <header>
      <div>
        <p class="eyebrow">Current block</p>
        <h1 id="block-title">Ready to begin</h1>
      </div>
      <button id="fullscreen" class="quiet" type="button">Fullscreen</button>
    </header>

    <section class="timer-stage" aria-live="polite">
      <div id="clock" class="clock">00:00</div>
      <div id="interval-phase" class="phase">Continuous block</div>
      <h2 id="current-activity">No activity assigned</h2>
      <p id="upcoming-activity" class="upcoming">Final activity</p>
    </section>

    <section class="progress-section" aria-label="Practice progress">
      <div class="progress-track"><div id="practice-progress" class="progress-fill"></div></div>
      <span id="practice-progress-text">0% complete</span>
    </section>

    <section>
      <p class="eyebrow">Group instructions</p>
      <div id="group-instructions" class="groups"></div>
    </section>

    <nav class="controls" aria-label="Practice controls">
      <button id="control-start" type="button">Start</button>
      <button id="control-pause" type="button">Pause</button>
      <button id="control-resume" type="button">Resume</button>
      <button id="control-back" type="button">Previous</button>
      <button id="control-repeat" type="button">Repeat</button>
      <button id="control-skip" type="button">Skip</button>
      <button id="control-reset" class="danger" type="button">Reset</button>
    </nav>
    <p id="sync-status" class="sync-status" role="status">Connecting…</p>
    <a id="post-practice" class="post-practice hidden" href="#">Post Practice Input</a>
  </main>

  <script type="module" src="/coaches/execution/big-clock-2.0/big-clock-2.0.js?v=20261025-1"></script>
</body>
</html>
