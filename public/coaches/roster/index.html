<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Coach · Roster</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>

  <link rel="stylesheet" href="/assets/css/site.css"/>
  <link rel="stylesheet" href="/coaches/roster/roster.css"/>
  <link rel="stylesheet" href="/assets/css/belts.css"/>
  <link rel="icon" href="data:,">
</head>

<body>
<main class="wrap">

  <!-- PAGE HEADER -->
  <header class="roster-header">
    <div>
      <h1>Team Roster</h1>
      <p class="muted">Coach command center · Athletes</p>
    </div>

    <nav class="top-nav">
      <a class="pill" href="/coaches/attendance/">Attendance</a>
      <button class="pill" type="button" id="toggleArchiveView">Archived</button>
      <a class="pill" href="/coaches/index.html">← Coach Index</a>
    </nav>
  </header>

  <!-- FILTERS -->
  <section class="controls-row card-lite">

  <label>
    Journey
    <select id="journeyFilter">
      <option value="all">All Journeys</option>
      <option value="z2h">Z2H · Zero2Hero</option>
      <option value="p2l">P2L · Path2Legend</option>
      <option value="r2g">R2G · Road2Greatness</option>
      <option value="q2m">Q2M · Quest2Mastery</option>
    </select>
  </label>

  <label>
    Discipline
    <select id="disciplineFilter">
      <option value="all">All Disciplines</option>
      <option value="wrestling">Wrestling</option>
      <option value="boxing">Boxing</option>
      <option value="mma">MMA</option>
    </select>
  </label>

  <span id="countMeta" class="muted count-meta"></span>

</section>

  <!-- ROSTER TABLE -->
  <section class="card roster-card">

    <table class="roster-table">

      <thead>
        <tr>
          <th>Athlete</th>
          <th>Tier / Rank</th>
          <th>XP</th>
          <th>Last Seen</th>
        </tr>
      </thead>

      <tbody id="rows">
        <tr>
          <td colspan="4" class="muted">
            Loading…
          </td>
        </tr>
      </tbody>

    </table>

  </section>

</main>

<script type="module" src="/coaches/roster/roster.js"></script>
</body>
</html>
