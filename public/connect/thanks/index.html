<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>
    Thank You | Sandman Academy of Combat & Fitness
  </title>

  <meta
    name="description"
    content="Thank you for contacting Sandman Academy of Combat & Fitness."
  />

  <link
    rel="stylesheet"
    href="/assets/css/site.css"
  />

  <style>
    :root{
      --bg:#090909;
      --panel:#141414;
      --gold:#facc15;
      --red:#7a1111;
      --text:#f4f4f5;
      --muted:#b8bcc4;
      --border:#2a2a2a;
    }

    *{
      box-sizing:border-box;
    }

    html{
      background:var(--bg);
    }

    body{
      margin:0;
      min-height:100vh;

      background:
        radial-gradient(
          circle at top,
          rgba(250,204,21,.12),
          transparent 34%
        ),
        var(--bg);

      color:var(--text);

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    [data-lang]{
      display:none;
    }

    html[lang="en"] [data-lang="en"],
    html[lang="es"] [data-lang="es"]{
      display:inline;
    }

    .page{
      min-height:100vh;

      display:grid;
      place-items:center;

      padding:32px 16px;
    }

    .card{
      width:100%;
      max-width:680px;

      padding:38px 28px;

      text-align:center;

      background:var(--panel);

      border:1px solid var(--border);
      border-radius:22px;

      box-shadow:
        0 22px 50px rgba(0,0,0,.5);
    }

    .eyebrow{
      margin:0 0 12px;

      color:var(--gold);

      font-size:.78rem;
      font-weight:900;
      letter-spacing:.18em;

      text-transform:uppercase;
    }

    h1{
      margin:0 0 18px;

      color:#fff;

      font-size:clamp(2.2rem,7vw,3.6rem);
      line-height:1.05;
    }

    .lead{
      max-width:560px;

      margin:0 auto;

      color:var(--muted);

      font-size:1.05rem;
      line-height:1.7;
    }

    .actions{
      display:flex;
      justify-content:center;

      margin-top:30px;
    }

    .btn{
      display:inline-flex;

      justify-content:center;
      align-items:center;

      min-width:210px;

      padding:13px 22px;

      border-radius:999px;

      color:#fff;

      font-weight:800;

      text-decoration:none;

      transition:
        transform .2s ease,
        filter .2s ease;
    }

    .btn:hover{
      filter:brightness(1.08);
      transform:translateY(-1px);
    }

    .btn:focus-visible{
      outline:
        3px solid rgba(250,204,21,.35);

      outline-offset:3px;
    }

    .btn-primary{
      background:var(--red);
      border:1px solid #941b1b;
    }

    @media (max-width:600px){
      .page{
        padding:18px 12px;
      }

      .card{
        padding:30px 20px;
        border-radius:18px;
      }

      .lead{
        font-size:.98rem;
      }

      .btn{
        width:100%;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="card">

      <p class="eyebrow">
        Sandman Academy of Combat & Fitness
      </p>

      <h1>
        <span data-lang="en">
          Thank You
        </span>

        <span data-lang="es">
          Gracias
        </span>
      </h1>

      <p class="lead">
        <span data-lang="en">
          We received your information.
          Our academy team will follow up with your next step.
        </span>

        <span data-lang="es">
          Recibimos tu información.
          Nuestro equipo de la academia se comunicará contigo
          con el próximo paso.
        </span>
      </p>

      <div class="actions">
        <a
          class="btn btn-primary"
          href="/"
        >
          <span data-lang="en">
            Visit Sandman Academy
          </span>

          <span data-lang="es">
            Visitar Sandman Academy
          </span>
        </a>
      </div>

    </section>

  </main>

  <script>


    /* SANDMAN-THANK-YOU-LOCAL-HOME */

    function setLocalAcademyHome() {
      const link =
        document.getElementById("thankYouHomeLink");

      if (!link) return;

      const params =
        new URLSearchParams(window.location.search);

      const location =
        (params.get("location") || "")
          .trim()
          .toLowerCase();

      const localHomes = {
        "santa-ynez-valley":
          "/locations/santa-ynez-valley/",
        "lompoc":
          "/locations/lompoc/",
        "elk-grove":
          "/locations/elk-grove/"
      };

      link.href =
        localHomes[location] || "/";

      const en =
        link.querySelector('[data-lang="en"]');

      const es =
        link.querySelector('[data-lang="es"]');

      if (location === "santa-ynez-valley") {
        if (en) {
          en.textContent =
            "Return to Home";
        }

        if (es) {
          es.textContent =
            "Volver al Inicio";
        }
      }
    }


    const params =
      new URLSearchParams(
        window.location.search
      );

    document.documentElement.lang =
      params.get("lang") === "es"
        ? "es"
        : "en";
  </script>

</body>
</html>
