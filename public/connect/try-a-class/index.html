<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Try a Class | Sandman Combat</title>
  <meta name="description" content="Request an introductory class, promotional visit, or approved Open Practice with Sandman Combat.">
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="stylesheet" href="/connect/try-a-class/try-a-class.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <main class="request-page">
    <header class="request-hero">
      <p class="eyebrow">Sandman Admissions</p>
      <h1>Try a Class</h1>
      <p>Choose the entry path that best fits your family. Every request is reviewed before a class is confirmed.</p>
    </header>

    <section class="entry-grid" aria-label="Class entry options">
      <label class="entry-card">
        <input type="radio" name="entryType" value="REQUESTED_INTRO" form="admissionsRequestForm" checked>
        <span class="entry-card__title">Requested Intro</span>
        <span class="entry-card__price">$25</span>
        <span class="entry-card__copy">Attend one class. The paid $25 is credited toward enrollment if you join.</span>
      </label>

      <label class="entry-card">
        <input type="radio" name="entryType" value="PROMOTIONAL_INTRO" form="admissionsRequestForm">
        <span class="entry-card__title">Promotional Intro</span>
        <span class="entry-card__price">Complimentary</span>
        <span class="entry-card__copy">Available during approved promotions. Includes a $25 enrollment discount.</span>
      </label>

      <label class="entry-card">
        <input type="radio" name="entryType" value="OPEN_PRACTICE" form="admissionsRequestForm">
        <span class="entry-card__title">Open Practice</span>
        <span class="entry-card__price">By Approval</span>
        <span class="entry-card__copy">Complimentary by coach invitation, approved request, or system approval. No enrollment credit or discount.</span>
      </label>
    </section>

    <form id="admissionsRequestForm" class="request-form" novalidate>
      <section class="form-section">
        <h2>Contact</h2>
        <div class="form-grid">
          <label>Parent or adult participant<input id="contactName" name="contactName" type="text" autocomplete="name" required></label>
          <label>Email<input id="email" name="email" type="email" autocomplete="email" required></label>
          <label>Phone<input id="phone" name="phone" type="tel" autocomplete="tel" required></label>
          <label>Preferred contact<select id="preferredContact" name="preferredContact" required><option value="text">Text</option><option value="phone">Phone</option><option value="email">Email</option></select></label>
        </div>
      </section>

      <section class="form-section">
        <h2>Athlete</h2>
        <div class="form-grid">
          <label>Athlete name<input id="athleteName" name="athleteName" type="text" required></label>
          <label>Athlete age<input id="athleteAge" name="athleteAge" type="number" min="3" max="99" required></label>
          <label>Journey / program<select id="programInterest" name="programInterest" required>
            <option value="">Choose one</option>
            <option value="zero2hero-wrestling">Zero2Hero Wrestling</option>
            <option value="zero2hero-boxing">Zero2Hero Boxing</option>
            <option value="zero2hero-muay-thai">Zero2Hero Muay Thai</option>
            <option value="path2legend-wrestling">Path2Legend Wrestling</option>
            <option value="path2legend-boxing">Path2Legend Boxing</option>
            <option value="path2legend-muay-thai">Path2Legend Muay Thai</option>
            <option value="quest2mastery-mma">Quest2Mastery MMA</option>
            <option value="quest2mastery-submission-grappling">Quest2Mastery Submission Grappling</option>
            <option value="fitness">Everyday Fitness</option>
            <option value="not-sure">Not Sure</option>
          </select></label>
          <label>Experience level<select id="experienceLevel" name="experienceLevel" required><option value="none">No prior experience</option><option value="beginner">Beginner</option><option value="intermediate">Intermediate</option><option value="advanced">Advanced / competitive</option></select></label>
          <label>Preferred day<input id="preferredDay" name="preferredDay" type="text" placeholder="Example: Tuesday or Thursday"></label>
          <label>Preferred location<select id="location" name="location" required><option value="solvang">Solvang</option><option value="lompoc">Lompoc</option><option value="not-sure">Not Sure</option></select></label>
        </div>
      </section>

      <section class="form-section">
        <h2>Message</h2>
        <label>Tell us what you are looking for<textarea id="message" name="message" rows="6" placeholder="Goals, concerns, prior experience, or anything the coach should know."></textarea></label>
        <label class="consent-row"><input id="contactConsent" name="contactConsent" type="checkbox" required><span>I give Sandman permission to contact me about this request.</span></label>
        <p id="entryNotice" class="entry-notice"></p>
        <p id="formStatus" class="form-status" role="status" aria-live="polite"></p>
        <button id="submitBtn" class="submit-btn" type="submit">Submit Request</button>
      </section>
    </form>

    <p class="back-link"><a href="/connect.html">Return to Connect</a></p>
  </main>
  <script type="module" src="/connect/try-a-class/try-a-class.js"></script>
</body>
</html>
