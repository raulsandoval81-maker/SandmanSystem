 <!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Follow-Up | Sandman Connect</title>

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <link
    rel="stylesheet"
    href="/assets/css/site.css"
  >

  <link
    rel="stylesheet"
    href="/connect/connect-hub.css"
  >

  <link rel="icon" href="data:,">
</head>

<body>
  <main class="hub">

    <header class="hero">
      <p class="eyebrow">
        Sandman Connect
      </p>

      <h1>
        Follow-Up
      </h1>

      <p class="subtitle">
        Continue conversations with families who need more time,
        more information, or a revised proposal before payment.
      </p>
    </header>

    <section class="grid">

      <article
        id="followUpContext"
        class="card"
      >
        <strong>
          Proposal Follow-Up
        </strong>

        <p id="followUpStatus">
          No proposal has been handed into Follow-Up yet.
        </p>

        <div id="followUpDetails"></div>
      </article>

      <a
        class="card"
        href="/connect/"
      >
        <strong>
          Return to Connect
        </strong>

        <p>
          Go back to the Recruiting Command Center.
        </p>
      </a>

    </section>

  </main>
</body>
</html>
