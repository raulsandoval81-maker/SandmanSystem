<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <title>Billing | Sandman Management</title>

  <link
    rel="stylesheet"
    href="/assets/css/management-ui.css"
  >

  <link
    rel="stylesheet"
    href="/management/hub/management.css"
  >

  <link
    rel="stylesheet"
    href="/management/billing/billing.css"
  >
</head>

<body data-management-area="billing">

  <main class="billing-wrap">

    <header class="billing-header">
      <div>
        <p class="eyebrow">
          Management · Finance
        </p>

        <h1>Billing</h1>

        <p>
          Review checkout, payment, pass,
          and enrollment follow-through.
        </p>
      </div>

      <button
        id="refreshBilling"
        class="button button-secondary"
        type="button"
      >
        Refresh
      </button>
    </header>

    <p
      id="billingStatus"
      class="billing-status"
      aria-live="polite"
    >
      Loading billing activity…
    </p>

    <section
      class="billing-summary"
      aria-label="Billing summary"
    >
      <button
        class="billing-summary-card is-active"
        type="button"
        data-view="NEEDS_ACTION"
      >
        <span>Needs Action</span>
        <strong id="countNeedsAction">0</strong>
      </button>

      <button
        class="billing-summary-card"
        type="button"
        data-view="WAITING"
      >
        <span>Waiting</span>
        <strong id="countWaiting">0</strong>
      </button>

      <button
        class="billing-summary-card"
        type="button"
        data-view="PAID_READY"
      >
        <span>Paid / Ready</span>
        <strong id="countPaidReady">0</strong>
      </button>

      <button
        class="billing-summary-card"
        type="button"
        data-view="CLOSED"
      >
        <span>Closed</span>
        <strong id="countClosed">0</strong>
      </button>
    </section>

    <section class="billing-toolbar">
      <label>
        <span class="sr-only">
          Search billing
        </span>

        <input
          id="billingSearch"
          type="search"
          placeholder="Search athlete, family, location, or payment…"
          autocomplete="off"
        >
      </label>

      <span id="billingVisibleCount">
        0 records
      </span>
    </section>

    <section
      id="billingQueue"
      class="billing-queue"
      aria-live="polite"
    ></section>

  </main>

  <script
    type="module"
    src="/management/shared/management-shell.js"
  ></script>

  <script
    type="module"
    src="/management/billing/billing.js"
  ></script>

</body>
</html>
