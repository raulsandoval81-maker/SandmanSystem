<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admissions | Sandman Management</title>
</head>
<body>
  <main>
    <p>Opening Leads...</p>
    <p><a id="fallbackLink" href="/connect/leads/">Continue to Leads</a></p>
  </main>

  <script>
    (() => {
      const destination =
        "/connect/leads/" +
        window.location.search;

      const fallbackLink =
        document.getElementById("fallbackLink");

      if (fallbackLink) {
        fallbackLink.href = destination;
      }

      window.location.replace(destination);
    })();
  </script>
</body>
</html>
