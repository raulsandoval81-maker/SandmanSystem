<script type="module">
  import { resolveSignedInAthlete } from "/assets/js/athlete-dashboard-data.js";
  import {
    athleteProfilePage, canonicalAthleteHref, persistVerifiedAthleteId,
    clearUnverifiedAthleteId,
  } from "/assets/js/athlete-journey-routes.js";

  function requestedId() {
    const params = new URLSearchParams(location.search);
    return String(params.get("id") || params.get("uid") || params.get("athleteId") || "").trim();
  }

  async function route() {
    try {
      const { athleteId, athlete } = await resolveSignedInAthlete(requestedId());
      if (!athleteId || !athlete) {
        clearUnverifiedAthleteId();
        location.replace("/athletes/auth/");
        return;
      }
      persistVerifiedAthleteId(athleteId);
      location.replace(canonicalAthleteHref(athleteProfilePage(athlete, athleteId), athleteId));
    } catch (error) {
      clearUnverifiedAthleteId();
      document.body.textContent = "Unable to route profile securely. Return to Athlete Access.";
      console.error("[Athlete Profile Router] verified lookup failed:", error?.code || "runtime-error");
    }
  }

  route();
</script>
