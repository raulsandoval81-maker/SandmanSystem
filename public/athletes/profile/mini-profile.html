<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Athlete · Mini Profile</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>

  <link rel="stylesheet" href="/athletes/profile/profile.css"/>
  <link rel="stylesheet" href="/athletes/profile/mini-profile.css"/>
  <link rel="stylesheet" href="/assets/css/belts.css"/>
  <link rel="stylesheet" href="/assets/css/athlete-ui.css"/>
  <script type="module" src="/assets/js/athlete-nav.js"></script>
  <link rel="icon" href="data:,">

  <style>
    .mini-progress-label{
      margin-top:.45rem;
      font-weight:800;
      color:var(--text, #fff);
    }



    .rank-stats{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-top:6px;
      font-weight:800;
      color:var(--text, #fff);
    }

    .mini-belt-slot{
  margin-top:8px;
  width:100%;
}
/* FORCE belt to fill container */
.mini-belt-slot .sm-belt {
  width: 100%;
  max-width: none;
}

/* keep patch proportion correct */
.mini-belt-slot .sm-belt-patch {
  right: 0;           /* anchor to edge */
  width: 28%;         /* adjust if needed (25–30%) */
  min-width: 120px;   /* prevents collapse */
}

    .skills-tracker{
      margin-top:14px;
    }

    .skills-tracker__title{
      font-weight:900;
      font-size:1rem;
      margin-bottom:10px;
      letter-spacing:.2px;
    }

    .skill-accordion{
      border:1px solid rgba(255,255,255,.12);
      border-radius:14px;
      overflow:hidden;
      background:rgba(255,255,255,.035);
    }

    .skill-accordion summary{
      cursor:pointer;
      list-style:none;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 16px;
      font-weight:900;
    }

    .skill-accordion summary::-webkit-details-marker{
      display:none;
    }

    .skill-accordion summary::after{
      content:"＋";
      font-size:1.15rem;
      font-weight:900;
    }

    .skill-accordion[open] summary::after{
      content:"−";
    }

.skill-stage{
      font-size:.78rem;
      opacity:.68;
      white-space:nowrap;
    }

.skill-stage{
      display:block;
      margin-top:3px;
    }

.skill-progress-list{
    display:grid;
    gap:9px;
  }

  .skill-progress-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    padding:13px 14px;
    border:1px solid rgba(255,255,255,.10);
    border-radius:12px;
    background:rgba(255,255,255,.035);
  }

  .skill-progress-name{
    min-width:0;
  }

</style>
</head>
<body class="athlete-app">
<header class="athlete-sub-header">
  <div class="sub-header-inner">
    <span class="brand">Sandman Combat™</span>

    <div class="sub-nav">
      <a id="homeLink" href="/athletes/hub/mini-hub.html" class="sub-btn home">Home</a>
    </div>
  </div>
</header>

  <main class="wrap">
    <header class="profile-header"></header>

    <section id="combatLane" class="card">
      <div class="row" style="margin-bottom:8px">
        <div class="stat" style="flex:1 1 100%">
          <div class="combat-header">
                      <span id="combatArcTitle" class="title">⚔️ Combat · Road2Champion</span>
          </div>
        </div>
      </div>

      <!-- Discipline Selector -->
      <div
        id="disciplineSelectorWrap"
        class="row"
        style="display:none; margin-bottom:10px;"
      >
        <div class="stat" style="flex:1 1 100%;">
          <div class="label">Combat Discipline</div>

          <div
            id="disciplineSelector"
            class="discipline-selector"
            role="group"
            aria-label="Combat discipline"
          ></div>
        </div>
      </div>

      <div class="row">
        <div class="stat identity-box" style="flex:1 1 100%">
          <div class="avatar-badge">
            <div id="ath-avatar" class="avatar-box"></div>

             <div id="ath-badge-history" class="badge-history"></div>
          </div>
        </div>

        <div class="stat" style="flex:1 1 100%">
          <div class="label">Name</div>
          <div class="value" id="out-name">—</div>
        </div>
      </div>

      <div class="row">
        <div class="stat">
          <div class="label">Team</div>
          <div class="value" id="out-team">—</div>
        </div>

        <div class="stat">
          <div class="label">City · State</div>
          <div class="value" id="out-citystate">—</div>
        </div>

        <div class="stat rank-box">
          <div class="label">Color · Rank</div>
          <div class="value" id="out-rank">—</div>

          <div id="rankBar" class="mini-belt-slot"></div>


          <div class="rank-stats">
            <span id="stripeText">Stripes: 0/4</span>
            <span id="percentText">0 / 800 XP</span>
          </div>

          <div id="progressLabel" class="mini-progress-label">
            Just getting started
          </div>
        </div>
      </div>
    </section>
    <!-- ===================== ROAD2CHAMPION SKILLS ===================== -->
    <section id="skillsLane" class="card skills-tracker" hidden>
      <div class="skills-tracker__title">Skills Development</div>

      <details class="skill-accordion">
        <summary>
          <span id="skillsDisciplineTitle">Technical progress</span>
        </summary>

        <div id="canonicalSkills" class="skill-progress-list">
          <p class="muted">Loading skills...</p>
        </div>
      </details>
    </section>

            <!-- ===================== RECENT ACHIEVEMENTS ===================== -->
    <section id="achievementLane" class="card">
      <div class="label">Recent Achievements</div>
      <div id="achievementFeed" class="achievement-feed">
        <p class="muted">Loading achievements...</p>
      </div>
    </section>

    <!-- ===================== RECENT ACTIVITY ===================== -->
    <section id="activityLane" class="card">
      <div class="label">Recent Activity</div>
      <div id="activityFeed" class="activity-feed">
        <p class="muted">Loading activity...</p>
      </div>
    </section>

  </main>

<script type="module" src="/athletes/profile/mini-profile.js"></script>
<script type="module" src="/athletes/profile/road2champion-skills.js?v=20260918-2"></script>
</body>
</html>
