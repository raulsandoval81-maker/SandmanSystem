<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Team Bulletin</title>

  <link
    rel="stylesheet"
    href="/communications/shared/comms.css"
  >
  <link rel="stylesheet" href="/assets/css/athlete-ui.css">
  <link rel="stylesheet" href="/assets/css/f4-athlete.css">
  <script type="module" src="/assets/js/athlete-nav.js"></script>

  <link rel="icon" href="data:,">

  <style>
    :root{
      --bg:#0a1833;
      --panel:#111c35;
      --line:#27304a;
      --gold:#ffdd48;
      --text:#f0f4f8;
      --muted:#9aa4b1;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        Arial,
        sans-serif;
    }

    .athlete-sub-header{
      position:sticky;
      top:0;
      z-index:1000;
      background:#0b0f17;
      border-bottom:2px solid var(--gold);
      padding:10px 16px;
    }

    .sub-header-inner{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      max-width:1100px;
      margin:0 auto;
    }

    .brand{
      color:var(--gold);
      font-weight:800;
      font-size:.95rem;
    }

    .sub-nav{
      display:flex;
      gap:8px;
    }

    .sub-btn{
      padding:6px 10px;
      border-radius:8px;
      font-size:.8rem;
      text-decoration:none;
      border:1px solid #1f2a40;
      background:#0e1420;
      color:#cbd5e1;
    }

    .sub-btn:hover{
      border-color:var(--gold);
      color:var(--gold);
    }

    .sub-btn.home{
      background:var(--gold);
      color:#111;
      border-color:var(--gold);
      font-weight:700;
    }

    .wrap{
      max-width:720px;
      margin:0 auto;
      padding:24px 16px 40px;
    }

    h1{
      color:var(--gold);
      margin:0 0 20px;
      font-size:clamp(2rem, 6vw, 3rem);
      line-height:1.05;
    }

    .button-grid{
      display:flex;
      flex-direction:column;
      gap:18px;
      margin-bottom:34px;
    }

    .bulletin-btn{
      display:flex;
      align-items:center;
      min-height:110px;
      text-decoration:none;
      padding:24px 22px;
      border-radius:22px;
      background:var(--panel);
      border:1px solid var(--line);
      font-weight:800;
      font-size:1.2rem;
      letter-spacing:.2px;
      color:var(--text);
      transition:.18s ease;
      box-shadow:0 8px 24px rgba(0,0,0,.18);
    }

    .bulletin-btn:hover{
      border-color:var(--gold);
      color:var(--gold);
      transform:translateY(-1px);
    }

    .quote{
      border-top:1px solid var(--line);
      padding-top:20px;
      color:var(--muted);
      font-style:italic;
      line-height:1.5;
      font-size:1rem;
    }

    .quote span{
      display:block;
      margin-top:8px;
      font-style:normal;
      font-weight:700;
      color:var(--gold);
    }

    @media (max-width:640px){
      .bulletin-btn{
        min-height:120px;
        padding:26px 22px;
        font-size:1.15rem;
      }
    }

    /* ========================================
       FOUNDRY 4 — BULLETIN LANDING
    ======================================== */

    body.f4-athlete{
      --bg:#101820;
      --panel:#181818;
      --line:rgba(212,175,55,.28);
      --gold:#d4af37;
      --text:#f7f7f5;
      --muted:#c9c1b2;
    }

    body.f4-athlete .athlete-sub-header{
      background:#080808;
      border-bottom-color:#d4af37;
    }

    body.f4-athlete .brand{
      color:#d4af37;
    }

    body.f4-athlete .sub-btn{
      background:#181818;
      border-color:rgba(212,175,55,.28);
      color:#f2ead8;
    }

    body.f4-athlete .sub-btn.home{
      background:#d4af37;
      border-color:#d4af37;
      color:#080808;
    }

    body.f4-athlete .wrap{
      padding-top:34px;
      padding-bottom:54px;
    }

    body.f4-athlete h1{
      color:#d4af37;
      margin-bottom:28px;
    }

    body.f4-athlete .button-grid{
      gap:20px;
      margin-bottom:42px;
    }

    body.f4-athlete .bulletin-btn{
      background:#181818;
      border-color:rgba(212,175,55,.28);
      color:#f7f7f5;
      box-shadow:none;
    }

    body.f4-athlete .bulletin-btn:hover{
      border-color:#d4af37;
      color:#f0cf67;
    }

    body.f4-athlete .quote{
      border-top-color:rgba(212,175,55,.28);
      color:#c9c1b2;
      padding-top:24px;
    }

    body.f4-athlete .quote span{
      color:#d4af37;
    }

    html[data-athlete-theme="day"] body.f4-athlete{
      --bg:#eee8dc;
      --panel:#fffaf0;
      --line:rgba(24,24,24,.18);
      --text:#181818;
      --muted:#5d5549;
    }

    html[data-athlete-theme="day"] body.f4-athlete .bulletin-btn{
      background:#fffaf0;
      border-color:rgba(24,24,24,.16);
      color:#181818;
    }

    html[data-athlete-theme="day"] body.f4-athlete .quote{
      border-top-color:rgba(24,24,24,.18);
      color:#5d5549;
    }

    @media (max-width:640px){
      body.f4-athlete .wrap{
        padding-top:28px;
        padding-bottom:46px;
      }

      body.f4-athlete h1{
        margin-bottom:24px;
      }

      body.f4-athlete .button-grid{
        gap:16px;
        margin-bottom:36px;
      }
    }
  </style>
</head>

<body class="athlete-app f4-athlete">

  <header class="athlete-sub-header">
    <div class="sub-header-inner">

      <span class="brand">
        Sandman Combat™
      </span>

      <div class="sub-nav">

        <a
          id="homeLink"
          href="/athletes/hub/full-hub.html"
          class="sub-btn home"
        >
          Home
        </a>

      </div>
    </div>
  </header>

  <main class="wrap">

    <h1>
      Team Bulletin
    </h1>

    <div class="button-grid">

      <a
        id="announcementsLink"
        class="bulletin-btn"
        href="/athletes/bulletin/announcements.html"
      >
        📣 Announcements
      </a>

      <a
        id="scheduleLink"
        class="bulletin-btn"
        href="/communications/athlete/schedule.html"
      >
        📅 Practice &amp; Tournament Schedule
      </a>

    </div>

    <div class="quote">
      “Let us run with perseverance the race marked out for us.”
      <span>— Hebrews 12:1</span>
    </div>

  </main>

  <script>
    const params =
      new URLSearchParams(window.location.search);

    const athleteId =
      String(
        params.get("id") ||
        params.get("uid") ||
        params.get("athleteId") ||
        localStorage.getItem("sandman_lastAthleteUid") ||
        localStorage.getItem("currentAthleteId") ||
        sessionStorage.getItem("currentAthleteId") ||
        ""
      )
        .trim()
        .toUpperCase();

    function withAthleteId(path){
      if (!athleteId) {
        return path;
      }

      const url =
        new URL(
          path,
          window.location.origin
        );

      url.searchParams.set(
        "id",
        athleteId
      );

      return `${url.pathname}${url.search}`;
    }

    const homeLink =
      document.getElementById("homeLink");

    const announcementsLink =
      document.getElementById("announcementsLink");

    const scheduleLink =
      document.getElementById("scheduleLink");

    if (athleteId) {
      localStorage.setItem(
        "sandman_lastAthleteUid",
        athleteId
      );

      localStorage.setItem(
        "currentAthleteId",
        athleteId
      );

      sessionStorage.setItem(
        "currentAthleteId",
        athleteId
      );
    }

    if (homeLink) {
      homeLink.href =
        withAthleteId(
          "/athletes/hub/full-hub.html"
        );
    }

    if (announcementsLink) {
      announcementsLink.href =
        withAthleteId(
          "/athletes/bulletin/announcements.html"
        );
    }

    if (scheduleLink) {
      scheduleLink.href =
        withAthleteId(
          "/communications/athlete/schedule.html"
        );
    }
  </script>

</body>
</html>
