<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Athlete Hub Router</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{
      margin:0;
      background:#08090b;
      color:#e5e5e5;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      display:grid;
      place-items:center;
      min-height:100vh;
    }
    .msg{
      opacity:.8;
      font-weight:700;
      letter-spacing:.2px;
    }
  </style>
</head>
<body>
  <div class="msg">Routing athlete...</div>

  <script type="module">
    import {
      db,
      doc,
      getDoc
    } from "/assets/js/firebase-init.js";

    function getIdFromUrl() {
      const p = new URLSearchParams(window.location.search);

      return (
        p.get("id") ||
        p.get("uid") ||
        p.get("athleteId") ||
        ""
      ).toString().trim();
    }

    function normalizeJourney(value) {
      return (value || "")
        .toString()
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "");
    }

    function go(url) {
      window.location.replace(url);
    }

    function fail(msg) {
      document.body.innerHTML = `<div class="msg">${msg}</div>`;
      throw new Error(msg);
    }

    async function route() {
      const id = getIdFromUrl();

      if (!id) {
        fail("Missing athlete ID");
        return;
      }

      try {
        const snap = await getDoc(doc(db, "athletes", id));

        if (snap.exists()) {
          const athlete = snap.data() || {};

          const journey = normalizeJourney(
            athlete.programTrack ||
            athlete.journey ||
            athlete.track ||
            athlete.trackCode
          );

          if (journey === "road2champion" || journey === "r2c") {
            go(`/athletes/hub/mini-hub.html?id=${encodeURIComponent(id)}`);
            return;
          }

          if (
            journey === "path2legend" ||
            journey === "p2l" ||
            journey === "quest2mastery" ||
            journey === "q2m"
          ) {
            go(`/athletes/hub/full-hub.html?id=${encodeURIComponent(id)}`);
            return;
          }
        }
      } catch (err) {
        console.warn("[Athlete Hub Router] athlete lookup failed:", err);
      }

      const legacyId = id.toUpperCase();

      if (legacyId.startsWith("F8_")) {
        go(`/athletes/hub/mini-hub.html?id=${encodeURIComponent(id)}`);
        return;
      }

      if (legacyId.startsWith("F4_")) {
        go(`/athletes/hub/full-hub.html?id=${encodeURIComponent(id)}`);
        return;
      }

      fail("Unable to determine athlete journey");
    }

    route();
  </script>
</body>
</html>
