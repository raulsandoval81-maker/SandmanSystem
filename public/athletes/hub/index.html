<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Athlete Hub Router</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{
      margin:0;
      background:#08090b;
      color:#e5e5e5;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      display:grid;
      place-items:center;
      min-height:100vh;
    }
    .msg{
      opacity:.8;
      font-weight:700;
      letter-spacing:.2px;
    }
  </style>
</head>
<body>
  <div class="msg">Routing athlete...</div>

  <script type="module">
    import { resolveSignedInAthlete } from "/assets/js/athlete-dashboard-data.js";
    import {
      athleteExperience, canonicalAthleteHref, persistVerifiedAthleteId,
      clearUnverifiedAthleteId,
    } from "/assets/js/athlete-journey-routes.js";

    function requestedId() {
      const params = new URLSearchParams(location.search);
      return String(params.get("id") || params.get("uid") || params.get("athleteId") || "").trim();
    }

    function stop(message) {
      document.querySelector(".msg").textContent = message;
    }

    async function route() {
      try {
        const { athleteId, athlete } = await resolveSignedInAthlete(requestedId());
        if (!athleteId || !athlete) {
          clearUnverifiedAthleteId();
          location.replace("/athletes/auth/");
          return;
        }

        const experience = athleteExperience(athlete, athleteId);
        if (!experience) {
          clearUnverifiedAthleteId();
          stop("Unable to determine athlete journey");
          return;
        }
        persistVerifiedAthleteId(athleteId);
        const target = experience === "mini"
          ? "/athletes/hub/mini-hub.html" : "/athletes/hub/full-hub.html";
        location.replace(canonicalAthleteHref(target, athleteId));
      } catch (error) {
        clearUnverifiedAthleteId();
        stop("Unable to route athlete securely. Return to Athlete Access.");
        console.error("[Athlete Hub Router] verified lookup failed:", error?.code || "runtime-error");
      }
    }

    route();
  </script>
</body>
</html>
