<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >
  <title>Redirecting…</title>
  <meta name="robots" content="noindex">
</head>
<body>
  <p>Redirecting to the current Combat Arsenal…</p>

  <script>
    const params =
      new URLSearchParams(
        window.location.search
      );

    const athleteId = String(
      params.get("athleteId") ||
      params.get("id") ||
      localStorage.getItem(
        "currentAthleteId"
      ) ||
      sessionStorage.getItem(
        "currentAthleteId"
      ) ||
      ""
    )
      .trim()
      .toUpperCase();

    function normalizeDiscipline(
      value = ""
    ) {
      const raw =
        String(value || "")
          .trim()
          .toLowerCase();

      if (raw.includes("kickbox")) {
        return "kickboxing";
      }

      if (raw.includes("wrest")) {
        return "wrestling";
      }

      if (
        raw === "mma" ||
        raw.includes("mixed martial")
      ) {
        return "mma";
      }

      if (raw.includes("box")) {
        return "boxing";
      }

      return raw;
    }

    const routes = {
      "wrestling": "/athletes/arsenal/combat/p2l/wrestling/index.html",
      "boxing": "/athletes/arsenal/combat/p2l/boxing/index.html",
      "mma": "/athletes/arsenal/combat/q2m/mma/index.html"
    };

    const requestedDiscipline =
      normalizeDiscipline(
        params.get("discipline") ||
        localStorage.getItem(
          `sandman_active_discipline_${athleteId}`
        ) ||
        ""
      );

    const discipline =
      routes[requestedDiscipline]
        ? requestedDiscipline
        : "wrestling";

    const target =
      routes[discipline];

    if (athleteId) {
      localStorage.setItem(
        "currentAthleteId",
        athleteId
      );

      localStorage.setItem(
        `sandman_active_discipline_${athleteId}`,
        discipline
      );
    }

    const out =
      new URLSearchParams();

    if (athleteId) {
      out.set("id", athleteId);
    }

    out.set(
      "discipline",
      discipline
    );

    window.location.replace(
      `${target}?${out.toString()}`
    );
  </script>
</body>
</html>
