<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />

  <title>Combat Arsenal | Sandman Combat™</title>

  <link rel="icon" href="data:," />

  <style>
    :root{
      --bg:#0a1833;
      --panel:#111c35;
      --line:#27304a;
      --gold:#ffdd48;
      --text:#f0f4f8;
      --muted:#9aa4b1;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:16px;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }

    .box{
      width:min(520px,100%);
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:16px;
      padding:22px 20px;
      text-align:center;
      box-shadow:0 4px 14px rgba(0,0,0,.35);
    }

    h1{
      margin:0 0 10px;
      color:var(--gold);
      font-size:1.1rem;
      text-transform:uppercase;
      letter-spacing:.06em;
    }

    p{
      margin:0;
      color:var(--muted);
      line-height:1.45;
    }

    .actions{
      margin-top:16px;
      display:flex;
      justify-content:center;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:10px 14px;
      border:1px solid var(--line);
      border-radius:10px;
      background:#1d2a4a;
      color:var(--text);
      text-decoration:none;
      font-size:.92rem;
      font-weight:800;
      cursor:pointer;
    }

    .btn:hover{
      border-color:var(--gold);
    }
  </style>
</head>

<body>

  <main class="box">
    <h1>Combat Arsenal</h1>

    <p id="status">
      Checking athlete path…
    </p>

    <div class="actions">
      <a
        id="backLink"
        class="btn"
        href="/athletes/arsenal/"
      >
        Back
      </a>
    </div>
  </main>

  <script>
    const params =
      new URLSearchParams(window.location.search);

    const athleteId = String(
      params.get("athleteId") ||
      params.get("id") ||
      localStorage.getItem("currentAthleteId") ||
      sessionStorage.getItem("currentAthleteId") ||
      ""
    )
      .trim()
      .toUpperCase();

    const discipline =
      params.get("discipline") ||
      (
        athleteId
          ? localStorage.getItem(
              `sandman_active_discipline_${athleteId}`
            )
          : ""
      ) ||
      "";

    const statusEl =
      document.getElementById("status");

    const backLink =
      document.getElementById("backLink");

    function buildUrl(base) {
      const out =
        new URLSearchParams();

      if (athleteId) {
        out.set("id", athleteId);
      }

      if (discipline) {
        out.set(
          "discipline",
          discipline
        );
      }

      return `${base}?${out.toString()}`;
    }

    if (backLink && athleteId) {
      backLink.href =
        buildUrl(
          "/athletes/arsenal/"
        );
    }

    if (!athleteId) {
      statusEl.textContent =
        "Missing athlete ID.";
    } else if (
      athleteId.startsWith("F4_")
    ) {
      window.location.replace(
        buildUrl(
          discipline === "boxing"
          ? "/athletes/arsenal/combat/p2l/boxing/index.html"
          : discipline === "mma"
            ? "/athletes/arsenal/combat/q2m/mma/index.html"
            : "/athletes/arsenal/combat/p2l/wrestling/index.html"
        )
      );
    } else if (
      athleteId.startsWith("F8_")
    ) {
      window.location.replace(
        buildUrl(
          "/athletes/arsenal/combat/z2h/wrestling/index.html"
        )
      );
    } else {
      statusEl.textContent =
        "Unknown athlete type.";
    }
  </script>

</body>
</html>
