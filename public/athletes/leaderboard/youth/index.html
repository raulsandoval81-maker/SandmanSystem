<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />

  <title>Youth Leaderboard</title>

  <link
    rel="stylesheet"
    href="/athletes/leaderboard/leaderboard.css"
  />
  <link rel="stylesheet" href="/assets/css/athlete-ui.css" />
  <script type="module" src="/assets/js/athlete-nav.js"></script>

  <link rel="icon" href="data:," />
</head>

<body class="athlete-app">

<header class="athlete-sub-header">
  <div class="sub-header-inner">
    <span class="brand">
      Sandman Combat System™
    </span>

    <div class="sub-nav">
      <a
        id="nav-home"
        href="#"
        class="sub-btn home"
      >
        Home
      </a>

      <a
        href="/athletes/bulletin/index.html"
        class="sub-btn"
      >
        Bulletin
      </a>

      <a
        href="/athletes/arsenal/index.html"
        class="sub-btn"
      >
        Arsenal
      </a>

      <a
        href="/athletes/leaderboard/youth/index.html"
        class="sub-btn"
        aria-current="page"
      >
        Leaderboard
      </a>
    </div>
  </div>
</header>

<main class="wrap">

  <h1>Youth Leaderboard</h1>

  <div class="controls">

    <select
      id="mode-toggle"
      aria-label="Leaderboard visibility"
    >
      <option value="private">
        Private
      </option>

      <option value="public">
        Public
      </option>
    </select>

    <select
      id="view-mode"
      aria-label="Leaderboard scope"
    >
      <option value="overall">
        Overall
      </option>

      <option value="tier">
        Tier
      </option>
    </select>

    <select
      id="rank-mode"
      aria-label="Ranking mode"
    >
      <option value="progression">
        Combat Progression
      </option>

      <option value="lifetime">
        Lifetime XP
      </option>
    </select>

  </div>

  <h2 id="board-title">
    Top 8
  </h2>

  <div id="top8-list">
    <div class="empty">
      Loading leaderboard...
    </div>
  </div>

  <section id="private-zone-panel">
    <h3>Your Zone</h3>

    <div id="your-zone">
      <div class="empty">
        Loading your zone...
      </div>
    </div>
  </section>

  <section id="next-target-panel">
    <h3>Next Target</h3>

    <div id="next-target">
      <div class="empty">
        Loading target...
      </div>
    </div>
  </section>

</main>

<script>
  const params =
    new URLSearchParams(window.location.search);

  const athleteId =
    params.get("athleteId") ||
    params.get("id") ||
    localStorage.getItem("currentAthleteId") ||
    sessionStorage.getItem("currentAthleteId") ||
    "";

  const home =
    document.getElementById("nav-home");

  if (home && athleteId) {
    home.href =
      `/athletes/hub/full-hub.html?id=${encodeURIComponent(athleteId)}`;
  }
</script>

<script
  type="module"
  src="/athletes/leaderboard/leaderboard.app.js"
></script>

</body>
</html>
