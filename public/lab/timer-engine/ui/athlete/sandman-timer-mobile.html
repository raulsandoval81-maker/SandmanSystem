<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Shadow Wrestling Training</title>
  <link rel="stylesheet" href="/lab/timer-engine/ui/athlete/sandman-timer-mobile.css" />
  <link rel="icon" href="data:," />
</head>
<body data-training-state="idle">
  <main class="training-app">
    <header class="training-header">
      <div>
        <p class="eyebrow">Sandman Shadow Training</p>
        <h1>Shadow Wrestling</h1>
      </div>
      <button id="gearBtn" class="icon-btn" type="button" aria-label="Open settings">Settings</button>
    </header>
    <section class="clock-shell training-stage" aria-live="polite">
      <div class="stage-topline">
        <span id="status" class="status state-badge">READY</span>
        <span id="roundLabel" class="round-label">Round 1 of 10</span>
      </div>
      <p id="roundPurpose" class="round-purpose">FOUNDATION</p>
      <h2 id="currentAction" class="current-action">Move Your Feet</h2>
      <div id="clock" class="clock" aria-label="Time remaining">00:45</div>
      <p id="coachingCue" class="coaching-cue">Build a balanced stance and move under control.</p>
      <div class="next-action"><span>Next</span><strong id="nextAction">Circle Left</strong></div>
      <div class="round-progress" aria-hidden="true">
        <span class="round-dot is-current"></span><span class="round-dot"></span>
        <span class="round-dot"></span><span class="round-dot"></span><span class="round-dot"></span>
        <span class="round-dot"></span><span class="round-dot"></span><span class="round-dot"></span>
        <span class="round-dot"></span><span class="round-dot"></span>
      </div>
    </section>
    <section class="controls">
      <button id="startBtn" class="btn btn-primary" type="button">Start</button>
      <button id="pauseBtn" class="btn btn-secondary" type="button" disabled>Pause</button>
      <button id="stopBtn" class="btn btn-danger" type="button" disabled>Stop</button>
    </section>
    <p id="completionMessage" class="completion-message" hidden>Ten rounds complete. Recover, breathe, and return ready.</p>
    <section id="settings" class="settings" hidden>
      <div class="settings-card">
        <div class="settings-head">
          <h2>Training Settings</h2>
          <button id="closeSettings" class="icon-btn" type="button" aria-label="Close settings">Close</button>
        </div>
        <div class="settings-grid">
          <label class="field inline"><input id="voiceToggle" type="checkbox" checked /><span>Voice prompts</span></label>
          <label class="field">
            <span>Voice volume</span>
            <input id="volume" type="range" min="0" max="1" step="0.05" value="0.9" />
          </label>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="/lab/timer-engine/ui/athlete/sandman-timer-mobile.js"></script>
</body>
</html>
