<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />

  <title>Announcements Feed · Coach</title>

  <link rel="stylesheet" href="/coaches/_ui/coach-shell.css?v=2" />

  <link rel="icon" href="data:," />

  <style>
    :root{
      --line:#27304a;
      --gold:#ffdd48;
      --text:#f0f4f8;
      --muted:#9aa4b1;
      --hover:#1d2a4a;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:transparent;
      color:var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    .wrap{
      max-width:900px;
      margin:0 auto;
      padding:18px 14px 40px;
    }

    .panel{
      padding:16px 18px;
      border:1px solid var(--line);
      border-radius:14px;
      background:rgba(255,255,255,.035);
      box-shadow:0 4px 14px rgba(0,0,0,.35);
    }

    h1{
      margin:0 0 8px;
      color:var(--gold);
      font-size:1.2rem;
    }

    .sub{
      margin:0 0 14px;
      color:var(--muted);
      line-height:1.5;
    }

    .top{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:10px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:10px 14px;
      border:1px solid var(--line);
      border-radius:10px;
      background:rgba(255,255,255,.025);
      color:var(--text);
      font:inherit;
      font-weight:700;
      text-decoration:none;
      cursor:pointer;
    }

    .btn:hover{
      border-color:var(--gold);
      color:var(--gold);
    }

    .card{
      margin:18px 0;
      padding:20px 22px;
      border:1px solid #334155;
      border-radius:18px;
      background:rgba(255,255,255,.025);
      box-shadow:0 6px 20px rgba(0,0,0,.35);
      transition:
        transform .15s ease,
        box-shadow .15s ease;
    }

    .card:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 26px rgba(0,0,0,.45);
    }

    .card-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px;
    }

    .title{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:1.15rem;
      font-weight:900;
    }

    .icon{
      font-size:1.2rem;
      opacity:.9;
    }

    .meta-right{
      font-size:.75rem;
      font-weight:700;
      letter-spacing:.6px;
      text-transform:uppercase;
      opacity:.6;
    }

    .card-body{
      margin-bottom:10px;
      white-space:pre-wrap;
    }

    .card-date{
      font-size:.8rem;
      opacity:.55;
    }

    .pill{
      display:inline-block;
      margin-left:8px;
      padding:2px 8px;
      border-radius:999px;
      background:#334155;
      color:var(--text);
      font-size:.7rem;
      font-weight:800;
    }

    .empty{
      padding:18px;
      text-align:center;
      opacity:.75;
    }

    .status{
      min-height:20px;
      margin:8px 0 4px;
      color:var(--gold);
      font-size:.9rem;
      font-weight:700;
    }

    .scope-note{
      margin:12px 0 16px;
      padding:12px 14px;
      border:1px solid rgba(255,221,72,.2);
      border-radius:12px;
      background:rgba(255,221,72,.05);
      color:var(--muted);
      line-height:1.5;
    }

    .scope-note strong{
      color:var(--gold);
    }

    @media (max-width:640px){
      .wrap{
        padding:12px 10px 30px;
      }

      .panel{
        padding:14px;
      }

      .top{
        display:grid;
        grid-template-columns:1fr;
      }

      .btn{
        width:100%;
      }
    }
  </style>
  <link rel="stylesheet" href="/communications/coach/coach-comms-shell.css?v=2" />
</head>

<body class="coach-shell-page" data-coach-page="Announcements Feed" data-coach-area="communications">

<main class="wrap coach-comms" data-coach-shell-content>

  <section class="panel page-intro">

    <h1>
      Announcements Feed
    </h1>

    <p class="sub">
      Review all active and archived coach broadcasts.
    </p>

    <div class="scope-note">
      <strong>Coach view:</strong>
      this feed shows every announcement.
      Audience and discipline labels identify who each broadcast targets.
    </div>

    <div class="top">

      <a
        class="btn btn-gold"
        href="/communications/coach/broadcast.html"
      >
        + Post Announcement
      </a>

      <button
        id="toggle-archived"
        class="btn btn-utility"
        type="button"
      >
        Show Archived
      </button>

    </div>

    <div
      id="status"
      class="status"
      aria-live="polite"
    ></div>

    <div id="feed"></div>

    <div
      id="empty"
      class="empty"
      style="display:none;"
    >
      No announcements yet.
    </div>

  </section>

</main>

<script src="/coaches/_ui/coach-shell.js?v=2"></script>

<script
  type="module"
  src="/communications/coach/announcements-feed.js"
></script>

</body>
</html>
