<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />

  <title>Join Inbox · Coach</title>

  <link
    rel="stylesheet"
    href="/communications/shared/comms.css"
  />

  <link rel="icon" href="data:," />

  <style>
    :root{
      --bg:#0a1833;
      --panel:#111c35;
      --deep:#0b1120;
      --line:#27304a;
      --gold:#ffdd48;
      --text:#f0f4f8;
      --muted:#9aa4b1;
      --hover:#1d2a4a;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    .pc-header{
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 18px;
      border-bottom:1px solid var(--line);
      background:var(--panel);
      box-shadow:0 2px 8px rgba(0,0,0,.35);
    }

    .pc-header h1{
      margin:0;
      color:var(--gold);
      font-size:1.1rem;
      letter-spacing:.04em;
    }

    .pc-back{
      padding:6px 10px;
      border:0;
      border-radius:10px;
      background:transparent;
      color:var(--text);
      font:inherit;
      cursor:pointer;
    }

    .pc-back:hover{
      background:rgba(255,255,255,.06);
    }

    .wrap{
      max-width:900px;
      margin:0 auto;
      padding:18px 14px 40px;
    }

    .panel{
      padding:16px 18px;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--panel);
      box-shadow:0 4px 14px rgba(0,0,0,.35);
    }

    h2{
      margin:0 0 8px;
      color:var(--gold);
    }

    .sub{
      margin:0;
      color:var(--muted);
      line-height:1.5;
    }

    #inbox-search{
      width:100%;
      margin-top:12px;
      padding:10px;
      border:1px solid var(--line);
      border-radius:10px;
      outline:none;
      background:var(--deep);
      color:var(--text);
      font:inherit;
    }

    #inbox-search:focus{
      border-color:var(--gold);
      box-shadow:0 0 0 2px rgba(255,221,72,.12);
    }

    .filter-block{
      margin-top:14px;
    }

    .filter-label{
      margin:0 0 7px;
      color:var(--muted);
      font-size:.78rem;
      font-weight:900;
      letter-spacing:.06em;
      text-transform:uppercase;
    }

    .inbox-filters{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .filter-btn{
      padding:7px 12px;
      border:1px solid var(--line);
      border-radius:999px;
      background:var(--deep);
      color:var(--text);
      font:inherit;
      cursor:pointer;
      transition:.15s;
    }

    .filter-btn:hover{
      border-color:var(--gold);
      background:var(--hover);
    }

    .filter-btn.is-active{
      border-color:var(--gold);
      color:var(--gold);
      box-shadow:0 0 0 1px rgba(255,221,72,.18);
    }

    .status{
      min-height:22px;
      margin-top:12px;
      color:var(--gold);
      font-size:.9rem;
      font-weight:800;
    }

    .inbox-list{
      display:flex;
      flex-direction:column;
      gap:12px;
      margin-top:10px;
    }

    .inbox-row-wrap{
      margin-bottom:2px;
    }

    .inbox-item{
      display:block;
      padding:14px 16px;
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--deep);
      color:inherit;
      text-decoration:none;
      cursor:pointer;
      transition:.15s;
    }

    .inbox-item:hover{
      border-color:var(--gold);
      background:var(--hover);
    }

    .inbox-item.unread{
      border-color:var(--gold);
      box-shadow:0 0 0 1px rgba(255,221,72,.18);
    }

    .inbox-item.read{
      border-color:#334155;
      opacity:.85;
    }

    .inbox-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .inbox-subject{
      font-weight:900;
    }

    .inbox-meta{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      margin-top:6px;
      color:var(--muted);
      font-size:.78rem;
    }

    .inbox-preview{
      margin-top:8px;
      color:var(--text);
      line-height:1.4;
      white-space:pre-wrap;
      opacity:.92;
    }

    .pill{
      display:inline-block;
      flex:0 0 auto;
      padding:2px 8px;
      border-radius:999px;
      font-size:.65rem;
      font-weight:900;
    }

    .pill-unread{
      background:var(--gold);
      color:#111;
    }

    .pill-read{
      background:#334155;
      color:var(--text);
    }

    .pill-approved{
      background:#173b2d;
      color:#8ff0c2;
    }

    .pill-archived{
      background:#5b4a14;
      color:#ffec9a;
    }

    .pill-deleted{
      background:#5a2323;
      color:#ffd7d7;
    }

    .discipline-pill{
      border:1px solid rgba(255,221,72,.24);
      background:rgba(255,221,72,.08);
      color:var(--gold);
    }

    .intent{
      font-weight:800;
      letter-spacing:.04em;
    }

    .intent-high{
      color:#22c55e;
    }

    .intent-mid{
      color:#f59e0b;
    }

    .intent-low{
      color:#94a3b8;
    }

    .empty{
      padding:18px;
      text-align:center;
      opacity:.75;
    }

    .inbox-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:8px;
      padding-left:4px;
    }

    .inbox-actions button{
      padding:8px 12px;
      border:1px solid #33415c;
      border-radius:10px;
      background:#10182b;
      color:#fff;
      font:inherit;
      cursor:pointer;
      transition:.15s;
    }

    .inbox-actions button:hover{
      border-color:var(--gold);
      opacity:.92;
    }

    .btn-approve-trial,
    .btn-approve-join{
      border-color:#41557d;
      background:#18263f;
    }

    @media (max-width:640px){
      .pc-header{
        padding:12px;
      }

      .wrap{
        padding:12px 10px 30px;
      }

      .panel{
        padding:14px;
      }
    }
  </style>
</head>

<body>

<header class="pc-header">

  <button
    class="pc-back"
    type="button"
    onclick="history.back()"
  >
    ← Back
  </button>

  <h1>Join Inbox</h1>

  <span
    style="
      opacity:.75;
      font-weight:700;
    "
  >
    LAW
  </span>

</header>

<main class="wrap">

  <section class="panel">

    <h2>
      Join & Trial Requests
    </h2>

    <p class="sub">
      Review trial and join requests,
      identify the requested discipline,
      and approve the next step.
    </p>

    <input
      id="inbox-search"
      type="search"
      placeholder="Search athlete, parent, discipline, school, email, or message…"
      autocomplete="off"
    />

    <div class="filter-block">

      <p class="filter-label">
        Status
      </p>

      <div class="inbox-filters">

        <button
          type="button"
          class="filter-btn is-active"
          data-filter="pending"
        >
          Pending
        </button>

        <button
          type="button"
          class="filter-btn"
          data-filter="approved"
        >
          Approved
        </button>

        <button
          type="button"
          class="filter-btn"
          data-filter="archived"
        >
          Archived
        </button>

        <button
          type="button"
          class="filter-btn"
          data-filter="deleted"
        >
          Deleted
        </button>

        <button
          type="button"
          class="filter-btn"
          data-filter="all"
        >
          All
        </button>

      </div>

    </div>

    <div class="filter-block">

      <p class="filter-label">
        Discipline
      </p>

      <div class="inbox-filters">

        <button
          type="button"
          class="filter-btn is-active"
          data-discipline-filter="all"
        >
          All
        </button>

        <button
          type="button"
          class="filter-btn"
          data-discipline-filter="wrestling"
        >
          Wrestling
        </button>

        <button
          type="button"
          class="filter-btn"
          data-discipline-filter="boxing"
        >
          Boxing
        </button>

        <button
          type="button"
          class="filter-btn"
          data-discipline-filter="kickboxing"
        >
          Kickboxing
        </button>

        <button
          type="button"
          class="filter-btn"
          data-discipline-filter="mma"
        >
          MMA
        </button>

        <button
          type="button"
          class="filter-btn"
          data-discipline-filter="submission-grappling"
        >
          Submission Grappling
        </button>

      </div>

    </div>

    <div
      id="inbox-status"
      class="status"
      aria-live="polite"
    ></div>

    <div
      id="inbox-list"
      class="inbox-list"
    ></div>

    <div
      id="inbox-empty"
      class="empty"
      style="display:none;"
    >
      No requests match the current filters.
    </div>

  </section>

</main>

<script
  type="module"
  src="/communications/coach/inbox.js"
></script>

</body>
</html>
