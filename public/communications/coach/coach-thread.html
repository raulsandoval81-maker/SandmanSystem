<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Coach Thread • Para-Comms</title>

  <link rel="stylesheet" href="/coaches/_ui/coach-shell.css?v=2" />
  <link rel="icon" href="data:," />

  <style>
    *{
      box-sizing:border-box;
    }

    .coach-thread-page{
      max-width:980px;
      margin:0 auto;
      padding:24px 16px 64px;
    }

    .coach-thread-panel{
      margin-bottom:16px;
      padding:18px;
      border:1px solid rgba(128,128,128,.22);
      border-radius:16px;
      background:rgba(255,255,255,.035);
    }

    .pc-header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:14px;
      flex-wrap:wrap;
    }

    .pc-title{
      margin:0 0 4px;
      color:var(--coach-gold, #c8a84e);
      font-size:1.35rem;
      font-weight:900;
    }

    .pc-subtitle,
    .pc-muted,
    .reply-note{
      opacity:.72;
    }

    .pc-actions,
    .btn-row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:42px;
      padding:10px 14px;
      border:1px solid rgba(128,128,128,.3);
      border-radius:10px;
      background:transparent;
      color:inherit;
      text-decoration:none;
      font:inherit;
      font-weight:800;
      cursor:pointer;
    }

    .btn:hover{
      border-color:var(--coach-gold, #c8a84e);
    }

    .btn-primary{
      border-color:var(--coach-gold, #c8a84e);
      background:var(--coach-gold, #c8a84e);
      color:#111;
    }

    .btn-danger{
      border-color:rgba(180,55,55,.55);
      color:#b83f3f;
    }

    .thread-shell{
      display:grid;
      gap:10px;
    }

    .thread-scroll{
      min-height:320px;
      max-height:62vh;
      overflow:auto;
      padding:12px;
      border:1px solid rgba(128,128,128,.22);
      border-radius:12px;
      background:rgba(0,0,0,.035);
    }

    .thread-bubbles{
      display:grid;
      gap:10px;
    }

    .msg{
      max-width:86%;
      padding:12px 14px;
      border:1px solid rgba(128,128,128,.22);
      border-radius:14px;
      background:rgba(255,255,255,.04);
    }

    .msg.parent{
      justify-self:start;
    }

    .msg.coach{
      justify-self:end;
      border-color:rgba(200,168,78,.28);
      background:rgba(200,168,78,.07);
    }

    .msg-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:6px;
    }

    .msg-from{
      color:var(--coach-gold, #c8a84e);
      font-size:.92rem;
      font-weight:900;
    }

    .msg-time{
      font-size:.8rem;
      font-weight:700;
      opacity:.65;
    }

    .msg-body{
      white-space:pre-wrap;
      line-height:1.45;
    }

    .thread-empty{
      padding:8px 2px;
      font-style:italic;
      opacity:.7;
    }

    .qr-row{
      display:grid;
      grid-template-columns:1fr auto;
      gap:10px;
      align-items:center;
    }

    .qr-select,
    textarea{
      width:100%;
      padding:10px 12px;
      border:1px solid rgba(128,128,128,.3);
      border-radius:10px;
      background:transparent;
      color:inherit;
      font:inherit;
    }

    .qr-select:focus,
    textarea:focus{
      outline:none;
      border-color:var(--coach-gold, #c8a84e);
      box-shadow:0 0 0 3px rgba(200,168,78,.14);
    }

    .pc-label{
      display:block;
      margin-bottom:8px;
      font-size:.88rem;
      font-weight:800;
      opacity:.75;
    }

    textarea{
      min-height:140px;
      resize:vertical;
    }

    .btn-row{
      margin-top:12px;
    }

    .reply-note{
      margin-top:10px;
      font-size:.88rem;
    }

    @media (max-width:700px){
      .coach-thread-page{
        padding:18px 12px 48px;
      }

      .qr-row{
        grid-template-columns:1fr;
      }

      .msg{
        max-width:100%;
      }

      .pc-actions{
        width:100%;
      }

      .pc-actions .btn{
        flex:1 1 140px;
      }
    }
  </style>
  <link rel="stylesheet" href="/communications/coach/coach-comms-shell.css?v=2" />
</head>

<body class="coach-shell-page" data-coach-page="Coach Thread" data-coach-area="communications">
  <main class="wrap coach-comms" data-coach-shell-content>

    <header class="coach-thread-panel pc-header">
      <div>
        <div class="pc-title">Coach Thread</div>
        <div class="pc-subtitle">Unified parent communication thread</div>
      </div>

      <div class="pc-actions">
        <button id="btn-archive" class="btn btn-secondary" type="button">Archive</button>
        <button id="btn-delete" class="btn btn-danger" type="button">Delete</button>
      </div>
    </header>

    <section class="coach-thread-panel">
      <div class="pc-muted">Conversation</div>

      <div class="thread-shell">
        <div id="thread-container" class="thread-scroll thread-bubbles">
          <div class="thread-empty">Loading thread…</div>
        </div>
      </div>
    </section>

    <section class="coach-thread-panel">
      <div class="pc-muted">Quick Reply (optional)</div>

      <div class="qr-row">
        <select id="qr-select" class="qr-select">
          <option value="">Select a quick response…</option>

          <option value="Got it. Thank you for the update. I’ll follow up shortly.">
            Got it. Thank you for the update. I’ll follow up shortly.
          </option>

          <option value="Thanks for reaching out. Please send a couple dates and times that work for a quick call.">
            Thanks for reaching out. Please send a couple dates and times that work for a quick call.
          </option>

          <option value="I want to make sure I understand correctly. What day and time did this happen?">
            I want to make sure I understand correctly. What day and time did this happen?
          </option>

          <option value="I received your message. I’ll handle this and circle back if needed.">
            I received your message. I’ll handle this and circle back if needed.
          </option>

          <option value="Let’s bring this up at practice so we can address it in person and move forward clearly.">
            Let’s bring this up at practice so we can address it in person and move forward clearly.
          </option>
        </select>

        <button id="qr-insert" class="btn btn-secondary" type="button">Insert</button>
      </div>
    </section>

<section id="reply-panel" class="coach-thread-panel">

  <label class="pc-label" for="reply-body">
    Reply
  </label>

  <textarea
    id="reply-body"
    rows="5"
    placeholder="Write your reply here..."
  ></textarea>

  <div class="btn-row">
    <button
      id="btn-send-reply"
      class="btn btn-primary"
      type="button"
    >
      Send Reply
    </button>
  </div>

  <div class="reply-note">
    Reply sends into the unified parent thread and should stay clear, direct, and coach-level.
  </div>

</section>
  </main>
  <script src="/coaches/_ui/coach-shell.js?v=2"></script>
  <script type="module" src="/communications/coach/coach-thread.js"></script>
</body>
</html>
