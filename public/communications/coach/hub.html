<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />

  <title>Coach Communication Hub</title>

  <link
    rel="stylesheet"
    href="/communications/shared/comms.css"
  />

  <link rel="icon" href="data:," />

  <style>
    :root{
      --bg:#0a1833;
      --panel:#111c35;
      --deep:#0b1120;
      --line:#27304a;
      --gold:#ffdd48;
      --text:#f0f4f8;
      --muted:#9aa4b1;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    .wrap{
      max-width:900px;
      margin:0 auto;
      padding:18px 14px 60px;
    }

    h1{
      margin:0 0 14px;
      color:var(--gold);
      text-align:center;
      letter-spacing:.02em;
    }

    .panel{
      margin-bottom:14px;
      padding:14px;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--panel);
      box-shadow:0 4px 14px rgba(0,0,0,.25);
    }

    .headline{
      margin-bottom:10px;
      color:var(--gold);
      font-weight:900;
    }

    .muted{
      color:var(--muted);
      opacity:.8;
    }

    .row{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    input{
      flex:1;
      min-width:220px;
      padding:10px;
      border:1px solid var(--line);
      border-radius:10px;
      outline:none;
      background:var(--deep);
      color:var(--text);
      font:inherit;
    }

    input:focus{
      border-color:var(--gold);
      box-shadow:0 0 0 3px rgba(255,221,72,.18);
    }

    .btn{
      padding:10px 14px;
      border:none;
      border-radius:10px;
      font:inherit;
      font-weight:900;
      cursor:pointer;
    }

    .btn-gold{
      background:var(--gold);
      color:#111;
    }

    .btn-dark{
      border:1px solid var(--line);
      background:#1d2a4a;
      color:var(--text);
    }

    .btn:hover{
      filter:brightness(1.08);
    }

    .list{
      display:grid;
      gap:10px;
    }

    a.card{
      display:block;
      padding:12px;
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--deep);
      color:inherit;
      text-decoration:none;
      transition:
        transform .15s ease,
        border-color .15s ease,
        background .15s ease;
    }

    a.card:hover{
      transform:translateY(-1px);
      border-color:var(--gold);
      background:#111a31;
    }

    .title{
      font-weight:900;
    }

    .sub{
      margin-top:4px;
      color:var(--muted);
      font-size:.9rem;
      line-height:1.45;
    }

    .body{
      margin-top:7px;
      white-space:pre-wrap;
      line-height:1.45;
      opacity:.92;
    }

    .pill{
      display:inline-block;
      margin-left:8px;
      padding:3px 8px;
      border:1px solid var(--line);
      border-radius:999px;
      font-size:.75rem;
      font-weight:900;
    }

    .pill.unread{
      color:var(--gold);
    }

    .scope-note{
      margin-top:10px;
      padding:11px 12px;
      border:1px solid rgba(255,221,72,.2);
      border-radius:10px;
      background:rgba(255,221,72,.05);
      color:var(--muted);
      line-height:1.5;
    }

    .scope-note strong{
      color:var(--gold);
    }

    @media (max-width:620px){
      .row{
        display:grid;
        grid-template-columns:1fr;
      }

      input,
      .btn{
        width:100%;
      }
    }
  </style>
</head>

<body>

<main class="wrap">

  <h1>Coach Communication Hub</h1>

  <section class="panel">

    <div class="headline">
      Open Athlete Thread
    </div>

    <div class="row">

      <input
        id="open-id"
        type="text"
        placeholder="Enter athlete ID, for example F4_0001"
        autocomplete="off"
      />

      <button
        id="btn-open"
        class="btn btn-gold"
        type="button"
      >
        Open
      </button>

      <button
        class="btn btn-dark"
        type="button"
        onclick="history.back()"
      >
        Back
      </button>

    </div>

    <div class="scope-note">
      <strong>Active-family threads only.</strong>
      This hub reads established athlete-family conversations from
      <code>paraThreads</code>. Join and trial requests remain in the separate
      Join Inbox.
    </div>

  </section>

  <section class="panel">

    <div class="headline">
      Unread Threads
    </div>

    <div
      id="status"
      class="muted"
      aria-live="polite"
    >
      Loading…
    </div>

    <div
      id="list"
      class="list"
      style="margin-top:10px;"
    ></div>

  </section>

  <section class="panel">

    <div class="headline">
      Recent Active Threads
    </div>

    <div
      id="status2"
      class="muted"
      aria-live="polite"
    >
      Loading…
    </div>

    <div
      id="list2"
      class="list"
      style="margin-top:10px;"
    ></div>

  </section>

</main>

<script
  type="module"
  src="/communications/coach/hub.js"
></script>

</body>
</html>
