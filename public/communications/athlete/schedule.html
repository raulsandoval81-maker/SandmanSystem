<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schedule</title>

  <link rel="stylesheet" href="/communications/shared/comms.css">
  <link rel="stylesheet" href="/assets/css/athlete-ui.css">
  <script type="module" src="/assets/js/athlete-nav.js"></script>
  <link rel="icon" href="data:,">

  <style>
    :root{
      --bg:#0a1833;
      --panel:#111c35;
      --deep:#0b1120;
      --line:#27304a;
      --gold:#ffdd48;
      --text:#f0f4f8;
      --muted:#9aa4b1;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }

    .wrap{
      max-width:900px;
      margin:0 auto;
      padding:24px 16px 40px;
    }

    .panel{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:14px;
      padding:16px 18px;
      box-shadow:0 4px 14px rgba(0,0,0,.35);
      margin-bottom:16px;
    }

    h1,h2{
      margin:0 0 10px;
      color:var(--gold);
    }

    .sub{
      color:var(--muted);
      margin-bottom:10px;
    }

    .list{
      display:grid;
      gap:10px;
    }

    .item{
      background:var(--deep);
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px;
    }

    .item-top{
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }

    .item-day{
      color:var(--gold);
      font-weight:900;
    }

    .item-time{
      color:var(--muted);
      font-weight:700;
    }

    .item-title{
      font-weight:800;
      margin-top:4px;
    }

    .item-sub{
      color:var(--muted);
      margin-top:4px;
      font-size:.9rem;
    }

    .live{
      color:#ff4d4d;
      font-weight:900;
      margin-top:4px;
    }

    /* Schedule semantic polish */
    .today-box{
      position:relative;
      overflow:hidden;
    }

    .item{
      position:relative;
    }

    .schedule-category--combat{
      border-left:4px solid #9aa4b1;
    }

    .schedule-category--fitness{
      border-left:4px solid #2ea69a;
    }

    .schedule-provider--sandman{
      box-shadow:inset 0 0 0 1px rgba(255,221,72,.08);
    }

    .schedule-provider--yesc{
      box-shadow:inset 0 0 0 1px rgba(46,166,154,.09);
    }

    .schedule-state--active{
      border-color:rgba(255,221,72,.45);
    }

    .schedule-state--next{
      border-color:rgba(255,221,72,.28);
    }

    @media(min-width:900px){
      #daily-schedule{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
    }

    /* Athlete schedule — day mode contrast */
    body.day-mode .panel,
    body.day-mode .item,
    body.day .panel,
    body.day .item{
      background:#f7f8fa;
      border-color:#c7ccd3;
      color:#172033;
      box-shadow:0 6px 16px rgba(0,0,0,.06);
    }

    body.day-mode h1,
    body.day-mode h2,
    body.day h1,
    body.day h2{
      color:#6f5915;
    }

    body.day-mode .item-day,
    body.day-mode .item-title,
    body.day .item-day,
    body.day .item-title{
      color:#172033;
    }

    body.day-mode .item-time,
    body.day-mode .item-sub,
    body.day-mode .sub,
    body.day .item-time,
    body.day .item-sub,
    body.day .sub{
      color:#4b5565;
    }

    /* Combat family rim accents */

    .schedule-family--grappling{
      border-left:4px solid #60a5fa;
    }

    .schedule-family--striking{
      border-left:4px solid #d97706;
    }


    /* Final discipline rim enforcement */

    #today-box .item.schedule-family--grappling,
    #daily-schedule .item.schedule-family--grappling{
      border-left:4px solid #60a5fa !important;
    }

    #today-box .item.schedule-family--striking,
    #daily-schedule .item.schedule-family--striking{
      border-left:4px solid #d97706 !important;
    }


    /* Next-session summary only */

    #today-box > .item:first-child{
      border:2px solid #48bb78 !important;
      border-radius:12px;
    }


    /* Next-session breathing room */

    #today-box > .item:first-child{
      padding:16px 14px !important;
      margin-bottom:12px;
    }

    #today-box > .item:first-child .item-title{
      margin-top:6px;
    }

    #today-box > .item:first-child .item-time{
      margin-top:4px;
    }

    #today-box > .item:first-child .item-sub{
      margin-top:6px;
    }


    /* Next-session countdown emphasis */

    #today-box > .item:first-child .item-sub{
      font-weight:800;
    }



    /* SANDMAN-ATHLETE-WEEKLY-ACCORDION-BRIDGE */
    .sandman-weekly-accordion{
      width:100%;
    }

    .sandman-weekly-accordion > .list{
      margin-top:14px;
    }

</style>
  <link rel="stylesheet" href="/assets/css/f4-athlete.css">
  <link rel="stylesheet" href="/communications/athlete/athlete-communications.css">
  <link rel="stylesheet" href="/assets/css/competition-events.css">
</head>

<body class="athlete-app athlete-comms-page">
<main class="wrap athlete-comms">

  <!-- HEADER -->
  <section class="athlete-comms__hero">
    <p class="athlete-comms__eyebrow">Training calendar</p>
    <h1>Schedule</h1>
    <p>Know what’s on deck.</p>
  </section>

  <!-- TODAY -->
  <div class="panel">
    <h2>Today’s Practice</h2>
    <div id="today-box">
      <p class="sub">Loading today...</p>
    </div>
  </div>

  <!-- WEEKLY -->
  <div class="panel">
    <h2>Weekly Practice</h2>
    <div id="daily-schedule" class="list"></div>
  </div>

  <!-- EVENTS -->
  <div class="panel">
    <h2>Upcoming Events</h2>
    <div
      id="competition-upcoming-list"
      class="member-competition-list member-competition-list--promoted"
      hidden
    ></div>
    <div id="tournament-schedule" class="list"></div>
  </div>
  <div class="panel"><h2>Competition Schedule</h2><p class="sub">Published events for your program.</p><div id="competition-events-list" class="member-competition-list"><p class="sub">Loading competitions…</p></div></div>

</main>

<script type="module" src="/communications/athlete/schedule-feed.js"></script>
<script src="/communications/athlete/f4-communications.js"></script>
</body>
</html>
