<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Communications | Sandman Athlete</title>
  <link rel="stylesheet" href="/assets/css/athlete-ui.css">
  <link rel="stylesheet" href="/assets/css/f4-athlete.css">
  <link rel="stylesheet" href="/communications/athlete/athlete-communications.css">
</head>
<body class="athlete-comms-page">
  <main class="athlete-comms">
    <section class="athlete-comms__hero"><p class="athlete-comms__eyebrow">From your coaches</p><h1>Communications</h1><p>Stay connected to team announcements and the current practice and tournament schedule.</p></section>
    <section class="athlete-comms-grid" aria-label="Athlete communication tools">
      <a class="athlete-comms-card" data-context-link href="/athletes/bulletin/announcements.html"><span class="athlete-comms-card__icon" aria-hidden="true">📣</span><h2>Announcements</h2><p>Read team updates and athlete notices.</p></a>
      <a class="athlete-comms-card" data-context-link href="/communications/athlete/schedule.html"><span class="athlete-comms-card__icon" aria-hidden="true">📅</span><h2>Schedule</h2><p>Check practices and upcoming tournament information.</p></a>
    </section>
  </main>
  <script>
    const q=new URLSearchParams(location.search);
    const contextId=String(q.get("id")||q.get("athleteId")||q.get("uid")||localStorage.getItem("sandman_lastAthleteUid")||localStorage.getItem("currentAthleteId")||"").trim().toUpperCase();
    if(contextId.startsWith("F4_"))document.body.classList.add("f4-athlete");
    document.querySelectorAll("[data-context-link]").forEach(a=>{const u=new URL(a.href);q.forEach((v,k)=>u.searchParams.set(k,v));a.href=u.pathname+u.search});
  </script>
  <script type="module" src="/assets/js/athlete-nav.js"></script>
</body>
</html>
