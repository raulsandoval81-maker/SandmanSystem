<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Communications | Sandman Athlete</title>
  <link rel="stylesheet" href="/assets/css/athlete-ui.css">
  <style>
    .comms-home{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:clamp(28px,5vw,64px) 0}
    .comms-hero{padding:clamp(26px,4vw,50px);border-radius:24px;background:linear-gradient(125deg,#0a3167,#1761ad);color:#fff;box-shadow:var(--athlete-shadow);border-bottom:4px solid var(--athlete-gold)}
    .comms-hero p{max-width:62ch;color:#dfeafd;line-height:1.6}.comms-hero h1{font-size:clamp(2rem,5vw,3.8rem);margin:.15em 0}
    .eyebrow{color:#f0d276!important;font-weight:900;letter-spacing:.13em;text-transform:uppercase;font-size:.75rem}
    .comms-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:24px}
    .comms-card{display:block;padding:28px;border-radius:20px;background:var(--athlete-panel);color:var(--athlete-ink);border:1px solid var(--athlete-line);box-shadow:var(--athlete-shadow);text-decoration:none}
    .comms-card:hover{transform:translateY(-2px);border-color:var(--athlete-gold)}.comms-card h2{color:var(--athlete-blue);margin:.25em 0}.comms-card p{color:var(--athlete-muted);line-height:1.55}
    @media(max-width:680px){.comms-grid{grid-template-columns:1fr}.comms-home{width:calc(100% - 20px)}}
  </style>
  <link rel="stylesheet" href="/assets/css/f4-athlete.css">
</head>
<body>
  <main class="comms-home">
    <section class="comms-hero"><p class="eyebrow">From your coaches</p><h1>Communications</h1><p>Stay connected to team announcements and the current practice and tournament schedule.</p></section>
    <section class="comms-grid" aria-label="Athlete communication tools">
      <a class="comms-card" data-context-link href="/athletes/bulletin/announcements.html"><span aria-hidden="true">📣</span><h2>Announcements</h2><p>Read team updates and Athlete notices.</p></a>
      <a class="comms-card" data-context-link href="/communications/athlete/schedule.html"><span aria-hidden="true">📅</span><h2>Schedule</h2><p>Check practices and upcoming tournament information.</p></a>
    </section>
  </main>
  <script>
    const q=new URLSearchParams(location.search);
    const contextId=String(q.get("id")||q.get("athleteId")||q.get("uid")||localStorage.getItem("sandman_lastAthleteUid")||localStorage.getItem("currentAthleteId")||"").trim().toUpperCase();
    if(contextId.startsWith("F4_"))document.body.classList.add("f4-athlete");
    document.querySelectorAll("[data-context-link]").forEach(a=>{const u=new URL(a.href);q.forEach((v,k)=>u.searchParams.set(k,v));a.href=u.pathname+u.search});
  </script>
  <script type="module" src="/assets/js/athlete-nav.js"></script>
</body>
</html>
