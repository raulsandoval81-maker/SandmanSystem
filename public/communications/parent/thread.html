<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />

  <title>Message Thread</title>

  <link
    rel="stylesheet"
    href="/communications/shared/comms.css"
  />

  <link rel="icon" href="data:," />

  <style>
    :root{
      --bg:#0a1833;
      --panel:#111c35;
      --deep:#0f1a33;
      --line:#27304a;
      --gold:#ffdd48;
      --text:#f0f4f8;
      --muted:#9aa4b1;
      --danger:#ff6b6b;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    .pc-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 18px;
      border-bottom:1px solid #1f2c45;
      background:#0b1428;
    }

    .pc-header h1{
      margin:0;
      color:var(--gold);
      font-size:1.3rem;
      letter-spacing:.5px;
    }

    .pc-back,
    .pc-home{
      color:var(--gold);
      text-decoration:none;
      font-size:1rem;
    }

    .wrap{
      max-width:760px;
      margin:0 auto;
      padding:20px;
    }

    .thread-context{
      display:grid;
      grid-template-columns:
        repeat(2,minmax(0,1fr));
      gap:12px;
      margin-bottom:14px;
      padding:12px 14px;
      border:1px solid rgba(255,221,72,.22);
      border-radius:12px;
      background:rgba(255,221,72,.05);
    }

    .context-item{
      min-width:0;
    }

    .context-label{
      display:block;
      margin-bottom:4px;
      color:var(--muted);
      font-size:.75rem;
      font-weight:900;
      letter-spacing:.06em;
      text-transform:uppercase;
    }

    .context-value{
      color:var(--gold);
      font-weight:900;
      overflow-wrap:anywhere;
    }

    .thread-box{
      min-height:220px;
      max-height:62vh;
      overflow:auto;
      padding:18px;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--deep);
      scroll-behavior:smooth;
    }

    .msg-group{
      margin-bottom:16px;
    }

    .msg-group.coach{
      text-align:right;
    }

    .msg-group.parent{
      text-align:left;
    }

    .group-from{
      margin-bottom:6px;
      color:var(--gold);
      font-size:.9rem;
      font-weight:900;
    }

    .bubble-wrap{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:4px;
      margin-bottom:8px;
    }

    .msg-group.coach .bubble-wrap{
      align-items:flex-end;
    }

    .msg-bubble{
      max-width:86%;
      padding:11px 13px;
      border:1px solid var(--line);
      border-radius:14px;
      background:#111c35;
      color:#d8e1ee;
      line-height:1.45;
      text-align:left;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }

    .msg-group.coach .msg-bubble{
      border-color:#3b4d73;
      background:#16233d;
    }

    .msg-stamp{
      color:var(--muted);
      font-size:.76rem;
    }

    .reply-box{
      margin-top:20px;
      padding:18px;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--deep);
    }

    .reply-box[hidden]{
      display:none;
    }

    textarea{
      width:100%;
      min-height:120px;
      padding:12px;
      resize:vertical;
      border:1px solid var(--line);
      border-radius:10px;
      background:#111c35;
      color:#fff;
      font:inherit;
      outline:none;
    }

    textarea:focus{
      border-color:var(--gold);
      box-shadow:
        0 0 0 3px rgba(255,221,72,.16);
    }

    textarea:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .btn-send{
      width:100%;
      margin-top:12px;
      padding:12px;
      border:0;
      border-radius:10px;
      background:var(--gold);
      color:#111;
      font:inherit;
      font-size:1rem;
      font-weight:800;
      cursor:pointer;
    }

    .btn-send:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    #reply-success,
    #reply-error{
      display:none;
      margin:12px 0 0;
      font-size:.95rem;
      font-weight:800;
      line-height:1.4;
    }

    #reply-success{
      color:var(--gold);
    }

    #reply-error{
      color:var(--danger);
    }

    .thread-note{
      margin-top:12px;
      color:var(--muted);
      font-size:.86rem;
      line-height:1.45;
    }

    #thread-limit-banner{
      background:#1e293b;
      color:var(--gold);
      padding:12px;
      margin:12px 0;
      border:1px solid #334155;
      font-weight:700;
      text-align:center;
      border-radius:10px;
    }

    @media (max-width:620px){
      .wrap{
        padding:14px 10px 30px;
      }

      .thread-context{
        grid-template-columns:1fr;
      }

      .msg-bubble{
        max-width:96%;
      }
    }
  </style>
</head>

<body>

<header class="pc-header">

  <a
    class="pc-back"
    href="/communications/parent/index.html"
  >
    ← Back
  </a>

  <h1>Message Thread</h1>

  <a
    class="pc-home"
    href="/communications/parent/index.html"
    aria-label="Parent Home"
  >
    🏠
  </a>

</header>

<main class="wrap">

  <section class="thread-context">

    <div class="context-item">

      <span class="context-label">
        Athlete
      </span>

      <span
        id="thread-athlete"
        class="context-value"
      >
        Loading…
      </span>

    </div>

    <div class="context-item">

      <span class="context-label">
        Discipline
      </span>

      <span
        id="thread-discipline"
        class="context-value"
      >
        Loading…
      </span>

    </div>

  </section>

  <div
    id="thread"
    class="thread-box"
  >
    <p>Loading thread…</p>
  </div>

  <section
    id="reply-panel"
    class="reply-box"
  >

    <textarea
      id="reply-text"
      rows="4"
      placeholder="Write your reply…"
    ></textarea>

    <button
      id="reply-send"
      class="btn-send"
      type="button"
    >
      Send Reply
    </button>

    <p
      id="reply-success"
      aria-live="polite"
    >
      Reply sent.
    </p>

    <p
      id="reply-error"
      aria-live="assertive"
    ></p>

    <div class="thread-note">
      This conversation is limited to 12 total messages.
      Once the limit is reached, contact the coach by phone
      or arrange an in-person conversation.
    </div>

  </section>

</main>

<script
  type="module"
  src="/communications/parent/thread.js"
></script>

</body>
</html>
