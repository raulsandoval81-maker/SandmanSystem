<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Intake Submitted | Sandman System</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="data:," />

  <style>
    :root{
      --bg:#090909;
      --panel:#141414;
      --gold:#facc15;
      --text:#f4f4f5;
      --muted:#b8bcc4;
      --border:#2a2a2a;
    }

    *{ box-sizing:border-box; }

    html{ background:var(--bg); }

    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at top, rgba(250,204,21,.12), transparent 34%),
        var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    .page{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:32px 16px;
    }

    .card{
      width:100%;
      max-width:720px;
      padding:34px 26px;
      text-align:center;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:22px;
      box-shadow:0 22px 50px rgba(0,0,0,.5);
    }

    .eyebrow{
      margin:0 0 10px;
      color:var(--gold);
      font-size:.78rem;
      font-weight:900;
      letter-spacing:.18em;
      text-transform:uppercase;
    }

    h1{
      margin:0 0 16px;
      color:#fff;
      font-size:clamp(2rem,6vw,3.4rem);
      line-height:1.05;
    }

    .lead,
    .message{
      max-width:600px;
      margin:0 auto;
      color:var(--muted);
      font-size:1.04rem;
      line-height:1.65;
    }

    .message{ margin-top:18px; }

    .motto{
      margin:30px 0 0;
      color:var(--gold);
      font-weight:800;
      letter-spacing:.08em;
    }

    .system-line{
      margin:8px 0 0;
      color:rgba(255,255,255,.62);
      font-size:.82rem;
    }

    @media (max-width:600px){
      .page{ padding:18px 12px; }
      .card{ padding:26px 18px; border-radius:18px; }
      .lead,.message{ font-size:.98rem; }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">
      <p class="eyebrow">Sandman System™ · Enrollment</p>

      <h1>Intake Submitted</h1>

      <p class="lead">
        Thank you. Your intake has been received.
      </p>

      <p class="message">
        Management will review your information and continue with the next step in your enrollment.
      </p>

      <p class="message">
        No additional action is required right now.
      </p>

      <p class="motto">Built in the Shadows.</p>

      <p class="system-line">Sandman System™ · Secure Enrollment</p>
    </section>
  </main>
</body>
</html>
