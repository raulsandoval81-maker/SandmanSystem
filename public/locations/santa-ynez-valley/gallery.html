<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Gallery | Sandman Academy — Santa Ynez Valley</title>

  <meta
    name="description"
    content="See training and academy life at Sandman Academy in the Santa Ynez Valley."
  >

  <link rel="stylesheet" href="/assets/css/site.css">

  <style>
    .gallery-page{
      width:min(1120px,calc(100% - 32px));
      margin:0 auto;
      padding:clamp(3rem,8vw,6rem) 0;
    }

    .gallery-header{
      max-width:760px;
      margin:0 auto 3rem;
      text-align:center;
    }

    .eyebrow{
      margin:0 0 .75rem;
      color:var(--heading-accent,#d4af37);
      font-size:.8rem;
      font-weight:900;
      letter-spacing:.16em;
      text-transform:uppercase;
    }

    .gallery-header h1{
      margin:0;
      color:var(--heading,#fff);
      font-size:clamp(2.7rem,8vw,5rem);
      line-height:1;
      text-transform:uppercase;
    }

    .gallery-header p:last-child{
      max-width:620px;
      margin:1rem auto 0;
      color:var(--muted,#d0d0d4);
      line-height:1.7;
    }

    .gallery-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:18px;
    }

    .gallery-placeholder{
      position:relative;
      min-height:300px;
      overflow:hidden;
      border:1px solid var(--line,rgba(255,255,255,.12));
      border-radius:18px;
      background:var(--panel,#111113);
    }

    .gallery-placeholder img{
      display:block;
      width:100%;
      height:100%;
      min-height:300px;
      object-fit:cover;
    }

    .gallery-placeholder span{
      position:absolute;
      left:1rem;
      bottom:1rem;
      z-index:2;
      padding:.5rem .8rem;
      border-radius:999px;
      background:rgba(5,5,5,.78);
      color:#fff;
      font-size:.82rem;
      font-weight:900;
      letter-spacing:.06em;
      text-transform:uppercase;
      backdrop-filter:blur(8px);
    }

    .gallery-placeholder::after{
      position:absolute;
      inset:0;
      content:"";
      pointer-events:none;
      background:linear-gradient(
        180deg,
        transparent 48%,
        rgba(0,0,0,.58) 100%
      );
    }

    .gallery-placeholder--wide{
      grid-column:span 2;
    }

    .gallery-cta{
      max-width:760px;
      margin:3.5rem auto 0;
      padding:2.5rem;
      border:1px solid rgba(212,175,55,.35);
      border-radius:22px;
      text-align:center;
    }

    .gallery-cta h2{
      margin:0;
      color:var(--heading,#fff);
      font-size:clamp(1.8rem,5vw,2.8rem);
      text-transform:uppercase;
    }

    .gallery-cta p{
      color:var(--muted,#d0d0d4);
      line-height:1.6;
    }

    .button{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:48px;
      margin-top:.75rem;
      padding:12px 22px;
      border:1px solid #e7c968;
      border-radius:999px;
      background:#d4af37;
      color:#090909;
      font-weight:900;
      text-decoration:none;
    }

    body.day-mode .gallery-placeholder{
      background:#fff;
      border-color:#d7c7a2;
      color:#555;
    }

    @media(max-width:760px){
      .gallery-grid{
        grid-template-columns:1fr 1fr;
      }

      .gallery-placeholder--wide{
        grid-column:span 2;
      }
    }

    @media(max-width:520px){
      .gallery-grid{
        grid-template-columns:1fr;
      }

      .gallery-placeholder--wide{
        grid-column:span 1;
      }
    }
  
    /* LIGHT MODE — PAGE TITLE CONTRAST */
    html[data-theme="light"] main h1{
      color:#111 !important;
    }

  </style>
</head>

<body>

  <div
    id="navigation"
    data-component="/locations/santa-ynez-valley/components/navigation.html"
  ></div>

  <div
    class="site-hero-divider"
    aria-hidden="true"
  ></div>


  <main class="gallery-page">

    <section class="gallery-header">


      <h1>In The Room</h1>

      <p>
        Real training. Real athletes.
        Built in the Shadows.
      </p>
    </section>

    <!--
      Replace these placeholders with real Sandman-owned
      Santa Ynez Valley photos.
    -->
    <section class="gallery-grid">

      <div class="gallery-placeholder gallery-placeholder--wide">
        <img
          src="/assets/images/locations/santa-ynez-valley/gallery/wrestling.webp"
          alt="Coach with a wrestler during competition"
          loading="lazy"
        >
        <span>Wrestling</span>
      </div>

      <div class="gallery-placeholder">
        <img
          src="/assets/images/locations/santa-ynez-valley/gallery/muay-thai.webp"
          alt="Muay Thai athlete training kicks on a heavy bag"
          loading="lazy"
        >
        <span>Muay Thai</span>
      </div>

      <div class="gallery-placeholder">
        <img
          src="/assets/images/locations/santa-ynez-valley/gallery/boxing.webp"
          alt="Coach with boxer inside the ring"
          loading="lazy"
        >
        <span>Boxing</span>
      </div>

      <div class="gallery-placeholder gallery-placeholder--wide">
        <img
          src="/assets/images/locations/santa-ynez-valley/gallery/strength-conditioning.webp"
          alt="Athlete working through a conditioning drill"
          loading="lazy"
        >
        <span>Strength &amp; Conditioning</span>
      </div>

      <div class="gallery-placeholder">
        <img
          src="/assets/images/locations/santa-ynez-valley/gallery/academy-life.webp"
          alt="Sandman family together at a wrestling event"
          loading="lazy"
        >
        <span>Academy Life</span>
      </div>

      <div class="gallery-placeholder">
        <img
          src="/assets/images/locations/santa-ynez-valley/gallery/competition.webp"
          alt="Fight team preparing backstage for competition"
          loading="lazy"
        >
        <span>Competition</span>
      </div>

    </section>

    <section class="gallery-cta">
      <h2>See Yourself Here?</h2>

      <p>
        Take the first step and learn more about training
        with Sandman Academy.
      </p>

      <a
        class="button"
        href="/locations/santa-ynez-valley/connect.html"
      >
        Connect / Join
      </a>
    </section>

  </main>

  <div
    id="footer"
    data-component="/components/footer.html"
  ></div>

  <script src="/assets/js/component-loader.js" defer></script>
  <script src="/assets/js/language.js" defer></script>
  <script src="/assets/js/theme.js" defer></script>
  <script src="/assets/js/navigation.js" defer></script>

</body>
</html>
